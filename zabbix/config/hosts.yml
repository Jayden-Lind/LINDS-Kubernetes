---
# Every monitored host. LLD-discovered hosts (VMware guests, Kubernetes
# components, Proxmox VMs) are not configuration and are not listed - they come
# and go with discovery.
#
# force: true is set explicitly rather than left to the module default, because
# it is the one place this playbook is authoritative rather than additive: a
# template linked or a macro added in the frontend is removed on the next sync.
# That is the trade for "a rebuild reproduces the hosts exactly", and hosts are
# the object type where that matters most.
#
# Interfaces here are all SNMP, plus IPMI on the two machines with a BMC. There
# is no Zabbix agent on any of them; the agent DaemonSet monitors the Kubernetes
# nodes and registers separately.

- name: Proxmox hypervisors
  community.zabbix.zabbix_host:
    host_name: "{{ item.host_name }}"
    host_groups: [Discovered hosts, Hypervisors, Applications]
    link_templates: [Proxmox VE by HTTP]
    status: enabled
    inventory_mode: automatic
    force: true
    interfaces:
      - type: snmp
        main: 1
        useip: 1
        ip: "{{ item.ip }}"
        port: "161"
        details:
          version: 2
          bulk: 1
          community: "{$SNMP_COMMUNITY}"
    macros:
      - macro: "{$PVE.TOKEN.ID}"
        value: root@pam!zabbix
      # Injected from Vault at apply time, so the value is never in git.
      #
      # Deliberately `text` and not `secret`. Zabbix does not return a secret
      # macro's value over the API, so the module has nothing to compare
      # against and reports the host changed on every single run - which would
      # make a real change indistinguishable from a no-op in the Job log. The
      # value being readable by a Zabbix super admin is no worse than today.
      # The proper fix is a Vault-type macro; see "Secrets" in ../README.md.
      - macro: "{$PVE.TOKEN.SECRET}"
        value: "{{ item.token_secret }}"
        description: "From Vault: linds-keyvault/zabbix-config."
      # Disables "Proxmox: VM [...] high memory usage". Proxmox reports a QEMU
      # guest's `mem` from the balloon driver, which by design sits near the
      # assigned maximum on a healthy VM, so the trigger fires on VMs that are
      # simply doing their job - 126 events across both nodes, none of them a
      # real problem. The ratio cannot exceed 100, so 101 is unreachable.
      #
      # Set here rather than by disabling the trigger prototype, because the
      # prototype belongs to an upstream template: a template update could
      # silently re-enable it, and nothing in this repository would show the
      # change. The Node and LXC thresholds are deliberately left at 98 -
      # hypervisor memory pressure is a real signal and the LXC figure is not
      # balloon-derived.
      - macro: "{$PVE.VM.MEMORY.PUSE.MAX.WARN}"
        value: "101"
        description: "Disabled: balloon-derived, fires on healthy VMs."
  loop:
    - host_name: JD-Proxmox-02
      ip: 10.0.50.246
      token_secret: "{{ lookup('env', 'PVE_TOKEN_SECRET_JD') }}"
    - host_name: LINDS-Proxmox-01
      ip: 192.168.6.205
      token_secret: "{{ lookup('env', 'PVE_TOKEN_SECRET_LINDS') }}"
  loop_control:
    label: "{{ item.host_name }}"
  no_log: true

# Same physical machine as JD-Proxmox-02 above, seen through its BMC rather
# than the Proxmox API. The names differ only in case, which is confusing and
# deliberate to leave alone: renaming a host in Zabbix orphans its history.
- name: jd-proxmox-02 (BMC)
  community.zabbix.zabbix_host:
    host_name: jd-proxmox-02
    host_groups: [Discovered hosts, Hypervisors, Applications]
    link_templates: [Chassis by IPMI]
    status: enabled
    inventory_mode: automatic
    force: true
    interfaces:
      - type: ipmi
        main: 1
        useip: 1
        ip: 10.0.50.240
        port: "623"
      - type: snmp
        main: 1
        useip: 1
        ip: 10.0.50.240
        port: "161"
        details:
          version: 3
          bulk: 1
          securityname: ""
          # authNoPriv with SHA256. The BMC's SNMP auth passphrase is the same
          # string as its IPMI password.
          securitylevel: 1
          authprotocol: 3
          authpassphrase: "{{ lookup('env', 'SNMPV3_AUTH_PASSPHRASE') }}"
          privprotocol: 0
          privpassphrase: ""
          contextname: ""
    macros:
      - macro: "{$IPMI.USER}"
        value: USERID
      # text, not secret - same reasoning as the Proxmox token above.
      - macro: "{$IPMI.PASSWORD}"
        value: "{{ lookup('env', 'IPMI_PASSWORD') }}"
        description: "From Vault: linds-keyvault/zabbix-config."
  no_log: true

- name: SNMP-only hosts
  community.zabbix.zabbix_host:
    host_name: "{{ item.host_name }}"
    visible_name: "{{ item.visible_name | default(omit) }}"
    host_groups: "{{ item.host_groups }}"
    link_templates: "{{ item.link_templates }}"
    status: enabled
    inventory_mode: "{{ item.inventory_mode | default('automatic') }}"
    force: true
    interfaces:
      - type: snmp
        main: 1
        useip: 1
        ip: "{{ item.ip }}"
        dns: "{{ item.dns | default('') }}"
        port: "161"
        details:
          version: 2
          bulk: "{{ item.bulk | default(1) }}"
          community: "{$SNMP_COMMUNITY}"
  loop:
    # Technical name is the bare IP for historical reasons; the visible name is
    # what appears everywhere in the frontend.
    - host_name: 192.168.6.1
      visible_name: LINDS-OPNSense-01
      host_groups: [Discovered hosts]
      link_templates: [Template OS VyOS SNMPv2]
      ip: 192.168.6.1

    - host_name: jd-opnsense-01.linds.com.au
      visible_name: JD-OPNSense-01
      host_groups: [Discovered hosts]
      link_templates: [Template OS VyOS SNMPv2]
      ip: 10.0.50.1

    - host_name: LINDS-TrueNAS-01
      host_groups: [Discovered hosts]
      link_templates: [TrueNAS SNMP]
      ip: 10.3.1.50
      dns: linds-truenas-01.linds.com.au

    # bulk: 0 - this switch's SNMP agent mishandles GETBULK.
    - host_name: LINDS-Switch-01
      host_groups: [Discovered hosts]
      link_templates: [Template SNMP OfficeConnect 19XX]
      ip: 192.168.6.210
      bulk: 0
      inventory_mode: disabled
  loop_control:
    label: "{{ item.host_name }}"

# Two interfaces, no macros: the iDrac answers SNMP for the template and also
# has IPMI enabled, though nothing currently polls it.
- name: LINDS-ESXi-02-iDrac
  community.zabbix.zabbix_host:
    host_name: LINDS-ESXi-02-iDrac
    host_groups: [Hypervisors]
    link_templates: [Dell iDrac SNMPV2]
    status: enabled
    inventory_mode: automatic
    force: true
    interfaces:
      - type: snmp
        main: 1
        useip: 1
        ip: 192.168.6.240
        port: "161"
        details:
          version: 2
          bulk: 1
          community: "{$SNMP_COMMUNITY}"
      - type: ipmi
        main: 1
        useip: 1
        ip: 192.168.6.240
        port: "623"
