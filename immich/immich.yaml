# Metrics of the job workers (immich-microservices). Headless: nothing
# connects to these pods, Prometheus scrapes each one.
apiVersion: v1
kind: Service
metadata:
  name: immich-microservices
  labels:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: microservices
    app.kubernetes.io/service: immich-microservices
  namespace: immich
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 8082
      targetPort: metrics-ms
      protocol: TCP
      name: metrics-ms
  # No controller label: this selects the JD workers and the LINDS worker.
  selector:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: microservices
---
apiVersion: v1
kind: Service
metadata:
  name: immich-valkey
  labels:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: valkey
    app.kubernetes.io/service: immich-valkey
    app.kubernetes.io/version: v3.0.0
    helm.sh/chart: immich-0.13.1
  namespace: immich
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: machine-learning
    app.kubernetes.io/version: v3.0.0
    helm.sh/chart: immich-0.13.1
  namespace: immich
spec:
  revisionHistoryLimit: 3
  replicas: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: machine-learning
      app.kubernetes.io/instance: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: immich
        app.kubernetes.io/name: machine-learning
    spec:
      enableServiceLinks: false
      serviceAccountName: immich-machine-learning
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      # Never on the control plane. A pod with a cold cache first downloads
      # ~8.2 GB of models (SigLIP2 CLIP 7.5 GB, OCR, faces) into the emptyDir
      # on its node's system disk, then uses every vCPU. On talos-cp that disk
      # is etcd's: on 2026-10-16 a catch-up run did both there, etcd stalled
      # (requests up to 9.9 s, a 43 s compaction) and the API server was down
      # for two minutes. Same rule as the runner sets.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - env:
          - name: DB_DATABASE_NAME
            value: immich
          - name: DB_HOSTNAME
            value: linds-postgres-rw.postgresql-linds.svc.cluster.local
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: immich-auth
          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                key: username
                name: immich-auth
          - name: HF_XET_CACHE
            value: /cache/huggingface-xet
          - name: IMMICH_MACHINE_LEARNING_URL
            value: http://immich-machine-learning:3003
          - name: MPLCONFIGDIR
            value: /cache/matplotlib-config
          - name: REDIS_HOSTNAME
            value: immich-valkey
          - name: TRANSFORMERS_CACHE
            value: /cache
          - name: TZ
            value: Australia/Melbourne
          image: ghcr.io/immich-app/immich-machine-learning:v3
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          name: main
          ports:
          - containerPort: 3003
            name: http
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          volumeMounts:
          - mountPath: /cache
            name: cache
      volumes:
        - emptyDir: {}
          name: cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: server
    app.kubernetes.io/version: v3.0.0
    helm.sh/chart: immich-0.13.1
  namespace: immich
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: server
      app.kubernetes.io/instance: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: immich
        app.kubernetes.io/name: server
    spec:
      enableServiceLinks: false
      serviceAccountName: immich-server
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      nodeSelector:
        datacenter: jd
      # Never on the control plane: thumbnail generation and video transcoding
      # use every vCPU (see immich-machine-learning above). Preferably not
      # beside a machine-learning pod either: on 2026-10-16 the two shared
      # talos-worker-03 (4.7 + 2.8 of 8 vCPUs) and thumbnails ran at a tenth
      # of their speed while three JD workers sat idle.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: machine-learning
                    app.kubernetes.io/instance: immich
      initContainers:
        # Renders immich-config-template into the real config, substituting the
        # OIDC client secret from the immich-oidc secret. Keeps the secret out
        # of git while still managing the config declaratively. Reuses the
        # server image so no extra image is introduced.
        - name: render-config
          image: ghcr.io/immich-app/immich-server:v3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - 'sed "s|__OAUTH_CLIENT_SECRET__|${OAUTH_CLIENT_SECRET}|" /template/immich.json > /immich-config/immich.json'
          env:
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: immich-oidc
                  key: client-secret
          volumeMounts:
            - mountPath: /template
              name: immich-config-template
              readOnly: true
            - mountPath: /immich-config
              name: immich-config
      containers:
        - env:
          - name: DB_DATABASE_NAME
            value: immich
          - name: DB_HOSTNAME
            value: linds-postgres-rw.postgresql-linds.svc.cluster.local
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: immich-auth
          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                key: username
                name: immich-auth
          - name: IMMICH_MACHINE_LEARNING_URL
            value: http://immich-machine-learning:3003
          - name: IMMICH_TELEMETRY_INCLUDE
            value: all
          # This pod answers the web and mobile clients only. The jobs
          # (thumbnails, transcodes, library scans) run in the
          # immich-microservices pods below, so a heavy job cannot slow or
          # stop the API.
          - name: IMMICH_WORKERS_INCLUDE
            value: api
          - name: LOG_LEVEL
            value: verbose
          - name: REDIS_HOSTNAME
            value: immich-valkey
          - name: TZ
            value: Australia/Melbourne
          # Config comes from the file rendered by the render-config init
          # container, not the database. The admin UI becomes read-only.
          - name: IMMICH_CONFIG_FILE
            value: /immich-config/immich.json
          # Node trusts only the public CA bundle, so without this the OIDC
          # discovery/token calls to Keycloak fail with a self-signed-chain
          # error even though the browser leg works.
          - name: NODE_EXTRA_CA_CERTS
            value: /etc/ssl/linds/ca.crt
          image: ghcr.io/immich-app/immich-server:v3
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          name: main
          ports:
          - containerPort: 2283
            name: http
            protocol: TCP
          - containerPort: 8081
            name: metrics-api
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /api/server/ping
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          volumeMounts:
          - mountPath: /data
            name: data
          - mountPath: /usr/src/app/library
            name: library
          - mountPath: /immich-config
            name: immich-config
            readOnly: true
          - mountPath: /etc/ssl/linds
            name: linds-ca
            readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-nfs-pvc
        - name: library
          persistentVolumeClaim:
            claimName: immich-library-pvc
        - name: immich-config-template
          configMap:
            name: immich-config-template
        # Holds the rendered config; never leaves the pod.
        - name: immich-config
          emptyDir: {}
        - name: linds-ca
          secret:
            secretName: linds-ca-cert
---
# The job workers: the same image as immich-server, without the API.
# Each replica takes jobs from the same queues in Valkey, so more replicas
# process a backlog faster. Immich's own database locks make sure that only
# one of them runs each nightly task, library scan and database backup.
#
# The concurrency values in immich-config.yaml apply to EACH replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-microservices
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: microservices
  namespace: immich
spec:
  revisionHistoryLimit: 3
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Replace one replica at a time and never run an extra one: a surge
      # pod would add its memory to a node that is already busy.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: microservices
      app.kubernetes.io/instance: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: immich
        app.kubernetes.io/name: microservices
    spec:
      enableServiceLinks: false
      serviceAccountName: immich-server
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      # JD: the originals are on jd-fs-01. The one worker at LINDS is the
      # Deployment immich-microservices-linds below.
      nodeSelector:
        datacenter: jd
      # One replica per JD worker where possible.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: microservices
              app.kubernetes.io/instance: immich
      affinity:
        # Never on the control plane (see immich-machine-learning above).
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        # Preferably not on the node of the PostgreSQL primary: a replica
        # uses every vCPU of its node while a backlog runs.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: postgresql-linds
                labelSelector:
                  matchLabels:
                    cnpg.io/instanceRole: primary
      initContainers:
        # Same as in immich-server: renders the config with the OIDC secret.
        - name: render-config
          image: ghcr.io/immich-app/immich-server:v3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - 'sed "s|__OAUTH_CLIENT_SECRET__|${OAUTH_CLIENT_SECRET}|" /template/immich.json > /immich-config/immich.json'
          env:
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: immich-oidc
                  key: client-secret
          volumeMounts:
            - mountPath: /template
              name: immich-config-template
              readOnly: true
            - mountPath: /immich-config
              name: immich-config
      containers:
        - env:
          - name: DB_DATABASE_NAME
            value: immich
          - name: DB_HOSTNAME
            value: linds-postgres-rw.postgresql-linds.svc.cluster.local
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: immich-auth
          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                key: username
                name: immich-auth
          - name: IMMICH_MACHINE_LEARNING_URL
            value: http://immich-machine-learning:3003
          - name: IMMICH_TELEMETRY_INCLUDE
            value: all
          - name: IMMICH_WORKERS_EXCLUDE
            value: api
          - name: REDIS_HOSTNAME
            value: immich-valkey
          - name: TZ
            value: Australia/Melbourne
          - name: IMMICH_CONFIG_FILE
            value: /immich-config/immich.json
          - name: NODE_EXTRA_CA_CERTS
            value: /etc/ssl/linds/ca.crt
          image: ghcr.io/immich-app/immich-server:v3
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            # On 2026-11-13 one pod with ten thumbnail jobs on 24 MP RAW
            # files grew past 8 GB in 13 minutes. The kubelet evicted it for
            # node memory pressure, three times, on three nodes, and the
            # last node also holds the PostgreSQL primary. With a limit the
            # kernel stops this container only, before the node is short.
            limits:
              memory: 5Gi
          name: main
          ports:
          - containerPort: 8082
            name: metrics-ms
            protocol: TCP
          # This worker has no HTTP API. The metrics port opens when the
          # worker has started.
          startupProbe:
            failureThreshold: 30
            tcpSocket:
              port: metrics-ms
            periodSeconds: 10
            timeoutSeconds: 1
          livenessProbe:
            failureThreshold: 3
            tcpSocket:
              port: metrics-ms
            periodSeconds: 10
            timeoutSeconds: 1
          volumeMounts:
          - mountPath: /data
            name: data
          - mountPath: /usr/src/app/library
            name: library
          - mountPath: /immich-config
            name: immich-config
            readOnly: true
          - mountPath: /etc/ssl/linds
            name: linds-ca
            readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-nfs-pvc
        - name: library
          persistentVolumeClaim:
            claimName: immich-library-pvc
        - name: immich-config-template
          configMap:
            name: immich-config-template
        - name: immich-config
          emptyDir: {}
        - name: linds-ca
          secret:
            secretName: linds-ca-cert
---
# One more job worker, at LINDS. Same pod as immich-microservices above;
# keep the two in step. The differences: one replica, LINDS nodes, and the
# label app.kubernetes.io/controller: linds, so that the two Deployments do
# not select each other's pods.
#
# The originals are on jd-fs-01: this worker reads each one through the
# site tunnel, which uses JD's upload. One replica only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-microservices-linds
  labels:
    app.kubernetes.io/controller: linds
    app.kubernetes.io/instance: immich
    app.kubernetes.io/name: microservices
  namespace: immich
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Stop the old pod before the new one starts (see above).
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/controller: linds
      app.kubernetes.io/name: microservices
      app.kubernetes.io/instance: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: linds
        app.kubernetes.io/instance: immich
        app.kubernetes.io/name: microservices
    spec:
      enableServiceLinks: false
      serviceAccountName: immich-server
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      nodeSelector:
        datacenter: linds
      affinity:
        # Never on the control plane (see immich-machine-learning above).
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        # Preferably not beside the machine-learning pod at LINDS: the
        # LINDS workers have 4 vCPUs.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: machine-learning
                    app.kubernetes.io/instance: immich
      initContainers:
        # Same as in immich-server: renders the config with the OIDC secret.
        - name: render-config
          image: ghcr.io/immich-app/immich-server:v3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - 'sed "s|__OAUTH_CLIENT_SECRET__|${OAUTH_CLIENT_SECRET}|" /template/immich.json > /immich-config/immich.json'
          env:
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: immich-oidc
                  key: client-secret
          volumeMounts:
            - mountPath: /template
              name: immich-config-template
              readOnly: true
            - mountPath: /immich-config
              name: immich-config
      containers:
        - env:
          - name: DB_DATABASE_NAME
            value: immich
          - name: DB_HOSTNAME
            value: linds-postgres-rw.postgresql-linds.svc.cluster.local
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: immich-auth
          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                key: username
                name: immich-auth
          - name: IMMICH_MACHINE_LEARNING_URL
            value: http://immich-machine-learning:3003
          - name: IMMICH_TELEMETRY_INCLUDE
            value: all
          - name: IMMICH_WORKERS_EXCLUDE
            value: api
          - name: REDIS_HOSTNAME
            value: immich-valkey
          - name: TZ
            value: Australia/Melbourne
          - name: IMMICH_CONFIG_FILE
            value: /immich-config/immich.json
          - name: NODE_EXTRA_CA_CERTS
            value: /etc/ssl/linds/ca.crt
          image: ghcr.io/immich-app/immich-server:v3
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            # Same limit as immich-microservices (see the reason there).
            limits:
              memory: 5Gi
          name: main
          ports:
          - containerPort: 8082
            name: metrics-ms
            protocol: TCP
          # This worker has no HTTP API. The metrics port opens when the
          # worker has started.
          startupProbe:
            failureThreshold: 30
            tcpSocket:
              port: metrics-ms
            periodSeconds: 10
            timeoutSeconds: 1
          livenessProbe:
            failureThreshold: 3
            tcpSocket:
              port: metrics-ms
            periodSeconds: 10
            timeoutSeconds: 1
          volumeMounts:
          - mountPath: /data
            name: data
          - mountPath: /usr/src/app/library
            name: library
          - mountPath: /immich-config
            name: immich-config
            readOnly: true
          - mountPath: /etc/ssl/linds
            name: linds-ca
            readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-nfs-pvc
        - name: library
          persistentVolumeClaim:
            claimName: immich-library-pvc
        - name: immich-config-template
          configMap:
            name: immich-config-template
        - name: immich-config
          emptyDir: {}
        - name: linds-ca
          secret:
            secretName: linds-ca-cert
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-valkey
  labels:
    app.kubernetes.io/controller: main
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: valkey
    app.kubernetes.io/version: v3.0.0
    helm.sh/chart: immich-0.13.1
  namespace: immich
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: main
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: immich
  template:
    metadata:
      labels:
        app.kubernetes.io/controller: main
        app.kubernetes.io/instance: immich
        app.kubernetes.io/name: valkey
    spec:
      enableServiceLinks: false
      serviceAccountName: immich-valkey
      automountServiceAccountToken: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      nodeSelector:
        datacenter: jd
      containers:
        - env:
          - name: DB_DATABASE_NAME
            value: immich
          - name: DB_HOSTNAME
            value: linds-postgres-rw.postgresql-linds.svc.cluster.local
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                key: password
                name: immich-auth
          - name: DB_USERNAME
            valueFrom:
              secretKeyRef:
                key: username
                name: immich-auth
          - name: IMMICH_MACHINE_LEARNING_URL
            value: http://immich-machine-learning:3003
          - name: LOG_LEVEL
            value: verbose
          - name: REDIS_HOSTNAME
            value: immich-valkey
          - name: TZ
            value: Australia/Melbourne
          image: docker.io/valkey/valkey:9.1-alpine@sha256:a35428eba9043cc0b79dbe54100f0c92784f2de00ad09b01182bfb1c5c83d1bd
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - valkey-cli ping | grep PONG
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          name: main
          ports:
          - containerPort: 6379
            name: redis
            protocol: TCP
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - valkey-cli ping | grep PONG
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            exec:
              command:
              - sh
              - -c
              - valkey-cli ping | grep PONG
            failureThreshold: 30
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
          - mountPath: /data
            name: data
      volumes:
        - emptyDir: {}
          name: data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-server
  labels:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: server
    app.kubernetes.io/version: v3.0.0
    helm.sh/chart: immich-0.13.1
    # Kyverno (kyverno/mirror-mtls-ingress.yaml) generates immich-server-mtls
    # on the nginx-mtls class from this Ingress.
    linds.com.au/mtls-mirror: "true"
  annotations:
    cert-manager.io/cluster-issuer: linds-ca
    # Publish the mirror's host in Cloudflare (external-dns-public). Kyverno
    # copies it onto immich-server-mtls.
    public.linds.com.au/publish: "true"
    # NOTE: this cluster runs the F5/NGINX Inc controller (nginx/nginx-ingress),
    # which only reads nginx.org/* annotations. Upload size (client-max-body-size: 0)
    # and proxy-read/send-timeout (3600) are set globally on the controller
    # ConfigMap via applications/nginx-ingress.yaml, so they aren't repeated here.
    #
    # Stream video/media straight through instead of buffering it in nginx, so
    # seeking (HTTP Range) and progressive/HLS playback aren't held up.
    nginx.org/proxy-buffering: "false"
    # This controller does NOT auto-upgrade WebSockets; Immich uses them for
    # real-time updates, so its backing service must be listed explicitly.
    nginx.org/websocket-services: "immich-server"
  namespace: immich
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "photos.linds.com.au"
      secretName: "photos-linds-tls"
  rules:
    - host: "photos.linds.com.au"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: immich-server
                port:
                  number: 2283
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich-server
  labels:
    app.kubernetes.io/instance: immich
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: server
    app.kubernetes.io/version: v3.0.0
    helm.sh/chart: immich-0.13.1
  namespace: immich
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - immich
  selector:
    matchLabels:
      app.kubernetes.io/service: immich-server
      app.kubernetes.io/name: server
      app.kubernetes.io/instance: immich
  endpoints:
    - port: metrics-api
      scheme: http
