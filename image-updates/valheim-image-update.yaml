apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: valheim
  namespace: argocd
spec:
  # Valheim clients refuse a server on an older build, so the server has to
  # follow Iron Gate's patches. The publisher rebuilds `latest` nightly when
  # a new server build ships; this rolls the StatefulSet onto it.
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: valheim
      images:
        - alias: valheim
          imageName: pfeiffermax/valheim-dedicated-server:latest
          commonUpdateSettings:
            updateStrategy: digest
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
