# Adds the "server auth" Extended Key Usage to every ingress-shim Certificate.
#
# cert-manager's default usages are "digital signature, key encipherment",
# which yields a leaf with no ExtendedKeyUsage at all. Apple's TLS trust
# rules (support.apple.com/en-us/103769) require id-kp-serverAuth on any
# server certificate issued after 2019-07-01, so iOS/macOS clients reject
# our linds-ca leaves even with the root installed and fully trusted. ACME
# issuers add the EKU themselves; the CA issuer only emits what is asked for.
#
# ingress-shim reads cert-manager.io/usages off the Ingress when it builds
# the Certificate, and cert-manager reissues because the last
# CertificateRequest no longer matches the spec. The catch: ingress-shim's
# certNeedsUpdate() never compares spec.usages, so a Certificate that
# already exists is left alone. cert-manager.io/duration IS compared, and
# pinning it to cert-manager's own 90-day default forces one update that
# carries the new usages along with it. Verified on v1.21.1.
#
# Each annotation is added only when absent, so a hand-set value on an
# Ingress wins. mutateExisting patches Ingresses that already exist when
# the policy lands; admission handles new ones before ingress-shim sees
# them. The conditions are declared twice on purpose: matchConditions
# gate admission, but the mutate-existing scan on policy create only
# honours targetMatchConditions (verified on v1.19.0 - with matchConditions
# alone the scan patched every Ingress in the cluster).
#
# CEL MutatingPolicy (policies.kyverno.io); the kyverno.io/v1 ClusterPolicy
# form is deprecated and warned on every apply.
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: ingress-cert-server-auth
spec:
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: true
    # Defaulted by the API server; declared so ArgoCD doesn't report drift.
    skipBackgroundRequests: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
  matchConditions:
    - name: has-cert-manager-issuer
      expression: >-
        object.metadata.?annotations[?'cert-manager.io/cluster-issuer'].hasValue() ||
        object.metadata.?annotations[?'cert-manager.io/issuer'].hasValue()
    - name: something-to-add
      expression: >-
        !object.metadata.?annotations[?'cert-manager.io/usages'].hasValue() ||
        !object.metadata.?annotations[?'cert-manager.io/duration'].hasValue()
  targetMatchConditions:
    - name: has-cert-manager-issuer
      expression: >-
        object.metadata.?annotations[?'cert-manager.io/cluster-issuer'].hasValue() ||
        object.metadata.?annotations[?'cert-manager.io/issuer'].hasValue()
    - name: something-to-add
      expression: >-
        !object.metadata.?annotations[?'cert-manager.io/usages'].hasValue() ||
        !object.metadata.?annotations[?'cert-manager.io/duration'].hasValue()
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (!object.metadata.?annotations[?'cert-manager.io/usages'].hasValue() ?
            [JSONPatch{
              op: "add",
              path: "/metadata/annotations/" + jsonpatch.escapeKey("cert-manager.io/usages"),
              value: "digital signature, key encipherment, server auth"
            }] : []) +
          (!object.metadata.?annotations[?'cert-manager.io/duration'].hasValue() ?
            [JSONPatch{
              op: "add",
              path: "/metadata/annotations/" + jsonpatch.escapeKey("cert-manager.io/duration"),
              value: "2160h"
            }] : [])
