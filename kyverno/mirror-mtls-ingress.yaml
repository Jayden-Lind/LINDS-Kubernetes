# Mirrors opted-in Ingresses onto the mTLS-only ingress class (nginx-mtls,
# VIP 172.16.1.12) so the same hostname is also reachable through the
# client-cert endpoint without hand-writing a second Ingress per app.
#
# Opt-in: give any Ingress the label OR annotation
#   linds.com.au/mtls-mirror: "true"
# and Kyverno generates <name>-mtls in the same namespace with the same
# rules and TLS block (reusing the app's existing cert-manager secret) but
# ingressClassName: nginx-mtls. The mirror tracks source changes and is
# garbage-collected when the source Ingress is deleted.
#
# CEL GeneratingPolicy (policies.kyverno.io); the kyverno.io/v1
# ClusterPolicy form is deprecated and warned on every apply.
---
# Kyverno's background controller ships with no rights on Ingresses; this
# aggregates the verbs the generate and mutate-existing policies need into
# its ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:ingresses
  labels:
    app.kubernetes.io/component: background-controller
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: mirror-mtls-ingress
spec:
  evaluation:
    # Keep mirrors updated / GC'd with their source.
    synchronize:
      enabled: true
    # Also mirror Ingresses that predate the policy.
    generateExisting:
      enabled: true
    # Defaulted by the API server; declared so ArgoCD doesn't report drift.
    skipBackgroundRequests: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
  matchConditions:
    - name: opted-in
      expression: >-
        object.metadata.?labels[?'linds.com.au/mtls-mirror'].orValue('') == 'true' ||
        object.metadata.?annotations[?'linds.com.au/mtls-mirror'].orValue('') == 'true'
    # Never match generated mirrors themselves: source annotations are
    # copied wholesale onto the mirror, so an annotation opt-in would
    # otherwise recurse (<name>-mtls-mtls-...). Mirrors always carry the
    # mtls-mirror-of label.
    - name: not-a-mirror
      expression: "!object.metadata.?labels[?'linds.com.au/mtls-mirror-of'].hasValue()"
  variables:
    - name: name
      expression: object.metadata.name
    - name: namespace
      expression: object.metadata.namespace
    - name: downstream
      # Annotations are copied wholesale so per-app nginx.org/* tuning
      # (websockets, proxy-buffering) carries over. That includes
      # cert-manager.io/cluster-issuer, which is benign here: the
      # Certificate for the shared TLS secret is owned by the source
      # Ingress, so ingress-shim logs "not owned" and skips it.
      expression: >-
        [{
          "apiVersion": dyn("networking.k8s.io/v1"),
          "kind": dyn("Ingress"),
          "metadata": dyn({
            "name": string(variables.name) + "-mtls",
            "namespace": string(variables.namespace),
            "labels": {
              "linds.com.au/mtls-mirror-of": string(variables.name),
              "app.kubernetes.io/managed-by": "kyverno"
            },
            "annotations": object.metadata.?annotations.orValue({})
          }),
          "spec": dyn({
            "ingressClassName": "nginx-mtls",
            "tls": object.spec.?tls.orValue([]),
            "rules": object.spec.rules
          })
        }]
  generate:
    - expression: generator.Apply(variables.namespace, variables.downstream)
