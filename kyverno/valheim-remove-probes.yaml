# Strips the Valheim server's startup and liveness probes.
#
# max-pfeiffer's valheim chart (applications/valheim.yaml) hardcodes both
# probes to `nc -nuzv 127.0.0.1 <game port>` and exposes only their timings
# as values. With -crossplay the server runs on PlayFab and never binds the
# game port - it binds only the Steam query port (2457) and ephemeral PlayFab
# sockets - so the startup probe can never pass and kubelet restarts a
# perfectly healthy server every ~17 minutes (failureThreshold 100 x 10s;
# hit on the 1.0.7 server, 2026-09-10).
#
# Probing 2457 instead would pass, but a listening query socket says nothing
# about whether the world is up, and guessing wrong costs a restart loop on a
# game server nobody is watching. Neither probe earns its place here: there is
# one replica behind the Service so readiness gates nothing, and a wedged
# world is not something `nc` can see. Both are removed; the container runs
# until it exits on its own.
#
# The Pod is patched at admission, not the StatefulSet, so the chart's
# rendered StatefulSet stays exactly what Argo CD diffs against. Probes on a
# running Pod are immutable, hence CREATE only.
#
# failurePolicy Fail, unlike the crossplay-probe policy this replaces: if
# Kyverno is unavailable the Pod is refused and the StatefulSet controller
# retries, which beats admitting a Pod that carries the probe that kills it -
# exactly how valheim-0 came up unpatched on 2026-09-10 while the Kyverno
# admission controller was restarting. The webhook only ever sees Pods in the
# valheim namespace, so nothing else can be blocked by it.
#
# Delete this policy if the chart gains a way to disable its probes.
---
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: valheim-remove-probes
spec:
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    mutateExisting:
      enabled: false
    # Defaulted by the API server; declared so ArgoCD doesn't report drift.
    skipBackgroundRequests: true
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: valheim
    objectSelector:
      matchLabels:
        app.kubernetes.io/name: valheim
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: chart-probe-present
      expression: >-
        object.spec.containers[0].name == 'valheim' &&
        (has(object.spec.containers[0].startupProbe) ||
         has(object.spec.containers[0].livenessProbe))
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (has(object.spec.containers[0].startupProbe) ?
            [JSONPatch{op: "remove", path: "/spec/containers/0/startupProbe"}] : []) +
          (has(object.spec.containers[0].livenessProbe) ?
            [JSONPatch{op: "remove", path: "/spec/containers/0/livenessProbe"}] : [])
