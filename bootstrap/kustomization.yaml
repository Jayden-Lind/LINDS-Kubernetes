apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  # Pinned Argo CD version - bump this to upgrade Argo CD via GitOps
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.2/manifests/install.yaml

patches:
  # TLS terminates at the nginx ingress (base/nginx/argocd.yml), so the
  # server runs plaintext HTTP behind it.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        server.insecure: "true"
  # Poll GitHub every 5 minutes (jitter 1m): a merged Renovate PR deploys
  # within minutes instead of up to an hour. Argo CD cannot receive GitHub
  # webhooks here because the UI only exists on the LAN ingress class.
  # ignoreAggregatedRoles stops aggregated ClusterRoles (Kyverno's) showing as
  # permanent drift when kube-controller-manager fills in their rules.
  # Also carries the Keycloak OIDC config: `url` is required or the OIDC
  # redirect is built against the pod address instead of the ingress host.
  #
  # rootCA is linds-CA. Argo CD's token exchange is a server-to-server call
  # from the argocd-server pod, which trusts only the public CA bundle - the
  # browser leg would succeed and login would then fail with
  # "certificate signed by unknown authority". This is a CA *public*
  # certificate, presented in every TLS handshake to keycloak.linds.com.au,
  # so it is not secret; only the private key in Vault is.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        timeout.reconciliation: 300s
        timeout.reconciliation.jitter: 60s
        resource.compareoptions: |
          ignoreAggregatedRoles: true
        url: https://argocd.linds.com.au
        oidc.config: |
          name: Keycloak
          issuer: https://keycloak.linds.com.au/realms/linds
          clientID: argocd
          clientSecret: $oidc.keycloak.clientSecret
          requestedScopes:
            - openid
            - profile
            - email
            - groups
          rootCA: |
            -----BEGIN CERTIFICATE-----
            MIIDmTCCAoGgAwIBAgIQebLiPyGuFYJJdmJQ94ybkzANBgkqhkiG9w0BAQsFADBT
            MRIwEAYKCZImiZPyLGQBGRYCYXUxEzARBgoJkiaJk/IsZAEZFgNjb20xFTATBgoJ
            kiaJk/IsZAEZFgVsaW5kczERMA8GA1UEAxMIbGluZHMtQ0EwHhcNMTkxMjAxMDMz
            MzQ3WhcNMjkxMjAxMDM0MzQ3WjBTMRIwEAYKCZImiZPyLGQBGRYCYXUxEzARBgoJ
            kiaJk/IsZAEZFgNjb20xFTATBgoJkiaJk/IsZAEZFgVsaW5kczERMA8GA1UEAxMI
            bGluZHMtQ0EwggEiMA0GCSqGSIb3DQEBAQUAA4IBDwAwggEKAoIBAQDVv38XIdmo
            ScFi6DhSy0uXElkVbSAOJT14wKbE3ZxnWUKRLzH25hDbMQlV2uQ+G59WnreIhxpN
            xSOp9RXrJn2IA2tNVOWTRBFg3CSsXRl/EQf1elbx7j4AeEzC4MdB3lPBFV8175Xm
            cueCcmqlI3uZudbBbIKiI4HK9RJqWjOCDG827YH7Z+Md/sbW1S53WTCZhTux0TUU
            RMo+114id0JqnQ0cKQRODmCuimJVYEmYjoF/kARf2+jtBWqoRRuyHswBE5D6L4m4
            s9lnX9m0fNbXjC00IFlRdrIDOameo5VLxkEb0yIGLpMla+nxRmJgdTDqWinzmMw5
            vUJTKd3SnhRdAgMBAAGjaTBnMBMGCSsGAQQBgjcUAgQGHgQAQwBBMA4GA1UdDwEB
            /wQEAwIBhjAPBgNVHRMBAf8EBTADAQH/MB0GA1UdDgQWBBRj28IpbX7TLUT4MKtW
            q+phtkfb7DAQBgkrBgEEAYI3FQEEAwIBADANBgkqhkiG9w0BAQsFAAOCAQEAtts3
            sQjdaQenOUX0BqW06BAEdPJc6d1K5/79cqfZx15jBxtjoDUQ60g0NB5uj+7aZygS
            blOammiSyZB1HF/V3sYpFgoPcpgHg0dQyR7ka/fJICK8hj4+5deXQ9lbasdpNQuG
            jQWC2gXd/y0w0mRcbZbcB2tTLpD8M2tsigZxQjIIIbWhmf4RDYIG8HKhFRRfMTYh
