# Replaces the chart's pair of Services (headless `valheim` + LoadBalancer
# `valheim-0`) with one LoadBalancer.
#
# Since crossplay was turned off (2026-09-13, see valheim/statefulset.yaml)
# this Service is the only way in, where before it was a spare: PlayFab relayed
# every session and nothing arrived here. The public.linds.com.au/ annotations
# below publish it (docs/publish-a-service.md): jd-router-01 forwards UDP
# 2456-2457 from the WAN to the pinned address, and external-dns-public points
# valheim.linds.com.au at jd.linds.com.au, the A-only name that follows the
# WAN address. Players use that name.
#
# The 2458 port is gone with crossplay - it only ever carried the PlayFab
# backend. Re-add it here, in the ports annotation and in the StatefulSet if
# CROSSPLAY goes back to true.
apiVersion: v1
kind: Service
metadata:
  name: valheim
  annotations:
    # Pinned, so the address in the logs and in Hubble stays the same.
    lbipam.cilium.io/ips: "172.16.1.10"
    # Internal DNS: external-dns writes this into the linds.com.au zone on
    # 10.0.50.200 and points it at the address above, so players at home
    # reach the server without leaving the LAN.
    external-dns.kubernetes.io/hostname: valheim.linds.com.au
    # Internet: the router forwards these WAN ports here, and Cloudflare
    # gets valheim.linds.com.au as a CNAME to jd.linds.com.au.
    public.linds.com.au/ports: "2456-2457/udp"
    public.linds.com.au/hostname: valheim.linds.com.au
    public.linds.com.au/target: jd.linds.com.au
spec:
  type: LoadBalancer
  # Keep the players' real source IPs in the server log - which only started
  # mattering when crossplay went away and players began arriving here. It also
  # means Cilium only advertises this VIP from the node actually running the
  # pod, so the router's DNAT lands on a node with a local backend.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: valheim
    app.kubernetes.io/instance: valheim
  ports:
    - name: server
      port: 2456
      targetPort: server
      protocol: UDP
    - name: query
      port: 2457
      targetPort: query
      protocol: UDP
