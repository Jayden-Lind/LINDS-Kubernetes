# The Valheim server, on community-valheim-tools/valheim-server (the image
# formerly published as lloesche/valheim-server).
#
# Why this image, and why hand-written manifests instead of a chart:
#
# max-pfeiffer's chart - what this replaces - bakes one Valheim build into the
# image, so the server could only ever be as current as a 3-star repo's last
# rebuild. On 2026-09-12 it was still serving l-1.0.7 from a 2026-09-11 07:03Z
# build while Iron Gate had shipped 1.0 -> 1.0.12 (Steam build 25253791,
# 2026-09-11 13:08Z) in the 48 hours after the 1.0 launch. No amount of
# argocd-image-updater tuning fixes a publisher who has not published.
#
# This image runs SteamCMD itself, so the game tracks Steam directly with
# nobody in between: UPDATE_CRON checks every 15 minutes, UPDATE_IF_IDLE only
# lets it act when the server is empty, and it restarts itself afterwards. A
# patch therefore lands within ~15 minutes and never kicks anyone mid-session,
# which no Argo CD sync could manage - Argo has no idea who is playing.
#
# The two charts that wrap this image are both dead ends: Addyvan/valheim-k8s
# (the one this image's README points at) has not been touched since 2024-09
# and predates the 1.0 save format, and k8s-charts/valheim-server pins
# mbround18/valheim 3.1.0 against an upstream on 3.8.0. Hence plain manifests
# here rather than a third thin dependency - this is a ~100 line StatefulSet.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valheim
spec:
  replicas: 1
  serviceName: valheim
  # Same labels the chart's StatefulSet used, so the Service selector and any
  # saved dashboards keep working.
  selector:
    matchLabels:
      app.kubernetes.io/name: valheim
      app.kubernetes.io/instance: valheim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valheim
        app.kubernetes.io/instance: valheim
    spec:
      # JD only - the config volume is JD-side iSCSI - and never the
      # control-plane node: the server is CPU-bursty and etcd lives there.
      nodeSelector:
        datacenter: jd
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # The server writes the world on SIGTERM. Long enough that a node drain
      # or a rollout never costs progress.
      terminationGracePeriodSeconds: 300
      # Nothing in here talks to the API server.
      automountServiceAccountToken: false
      initContainers:
        # The Secret is frozen in the old chart's shape - key `valheim-0`
        # holding `password="..."` - because its ExternalSecret is
        # CreatedOnce and re-rendering it would mint a new password and lock
        # every player out (see valheim/password.yaml). SERVER_PASS_FILE wants
        # a file that is the password and nothing else, so unwrap it here into
        # a tmpfs the server container reads.
        #
        # Same image as the server purely so this pulls nothing extra.
        # Delete this container, and mount the Secret straight at /run/secrets
        # with a `server_pass` key, if the password is ever deliberately
        # rotated into the clean shape.
        - name: unwrap-password
          image: ghcr.io/community-valheim-tools/valheim-server:1.4.0@sha256:f3ccde9a4e292663cf5096d502ff33cc9617015f6d70b6a9ca0968543f165ef2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -euc
            - |
              sed -E 's/^password="//; s/"$//' /secret-in/valheim-0 \
                | tr -d '\n' > /secret-out/server_pass
              chmod 0444 /secret-out/server_pass
              test -s /secret-out/server_pass
          volumeMounts:
            - name: server-pass-raw
              mountPath: /secret-in
              readOnly: true
            - name: server-pass
              mountPath: /secret-out
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
        # The server's mods. One so far: FiresGhettoNetworking, a networking
        # and server-authority mod (MIT, fire-VA/FiresGhettoNetworking).
        #
        # BEPINEX=true below installs BepInEx itself and, on every merge,
        # rsyncs /config/bepinex/{plugins,patchers}/ into the BepInEx server
        # directory - so a plugin is "installed" by existing in that directory
        # on the config volume. This container is what puts it there.
        #
        # Downloaded here rather than committed to this repo or baked into an
        # image, because neither alternative is better than a pinned URL: the
        # DLL is a 400 KB binary that the author re-releases most weeks, so
        # git would carry a new blob forever each time, and a wrapper image
        # would be a whole build pipeline for one file. The container already
        # fetches Valheim from Steam and BepInEx from Thunderstore on every
        # start, both completely unpinned - a fetch pinned to a release tag is
        # the most controlled thing here, not the least.
        #
        # Renovate bumps the tag (renovate.json5, github-releases datasource).
        # There is no checksum pin on purpose: Renovate cannot update one, so
        # pinning a digest here would mean every mod PR merged a config that
        # fails this container and takes the server down with it.
        - name: install-mods
          # Same image as the server, purely so this pulls nothing extra.
          image: ghcr.io/community-valheim-tools/valheim-server:1.4.0@sha256:f3ccde9a4e292663cf5096d502ff33cc9617015f6d70b6a9ca0968543f165ef2
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -euc
            - |
              url=https://raw.githubusercontent.com/fire-VA/FiresGhettoNetworking/v1.4.67/plugins/FiresGhettoNetworking/VAGhettoNetworking.dll
              dst=/config/bepinex/plugins/VAGhettoNetworking.dll

              mkdir -p /config/bepinex/plugins /config/bepinex/patchers
              if curl -fsSL --retry 3 --retry-delay 5 -o "$dst.tmp" "$url"; then
                # A .NET assembly is a PE image. Checking the magic keeps a
                # GitHub error page from being installed as a plugin, which
                # BepInEx would then fail to load on every start.
                test "$(head -c 2 "$dst.tmp")" = MZ
                mv -f "$dst.tmp" "$dst"
                chmod 0644 "$dst"
              else
                # The config volume still holds the last good copy, so a
                # GitHub outage must not stop the server coming up. It only
                # means the version already on the volume stays installed.
                rm -f "$dst.tmp"
                test -s "$dst"
                echo "WARNING: could not fetch $url - keeping the copy already on the volume" >&2
              fi

              # Nothing removes a plugin that is dropped from this script: the
              # image only syncs /config -> server, and this only ever adds.
              # Deleting a mod means deleting its DLL from the volume by hand.
              ls -l /config/bepinex/plugins
          # As the uid that owns the config volume, so the files land with the
          # same ownership as everything else on it and the server (also
          # PUID 10001) can read them.
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: valheim
          # Renovate bumps this (renovate.json5). It is NOT the game version -
          # the game comes from SteamCMD at runtime - so this only moves when
          # the wrapper scripts change, and it is deliberately not watched by
          # argocd-image-updater any more.
          image: ghcr.io/community-valheim-tools/valheim-server:1.4.0@sha256:f3ccde9a4e292663cf5096d502ff33cc9617015f6d70b6a9ca0968543f165ef2
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_NAME
              value: LINDS
            # The directory inside worlds_local/. The existing save is already
            # in the 1.0 directory format, so nothing is converted on first
            # start - see valheim/pvc.yaml.
            - name: WORLD_NAME
              value: Midgard
            - name: SERVER_PORT
              value: "2456"
            # Listed in the Steam server browser and the in-game Community
            # list. Also load-bearing for the idle gates further down - see
            # CROSSPLAY - so flipping it to false would quietly change how
            # UPDATE_IF_IDLE/RESTART_IF_IDLE/BACKUPS_IF_IDLE decide.
            - name: SERVER_PUBLIC
              value: "true"
            # Steam matchmaking rather than PlayFab, since 2026-09-13. Every
            # player here is on Steam, so crossplay bought nothing and cost
            # two things:
            #
            #   - The direct path. A crossplay server does not listen on
            #     SERVER_PORT at all - the image says so itself, in
            #     server_is_listening: "crossplay-enabled servers don't listen
            #     on $SERVER_PORT". It takes 2457 plus a third UDP port, 2458,
            #     for the PlayFab backend, and sessions ride the PlayFab relay
            #     instead of the LB two hops away.
            #   - An honest player count. Under crossplay an A2S query always
            #     answers 0 players, so the image's server_is_idle() falls
            #     back to counting inbound UDP datagrams and calls >30 in a 3s
            #     window busy - mDNS and stray internet scans included. Every
            #     UPDATE_IF_IDLE, RESTART_IF_IDLE and BACKUPS_IF_IDLE decision
            #     hung off that heuristic. Non-crossplay with SERVER_PUBLIC
            #     true queries the real player count on the query port.
            #
            # In exchange the LB is now the only way in, so UDP 2456-2457 have
            # to reach 172.16.1.10 from the WAN. They already do: DNAT rule 22
            # in LINDS-Ansible inventory/group_vars/jd_vyos.yml.
            - name: CROSSPLAY
              value: "false"
            # BepInEx, so the server can load mods - see the install-mods
            # initContainer above for the one installed. The image fetches
            # BepInExPack_Valheim from Thunderstore and merges it with the
            # vanilla server into /opt/valheim/bepinex, which it then runs
            # instead of /opt/valheim/server; the vanilla copy stays on disk
            # either way, so this roughly doubles what the server-files volume
            # holds (~2 GB -> ~4.3 GB, plus a second copy kept for the length
            # of an update merge).
            #
            # Mutually exclusive with VALHEIM_PLUS, which is not set here.
            - name: BEPINEX
              value: "true"
            # Deliberately a fresh top-level path, not the /run/secrets the
            # image's README uses for Docker. Anything under /run collides
            # here: /var/run is a symlink to /run, so /run/secrets swallows
            # the mountpoint kubelet needs for the service account token
            # (runc then fails the container outright), and /run/valheim is
            # where the image's own supervisor keeps its PID files.
            - name: SERVER_PASS_FILE
              value: /valheim-secret/server_pass
            # Run the server as the uid/gid that already owns every file on
            # the config volume, so no ownership is rewritten on adoption.
            # 1.2.0 carries the per-world-directory permission handling this
            # needs (commit a134fb4d); on older images a non-root PUID strips
            # the execute bit off the world directory and the server then runs
            # happily with no world loaded.
            - name: PUID
              value: "10001"
            - name: PGID
              value: "10001"
            # Local time, so the cron schedules below mean what they look like.
            - name: TZ
              value: Australia/Melbourne
            # The whole point of the migration: check Steam every 15 minutes,
            # but only act when nobody is connected.
            - name: UPDATE_CRON
              value: "*/15 * * * *"
            - name: UPDATE_IF_IDLE
              value: "true"
            # Unity leaks; a daily bounce keeps it honest. Idle-gated too, so
            # it is a no-op while anyone is playing.
            - name: RESTART_CRON
              value: "0 5 * * *"
            - name: RESTART_IF_IDLE
              value: "true"
            # Replaces the chart's -backups/-backupshort/-backuplong flags.
            # Hourly, zipped, 7 days kept, on the config volume - on top of
            # the zvol's sanoid dailies.
            - name: BACKUPS
              value: "true"
            - name: BACKUPS_CRON
              value: "5 * * * *"
            - name: BACKUPS_MAX_AGE
              value: "7"
            - name: BACKUPS_MAX_COUNT
              value: "0"
          ports:
            - name: server
              containerPort: 2456
              protocol: UDP
            - name: query
              containerPort: 2457
              protocol: UDP
            # No 2458: that was only the PlayFab backend, and nothing binds it
            # with CROSSPLAY=false. Some BepInEx mods do want gameport+2 for
            # their own RPC, and would need it back here and in
            # valheim/service.yaml - FiresGhettoNetworking does not. It patches
            # Valheim's own ZDO/RPC layer, so all of its traffic rides the
            # sockets already bound on 2456-2457.
          # No probes, deliberately. supervisord inside the container already
          # restarts the server process if it dies, and the chart's probes are
          # what used to kill this pod every 17 minutes. A kubelet probe here
          # could only add failure modes - notably during the multi-minute
          # SteamCMD download on a cold volume.
          resources:
            requests:
              cpu: 4
              memory: 6Gi
            limits:
              memory: 12Gi
          securityContext:
            # No allowPrivilegeEscalation: false here, unlike the
            # initContainer. It sets no_new_privs, which disables setuid - and
            # with PUID 10001 the bootstrap installs UPDATE_CRON and
            # RESTART_CRON as an unprivileged user through busybox crontab,
            # which is setuid for exactly that. Under no_new_privs it fails
            # with "crontab: must be suid to work properly", crond comes up
            # with an empty crontab, and the server silently never checks for
            # a Valheim update again - which is the whole reason for this
            # image. Verified 2026-09-12: /var/spool/cron/crontabs empty with
            # the flag, populated without it.
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # World, admin/banned/permitted lists and backups.
            - name: config
              mountPath: /config
            # The SteamCMD-downloaded server (~2GB). Separate volume so a
            # reschedule does not re-download it.
            - name: server-files
              mountPath: /opt/valheim
            - name: server-pass
              mountPath: /valheim-secret
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: saves-directory-valheim-0
        - name: server-files
          persistentVolumeClaim:
            claimName: valheim-server-files
        # Raw Secret, in the chart's legacy shape, read only by the
        # unwrap-password initContainer.
        - name: server-pass-raw
          secret:
            secretName: valheim-password
            items:
              - key: valheim-0
                path: valheim-0
        # The unwrapped password. tmpfs, so it never touches a disk.
        - name: server-pass
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
