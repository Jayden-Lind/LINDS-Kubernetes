# The server password, generated in-cluster once rather than kept in git or
# Vault. Read it with:
#   kubectl get secret -n valheim valheim-password -o jsonpath='{.data.valheim-0}' | base64 -d
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: valheim-password
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Players type this in-game, so no symbols.
  length: 12
  digits: 3
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valheim-password
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Generate once. A rotation would lock every player out until they were
  # told the new password.
  refreshPolicy: CreatedOnce
  target:
    name: valheim-password
    template:
      data:
        # Deliberately still the old chart's shape: a shell assignment under
        # the key `valheim-0`.
        #
        # refreshPolicy above is CreatedOnce, so this template is rendered
        # exactly once per cluster and the live Secret is frozen at whatever
        # the first render produced - 2026-09-10, in the chart's format.
        # Changing the key here would not re-render it; forcing a re-render
        # would call the Password generator again and mint a NEW password,
        # locking every player out. So the shape stays, and
        # valheim/statefulset.yaml's initContainer unwraps it into the bare
        # file SERVER_PASS_FILE wants. Keeping this identical on a rebuilt
        # cluster is what makes that initContainer correct in both places.
        valheim-0: |
          password="{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: valheim-password
