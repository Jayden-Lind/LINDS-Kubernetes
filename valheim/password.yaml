# The server password, generated in-cluster once rather than kept in git or
# Vault. Read it with:
#   kubectl get secret -n valheim valheim-password -o jsonpath='{.data.valheim-0}' | base64 -d
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: valheim-password
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Players type this in-game, so no symbols.
  length: 12
  digits: 3
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valheim-password
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Generate once. A rotation would lock every player out until they were
  # told the new password.
  refreshPolicy: CreatedOnce
  target:
    name: valheim-password
    template:
      data:
        # SERVER_PASS_FILE points the server straight at this key mounted as a
        # file, so it holds the password and nothing else. The old chart
        # instead sourced a `valheim-0` key as shell assignments
        # (password="..."), which is why the live Secret still carries that
        # key - refreshPolicy CreatedOnce means this template is never
        # re-rendered, so on 2026-09-12 the migration added `server_pass` to
        # the existing Secret by hand with the SAME password rather than let
        # the generator mint a new one and lock every player out. A rebuilt
        # cluster gets only this key; `valheim-0` can be dropped from the live
        # Secret once the migration has settled.
        server_pass: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: valheim-password
