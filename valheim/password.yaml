# The server password, generated in-cluster once rather than kept in git or
# Vault. Read it with:
#   kubectl get secret -n valheim valheim-password -o jsonpath='{.data.valheim-0}' | base64 -d
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: valheim-password
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Players type this in-game, so no symbols.
  length: 12
  digits: 3
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valheim-password
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Generate once. A rotation would lock every player out until they were
  # told the new password.
  refreshPolicy: CreatedOnce
  target:
    name: valheim-password
    template:
      data:
        # The chart's entrypoint sources key <statefulset>-<ordinal> as shell
        # assignments (the chart's own templates/secret.yaml has this shape).
        valheim-0: |
          password="{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: valheim-password
