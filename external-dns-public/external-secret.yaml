# The Cloudflare API token for external-dns-public
# (applications/external-dns-public.yaml). Make the token in Cloudflare (My
# Profile > API Tokens > Create Token > "Edit zone DNS", zone linds.com.au),
# then put it in Vault:
#   kubectl -n vault exec -i vault-0 -- sh -c 'read -r VAULT_TOKEN; export VAULT_TOKEN;
#     vault kv put linds-keyvault/external-dns-cloudflare api-token=<token>'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-cloudflare
  namespace: external-dns-public
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  # refreshInterval and the remoteRef strategies are ESO webhook defaults,
  # declared explicitly so ArgoCD's diff matches the live object.
  refreshInterval: 1h0m0s
  target:
    name: external-dns-cloudflare
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-token
      remoteRef:
        key: linds-keyvault/external-dns-cloudflare
        property: api-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
