---
# Grafana dashboard "Availability": the blackbox probes of every service, from
# both sites. Picked up by the kube-prometheus grafana dashboard sidecar via
# the grafana_dashboard label; grafana_folder puts it in "Infrastructure".
#
# GENERATED by dashboard.py. Edit that file and run it again:
#   python3 monitoring-probes/dashboard.py > monitoring-probes/dashboard.yaml
#
# The data: jobs blackbox and mtls-gate (scrape-configs.yaml, from targets.py)
# and target:probe_success:max (rules.yaml). The probe alerts show as
# annotations.
apiVersion: v1
kind: ConfigMap
metadata:
  name: availability-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Infrastructure
data:
  availability.json: |
    {
      "uid": "availability",
      "title": "Availability",
      "description": "Black-box probes of every service from both sites: what is down now, what was down, how slow it is, and the certificates that expire. Probes, alerts and this dashboard: LINDS-Kubernetes monitoring-probes/ (README).",
      "tags": [
        "availability",
        "blackbox"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "links": [
        {
          "title": "Homelab overview",
          "type": "link",
          "url": "/d/overview",
          "keepTime": true,
          "icon": "dashboard"
        },
        {
          "title": "Router",
          "type": "link",
          "url": "/d/router",
          "keepTime": true,
          "icon": "dashboard"
        },
        {
          "title": "Hardware",
          "type": "link",
          "url": "/d/hardware",
          "keepTime": true,
          "icon": "dashboard"
        },
        {
          "title": "Ingress traffic",
          "type": "link",
          "url": "/d/ingress-traffic",
          "keepTime": true,
          "icon": "dashboard"
        },
        {
          "title": "Backups",
          "type": "link",
          "url": "/d/backups",
          "keepTime": true,
          "icon": "dashboard"
        },
        {
          "title": "Security overview",
          "type": "link",
          "url": "/d/security-overview",
          "keepTime": true,
          "icon": "dashboard"
        },
        {
          "title": "Security access",
          "type": "link",
          "url": "/d/security-access",
          "keepTime": true,
          "icon": "dashboard"
        },
        {
          "title": "Suricata",
          "type": "link",
          "url": "/d/suricata",
          "keepTime": true,
          "icon": "dashboard"
        }
      ],
      "templating": {
        "list": [
          {
            "name": "site",
            "label": "Site",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "qryType": 1,
              "query": "label_values(probe_success{job=\"blackbox\"}, site)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(probe_success{job=\"blackbox\"}, site)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1,
            "options": []
          },
          {
            "name": "kind",
            "label": "Kind",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "qryType": 1,
              "query": "label_values(probe_success{job=\"blackbox\", site=~\"$site\"}, kind)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(probe_success{job=\"blackbox\", site=~\"$site\"}, kind)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1,
            "options": []
          },
          {
            "name": "target",
            "label": "Target",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "qryType": 1,
              "query": "label_values(probe_success{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\"}, target)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(probe_success{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\"}, target)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1,
            "options": []
          },
          {
            "name": "vantage",
            "label": "Probed from",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "description": "Which exporter's results the probe time panels use. Up and down always use both.",
            "query": {
              "qryType": 1,
              "query": "label_values(probe_success{job=\"blackbox\"}, vantage)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(probe_success{job=\"blackbox\"}, vantage)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1,
            "options": []
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "name": "Probe alerts",
            "enable": true,
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "expr": "ALERTS{alertname=~\"ProbeTargetDown|ProbeFailsFromOneSite|MtlsGateAcceptsAnonymous|BlackboxProbes.+\", alertstate=\"firing\"}",
            "step": "60s",
            "titleFormat": "{{alertname}}",
            "textFormat": "{{target}}{{vantage}}",
            "iconColor": "#d03b3b",
            "useValueForTime": false
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "id": 1,
          "title": "Up",
          "description": "Targets that answer from at least one site now, with the variables above.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "count(max by (target) (probe_success{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}) == 1) or vector(0)",
              "legendFormat": "",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "text": {
              "valueSize": 30
            },
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Down",
          "description": "Targets that answer from no site. ProbeTargetDown fires for one after 10 minutes, unless it is dashboard only or another alert already says it (rules.yaml). Down now, below, names them.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 3,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "count(max by (target) (probe_success{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}) == 0) or vector(0)",
              "legendFormat": "",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "prefix:✗ ",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "✓ None",
                      "color": "#0ca30c",
                      "index": 0
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#d03b3b",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "text": {
              "valueSize": 30
            },
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
          "id": 3,
          "title": "One site only",
          "description": "Targets that answer from one site and not the other: the path between the sites, or one exporter. ProbeFailsFromOneSite fires after 15 minutes.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "count((min by (target) (probe_success{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}) == 0) and (max by (target) (probe_success{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}) == 1)) or vector(0)",
              "legendFormat": "",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "prefix:◐ ",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "✓ None",
                      "color": "#0ca30c",
                      "index": 0
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#fab219",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "text": {
              "valueSize": 30
            },
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
          "id": 4,
          "title": "Uptime",
          "description": "Over the dashboard's time range, the share of minutes each target answered from at least one site, averaged over the targets shown (target:probe_success:max).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 9,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "avg(avg_over_time(target:probe_success:max{site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}[$__range]))",
              "legendFormat": "",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "text": {
              "valueSize": 30
            },
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
          "id": 5,
          "title": "Certificates",
          "description": "Certificates with 21 days or fewer left, of every TLS target shown. ProbeCertificateExpiring fires for those cert-manager does not issue; CertificateExpiringSoon for the rest.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "count(min by (target) (probe_ssl_earliest_cert_expiry{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}) - time() < 21 * 86400) or vector(0)",
              "legendFormat": "",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "prefix:⚠ ",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "✓ None",
                      "color": "#0ca30c",
                      "index": 0
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#fab219",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "text": {
              "valueSize": 30
            },
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
          "id": 6,
          "title": "mTLS gate",
          "description": "Whether the public ingress refuses a request with no client certificate, the worst of its four names (job mtls-gate, every 15 minutes, from JD). Not tested: the probe got no TCP or TLS connection, so it could not see a refusal. MtlsGateAcceptsAnonymous fires when it is open.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 15,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "max(last_over_time(probe_success{job=\"mtls-gate\"}[20m]) * 2 + (1 - last_over_time(probe_success{job=\"mtls-gate\"}[20m])) * (1 - last_over_time(probe_failed_due_to_regex{job=\"mtls-gate\"}[20m])))",
              "legendFormat": "",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "✓ Refuses anonymous",
                      "color": "#0ca30c",
                      "index": 0
                    },
                    "1": {
                      "text": "? Not tested",
                      "color": "#fab219",
                      "index": 1
                    },
                    "2": {
                      "text": "✗ OPEN to anyone",
                      "color": "#d03b3b",
                      "index": 2
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "noValue": "? No result"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "text": {
              "valueSize": 18
            },
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
          "id": 7,
          "title": "Exporters",
          "description": "Whether Prometheus can scrape the blackbox exporter at each site. A down exporter is PrometheusTargetDown for each of its targets; one with no targets at all is BlackboxProbesMissing.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "max by (vantage) (up{job=\"blackbox\"})",
              "legendFormat": "{{vantage}}",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "✓ Up",
                      "color": "#0ca30c",
                      "index": 0
                    },
                    "0": {
                      "text": "✗ Down",
                      "color": "#d03b3b",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "noValue": "✗ Missing"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "value_and_name",
            "orientation": "auto",
            "wideLayout": true,
            "text": {
              "valueSize": 16
            },
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
          "id": 8,
          "title": "Probe alerts",
          "description": "Alerts from rules.yaml firing now, as Discord got them.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 21,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "count(ALERTS{alertstate=\"firing\", alertname=~\"ProbeTargetDown|ProbeFailsFromOneSite|ProbeCertificateExpiring|MtlsGateAcceptsAnonymous|BlackboxProbes.+\"}) or vector(0)",
              "legendFormat": "",
              "range": false,
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "prefix:⚠ ",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "✓ None",
                      "color": "#0ca30c",
                      "index": 0
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#fab219",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "text": {
              "valueSize": 30
            },
            "showPercentChange": false
          }
        },
        {
          "type": "table",
          "id": 9,
          "title": "Down now",
          "description": "Every target that does not answer from every site, worst first. Down: from no site. One site: from one of the two. Down for: since it last answered from every site (over a day shows as 1 day). HTTP: the status code the failing probe got (no answer: none at all, as for a TLS or connection failure). Dashboard only: no alert fires for it (its device has one of its own).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 24,
            "h": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "max by (target, kind, site, alert) (probe_success{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}) * 0 + on (target, kind, site) group_left () ((2 - max by (target, kind, site) (probe_success{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}) - min by (target, kind, site) (probe_success{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"})) > 0)",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "(time() - max_over_time((timestamp(min by (target, kind, site) (probe_success{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}) == 1))[1d:1m]) or on (target, kind, site) ((2 - max by (target, kind, site) (probe_success{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}) - min by (target, kind, site) (probe_success{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"})) * 0 + 86400)) and on (target, kind, site) ((2 - max by (target, kind, site) (probe_success{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}) - min by (target, kind, site) (probe_success{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"})) > 0)",
