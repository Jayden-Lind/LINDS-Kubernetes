        {
          "type": "table",
          "id": 21,
          "title": "Uptime",
          "description": "Over the dashboard's time range, for each target: the share of minutes it answered from at least one site, that as a time down, and its average probe time (from the slower site, or the one chosen in Probed from). Worst first.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 41,
            "w": 12,
            "h": 16
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "max by (target, kind, site) (avg_over_time(target:probe_success:max{site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}[$__range]))",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "max by (target, kind, site) ((1 - avg_over_time(target:probe_success:max{site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}[$__range])) * $__range_s)",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "C",
              "expr": "max by (target, kind, site) (avg_over_time(probe_duration_seconds{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\", vantage=~\"$vantage\"}[$__range]))",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
