        {
          "type": "table",
          "id": 22,
          "title": "Certificates",
          "description": "Every certificate a TLS probe saw, fewest days left first: red under 7, amber under 21. Issued by: cert-manager (CertificateExpiringSoon watches those), AD CS (the DCs' auto-enrolment), device (linds-CA certificates that LINDS-Ansible playbooks/certificates.yml installs by hand) or Talos (the API server). ProbeCertificateExpiring fires for all but cert-manager's.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 41,
            "w": 12,
            "h": 16
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "(min by (target, kind, site, cert) (probe_ssl_earliest_cert_expiry{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}) - time()) / 86400",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "min by (target, kind, site, cert) (probe_ssl_earliest_cert_expiry{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}) * 1000",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "C",
              "expr": "max by (target, kind, site, cert, issuer) (label_replace(probe_ssl_last_chain_info{job=\"blackbox\", site=~\"$site\", kind=~\"$kind\", target=~\"$target\"}, \"issuer\", \"$1\", \"issuer\", \"CN=([^,]+).*\"))",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
