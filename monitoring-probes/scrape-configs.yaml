# The mTLS gate: a request with no client certificate must be refused (see blackbox.yml). From JD.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: mtls-gate-jd
  namespace: monitoring
  labels:
    # What the Prometheus resource selects scrape configs by.
    release: monitoring-kube-prometheus-stack
spec:
  jobName: mtls-gate
  metricsPath: /probe
  scrapeInterval: 15m
  # Above every module's timeout (10 s at most), so a probe that times
  # out still returns probe_success 0 instead of failing the scrape.
  scrapeTimeout: 15s
  staticConfigs:
    # home public: REFUSED is healthy: the mTLS ingress closes the connection to a request for home.linds.com.au without a client certificate (probe_success 0, probe_failed_due_to_regex 1)
    - targets: ["172.16.1.12:443"]
      labels:
        target: "home public"
        kind: "public"
        site: "jd"
        module: "mtls_gate_home"
        hostname: "home.linds.com.au"
