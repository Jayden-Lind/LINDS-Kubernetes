        hostname: "jd-dc-01.linds.com.au"
    # jd-dc-01 smb: TCP port 445 (SMB: SYSVOL and NETLOGON; on linds-dc also the LINDS NAS share) accepts a connection
    - targets: ["10.0.50.200:445"]
      labels:
        target: "jd-dc-01 smb"
        kind: "identity"
        site: "jd"
        module: "tcp"
    # linds-dc kerberos: TCP port 88 (Kerberos) accepts a connection
    - targets: ["10.3.1.200:88"]
      labels:
        target: "linds-dc kerberos"
        kind: "identity"
        site: "linds"
        module: "tcp"
    # linds-dc ldap: TCP port 389 (LDAP) accepts a connection
    - targets: ["10.3.1.200:389"]
      labels:
        target: "linds-dc ldap"
        kind: "identity"
        site: "linds"
        module: "tcp"
    # linds-dc ldaps: LDAPS on port 636 completes a TLS handshake with a valid certificate for linds-dc.linds.com.au
    - targets: ["10.3.1.200:636"]
      labels:
        target: "linds-dc ldaps"
        kind: "identity"
        site: "linds"
        module: "tls"
        cert: "ad-cs"
        hostname: "linds-dc.linds.com.au"
    # linds-dc smb: TCP port 445 (SMB: SYSVOL and NETLOGON; on linds-dc also the LINDS NAS share) accepts a connection
    - targets: ["10.3.1.200:445"]
      labels:
        target: "linds-dc smb"
        kind: "identity"
        site: "linds"
        module: "tcp"
    # linds-dc2 kerberos: TCP port 88 (Kerberos) accepts a connection
    - targets: ["10.3.1.201:88"]
      labels:
        target: "linds-dc2 kerberos"
        kind: "identity"
        site: "linds"
        module: "tcp"
    # linds-dc2 ldap: TCP port 389 (LDAP) accepts a connection
    - targets: ["10.3.1.201:389"]
      labels:
        target: "linds-dc2 ldap"
        kind: "identity"
        site: "linds"
        module: "tcp"
    # linds-dc2 ldaps: LDAPS on port 636 completes a TLS handshake with a valid certificate for linds-dc2.linds.com.au
    - targets: ["10.3.1.201:636"]
      labels:
        target: "linds-dc2 ldaps"
        kind: "identity"
        site: "linds"
        module: "tls"
        cert: "ad-cs"
        hostname: "linds-dc2.linds.com.au"
    # linds-dc2 smb: TCP port 445 (SMB: SYSVOL and NETLOGON; on linds-dc also the LINDS NAS share) accepts a connection
    - targets: ["10.3.1.201:445"]
      labels:
        target: "linds-dc2 smb"
        kind: "identity"
        site: "linds"
        module: "tcp"
    # keycloak: the linds realm's OpenID configuration answers 200 (what every Keycloak sign-in starts with)
    - targets: ["https://keycloak.linds.com.au/realms/linds/.well-known/openid-configuration"]
      labels:
        target: "keycloak"
        kind: "identity"
        site: "jd"
        module: "http_200"
        cert: "cert-manager"
    # jd-fs-01 smb: TCP port 445 (SMB) accepts a connection: the JD NAS share and the Immich and photo volumes
    - targets: ["jd-fs-01.linds.com.au:445"]
      labels:
        target: "jd-fs-01 smb"
        kind: "storage"
        site: "jd"
        module: "tcp"
    # jd-truenas-01 nfs: TCP port 2049 (NFS) accepts a connection: jd-proxmox-02's own NFS export, which StorageClass nfs-csi uses
    - targets: ["jd-truenas-01.linds.com.au:2049"]
      labels:
        target: "jd-truenas-01 nfs"
        kind: "storage"
        site: "jd"
        module: "tcp"
    # linds-truenas-01 nfs: TCP port 2049 (NFS) accepts a connection: the LINDS media share
    - targets: ["linds-truenas-01.linds.com.au:2049"]
      labels:
        target: "linds-truenas-01 nfs"
        kind: "storage"
        site: "linds"
        module: "tcp"
    # linds-truenas-01 https: the TrueNAS web UI answers 200 with its device certificate
    - targets: ["https://10.3.1.50/ui/"]
      labels:
        target: "linds-truenas-01 https"
        kind: "storage"
        site: "linds"
        module: "http_200"
        cert: "device"
    # jd-s3-01: versitygw's GET /health answers 200 (Terraform state, CNPG backups, Loki chunks)
    - targets: ["http://jd-s3-01.linds.com.au:9000/health"]
      labels:
        target: "jd-s3-01"
        kind: "storage"
        site: "jd"
        module: "http_200"
    # jd-proxmox-02 https: the Proxmox web UI answers 200 with its device certificate
    - targets: ["https://10.0.50.246:8006/"]
      labels:
        target: "jd-proxmox-02 https"
        kind: "hypervisor"
        site: "jd"
        module: "http_200"
        cert: "device"
    # linds-proxmox-01 https: the Proxmox web UI answers 200 with its device certificate
    - targets: ["https://192.168.6.205:8006/"]
      labels:
        target: "linds-proxmox-01 https"
        kind: "hypervisor"
        site: "linds"
        module: "http_200"
        cert: "device"
    # jd-proxmox-02 bmc: the XCC completes a TLS handshake with its device certificate
    - targets: ["10.0.50.240:443"]
      labels:
        target: "jd-proxmox-02 bmc"
        kind: "hypervisor"
        site: "jd"
        module: "tls"
        cert: "device"
        alert: "no"
    # linds-proxmox-01 bmc: the iDRAC completes a TLS handshake with its device certificate
    - targets: ["192.168.6.240:443"]
      labels:
        target: "linds-proxmox-01 bmc"
        kind: "hypervisor"
        site: "linds"
        module: "tls"
        cert: "device"
        alert: "no"
    # jd-unifi-01: the UniFi console completes a TLS handshake with its device certificate
    - targets: ["10.0.52.7:443"]
      labels:
        target: "jd-unifi-01"
        kind: "network"
        site: "jd"
        module: "tls"
        cert: "device"
    # linds-switch-02: the EdgeOS web UI completes a TLS handshake with its device certificate
    - targets: ["10.0.80.3:443"]
      labels:
        target: "linds-switch-02"
        kind: "network"
        site: "linds"
        module: "tls"
        cert: "device"
        alert: "no"
    # kubernetes-api: GET /readyz answers 200: the API server and etcd are ready
    - targets: ["https://10.0.53.200:6443/readyz"]
      labels:
        target: "kubernetes-api"
        kind: "platform"
        site: "jd"
        module: "http_kube_api"
        cert: "talos"
    # vault: GET /v1/sys/health answers 200: initialised, unsealed and active (503 is sealed)
    - targets: ["https://vault.linds.com.au/v1/sys/health"]
      labels:
        target: "vault"
        kind: "platform"
        site: "jd"
        module: "http_200"
        cert: "cert-manager"
  # action: replace is the default, written out so that ArgoCD's diff
  # matches what the API server stores.
  relabelings:
    - action: replace
      sourceLabels: [__address__]
      targetLabel: __param_target
    - action: replace
      sourceLabels: [__address__]
      targetLabel: instance
    - action: replace
      sourceLabels: [module]
      targetLabel: __param_module
    # Empty, and so not sent, for a target without a hostname label.
    - action: replace
      sourceLabels: [hostname]
      targetLabel: __param_hostname
    - action: replace
      targetLabel: vantage
      replacement: linds
    # The exporter's site on the target (so on up and PrometheusTargetDown),
    # the target's own in target_site. The docstring of targets.py says why.
    - action: replace
      sourceLabels: [site]
      targetLabel: target_site
    - action: replace
      targetLabel: site
      replacement: linds
    - action: replace
      targetLabel: __address__
      replacement: blackbox-exporter-linds.monitoring.svc:9115
  # The probe_* series get the target's site back.
  metricRelabelings:
    - action: replace
      sourceLabels: [target_site]
      targetLabel: site
    - action: labeldrop
      regex: target_site
---
