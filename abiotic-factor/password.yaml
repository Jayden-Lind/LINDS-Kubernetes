# Generated in-cluster once, not kept in git or Vault. Read it with:
#   kubectl get secret -n abiotic-factor abiotic-factor-password -o jsonpath='{.data.password}' | base64 -d
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: abiotic-factor-password
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Players type this in-game, so no symbols.
  length: 12
  digits: 3
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: abiotic-factor-password
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # A rotation would lock every player out until they were told the new one.
  refreshPolicy: CreatedOnce
  target:
    name: abiotic-factor-password
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: abiotic-factor-password
