        {
          "type": "table",
          "id": 28,
          "title": "Stopped guests",
          "description": "Guests that do not run (templates left out). Some are stopped on purpose: old copies kept after a rebuild, the weekly Backblaze VM, guests started by hand. VM 102 at LINDS must never be started. ProxmoxGuestStopped (a notice) fires when a guest that ran stops.",
