              "refId": "A",
              "expr": "sort_desc((1 - node_memory_MemAvailable_bytes{job=\"node-exporter\"} / node_memory_MemTotal_bytes{job=\"node-exporter\"}) * on (instance) group_left (nodename) node_uname_info{job=\"node-exporter\"} or label_replace(1 - node_memory_MemAvailable_bytes{job=\"router-node\"} / node_memory_MemTotal_bytes{job=\"router-node\"}, \"nodename\", \"$1\", \"instance\", \"(.+)\") or label_replace(pve_memory_usage_bytes{job=\"pve\", id=~\"node/.+\"} / pve_memory_size_bytes{job=\"pve\", id=~\"node/.+\"}, \"nodename\", \"$1\", \"instance\", \"(.+)\"))",
