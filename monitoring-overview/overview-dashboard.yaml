        {
          "type": "stat",
          "id": 8,
          "title": "Newest good copy of each chain",
          "description": "Snapshots at JD: sanoid's newest daily snapshot of VM/truenas-nas (Kubernetes volumes, NFS share, S3 data); daily, amber after 26 h, red after 50 h. Copy at LINDS: the newest snapshot that linds-truenas-01 pulled; 14 to 38 h is normal, amber after 40 h, red after 64 h. Postgres: the newest base backup (nightly, alert at 36 h) and the last archived WAL. Backblaze: the end of the last weekly run in which Backblaze finished (Prometheus keeps 14 days). DFS-R: error events in the last day. Shadow copies: Volsnap errors in 7 days (copies deleted). Guest backups: guests that no vzdump job covers.",
          "datasource": {
            "type": "datasource",
            "uid": "-- Mixed --"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "A",
              "expr": "(${__to:date:seconds} - max(max_over_time({job=\"syslog\", appname=\"sanoid\", hostname=\"jd-proxmox-02\"} |= \"taking snapshot \" |= \"_daily\" | label_format ts=`{{ __timestamp__ | unixEpoch }}` | unwrap ts [7d]))) or vector(999999999)",
              "legendFormat": "",
              "queryType": "instant"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "B",
              "expr": "(${__to:date:seconds} - max(max_over_time({job=\"syslog\", appname=\"ZETTAREPL\", hostname=\"linds-truenas-01.linds.com.au\"} |= \"doing pull from 'VM/truenas-nas' to 'NAS'\" | regexp \"of snapshot='autosnap_(?P<snap>[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}:[0-9]{2}:[0-9]{2})_daily'\" | label_format snapts=`{{ toDate \"2006-01-02_15:04:05\" .snap | unixEpoch }}` | unwrap snapts [7d]))) or vector(999999999)",
              "legendFormat": "",
              "queryType": "instant"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "C",
              "expr": "(sum(count_over_time({job=\"windows\", channel=\"DFS Replication\"} | level=\"error\" [1d])) or vector(0)) and on () (sum(count_over_time({job=\"windows\", channel=\"DFS Replication\"} [2d])) > 0) or vector(999999)",
              "legendFormat": "",
              "queryType": "instant"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "refId": "D",
              "expr": "(sum(count_over_time({job=\"windows\", channel=\"System\", level=\"error\"} | source=\"Volsnap\" [7d])) or vector(0)) and on () (sum(count_over_time({job=\"windows\", channel=\"System\"} [1d])) > 0) or vector(999999)",
              "legendFormat": "",
              "queryType": "instant"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "E",
              "expr": "time() - max(max_over_time((backblaze_run_last_end_timestamp_seconds{instance=\"jd-proxmox-02\"} and on (instance) (backblaze_run_completed{instance=\"jd-proxmox-02\"} == 1))[14d:10m])) or on () vector(999999999)",
              "legendFormat": "",
              "range": false,
              "instant": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "F",
              "expr": "time() - max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace=\"postgresql-linds\"}) or on () vector(999999999)",
              "legendFormat": "",
              "range": false,
              "instant": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "G",
              "expr": "max(cnpg_pg_stat_archiver_seconds_since_last_archival{namespace=\"postgresql-linds\"} and on (pod) (cnpg_pg_replication_in_recovery{namespace=\"postgresql-linds\"} == 0)) or on () vector(999999999)",
              "legendFormat": "",
              "range": false,
              "instant": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "H",
              "expr": "(count(pve_not_backed_up_info{job=\"pve\"} and on (instance, id) pve_guest_info{job=\"pve\", template=\"0\"}) or on () vector(0)) and on () (count(pve_guest_info{job=\"pve\"}) > 0)",
              "legendFormat": "",
              "range": false,
              "instant": true
            }
          ],
