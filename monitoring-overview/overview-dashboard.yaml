              "refId": "A",
              "expr": "max by (instance, id, name) (pve_up{job=\"pve\", id=~\"(qemu|lxc)/.+\"} * on (instance, id) group_left (name) pve_guest_info{job=\"pve\", template=\"0\"}) == 0",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "max by (instance, id, name) (max_over_time(pve_up{job=\"pve\", id=~\"(qemu|lxc)/.+\"}[1d]) * on (instance, id) group_left (name) pve_guest_info{job=\"pve\", template=\"0\"}) and on (instance, id) (pve_up{job=\"pve\", id=~\"(qemu|lxc)/.+\"} == 0)",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
