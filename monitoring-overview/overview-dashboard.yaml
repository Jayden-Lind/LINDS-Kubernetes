        {
          "type": "bargauge",
          "id": 26,
          "title": "Memory used",
          "description": "Memory in use on each Kubernetes node and router (MemAvailable), and on each Proxmox host as Proxmox counts it. NodeMemoryHigh fires at 90%, NodeMemoryCritical at 95%. jd-proxmox-02's figure includes the ZFS cache, which gives memory back when guests need it.",
