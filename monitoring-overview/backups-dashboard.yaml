          "title": "Gaps",
          "gridPos": {
            "x": 0,
            "y": 64,
            "w": 24,
            "h": 13
          },
          "options": {
            "mode": "markdown",
            "content": "| Data | What protects it | What is missing | Smallest change that closes it |\n|---|---|---|---|\n| Kubernetes control plane (etcd on talos-cp) | Nothing. The manifests are in git; the persistent volumes keep their data (Retain). | No etcd snapshot. Secrets and objects made by hand are lost with talos-cp's disk. | A timer that runs `talosctl etcd snapshot` into the S3 bucket, and a metric of its time (LINDS-Terraform or LINDS-Ansible). |\n| Proxmox guests | Nothing at guest level (no vzdump job). Their data is on ZFS or in DFS-R; Terraform and Ansible make them. | Router, DC and Talos system disks have no copy. | A decision: vzdump of the few guests that are slow to rebuild, or none. pve_not_backed_up_* then measures it. |\n| Domain controllers (AD) | Replication between the four DCs. | No system state backup, and AD replication health is not on a dashboard. | `wbadmin start systemstatebackup` on one DC, weekly, and its result in the event log that Alloy sends (LINDS-Ansible). |\n| DFS Replication | Events: errors only. | No backlog count, so a stuck replication with no error shows nothing. | Alloy on the file servers: `prometheus.exporter.windows` with the dfsr collector, or a task that logs `Get-DfsrBacklog` (LINDS-Ansible windows_logs). |\n| Shadow copies | Two per weekday on jd-fs-01 D: and linds-dc E:. | No event says that a copy was made; only the VSS start is seen. | The shadow copy task logs the count of copies (`vssadmin list shadows`) to the Application log (LINDS-Ansible windows_fileserver). |\n| TrueNAS replication | zettarepl's log. | A successful pull logs nothing at the end, so success is \"a pull started and no ERROR\". | TrueNAS SNMP has no replication data; the TrueNAS API (`replication.query`) through a small exporter would. |\n| LINDS media (ZFS_NAS) and JD HDD-20T | Nothing (media that can be downloaded again). | No snapshots. | A decision. If wanted: a sanoid policy (HDD-20T) or a TrueNAS snapshot task (ZFS_NAS). |\n"
          }
        }
      ]
