---
# Grafana dashboard "Hardware": both hosts' BMCs and Proxmox, and the LINDS
# NAS, switch and router. Picked up by the kube-prometheus grafana dashboard
# sidecar via the grafana_dashboard label; grafana_folder puts it in
# "Hardware".
#
# The data: the snmp, ipmi and pve jobs (scrape-configs.yaml). The alerts in
# rules.yaml show as annotations. Like the Router dashboard: status tiles use
# the status colours with a text label (green "✓ OK", amber "⚠ Warning", red
# "✗ Critical"), and series use the same fixed colours in the same order, so
# jd-proxmox-02 is blue and linds-proxmox-01 orange wherever both are drawn.
# Disks, pools and RAID are not here: storage health has them
# (base/monitoring/proxmox-storage-health.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hardware-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Hardware
data:
  hardware.json: |
    {
      "uid": "hardware",
      "title": "Hardware",
      "description": "Both hosts' BMCs and Proxmox, and the LINDS NAS, switch and router. Exporters, scrape jobs and alerts: LINDS-Kubernetes monitoring-hardware/ (README). Disks, pools and RAID: storage health (base/monitoring/proxmox-storage-health.yaml).",
      "tags": [
        "hardware",
        "proxmox"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "templating": {
        "list": []
      },
      "annotations": {
        "list": [
          {
            "name": "Hardware alerts",
            "enable": true,
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "expr": "ALERTS{alertname=~\"Hardware.*|ProxmoxGuestStopped|NetworkInterfaceErrors|StorageTrueNas.*|StorageProxmoxLocalNearlyFull\", alertstate=\"firing\"}",
            "step": "60s",
            "titleFormat": "{{alertname}}",
            "textFormat": "{{instance}} {{sensor}}{{name}}",
            "iconColor": "#d03b3b",
            "useValueForTime": false
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "id": 1,
          "title": "jd-proxmox-02",
          "description": "Worst state of any sensor on the XCC (IPMI): temperatures, fans, voltages, power, memory, processors, drive bays, PCIe errors, cables, intrusion. The row below breaks it down.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "max(max by (component) (label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace({job=\"ipmi\", instance=\"jd-proxmox-02\", __name__=~\"ipmi_(temperature|fan_speed|voltage|current|power)_state\"}, \"component\", \"$1\", \"__name__\", \"ipmi_(.+)_state\") or label_replace(ipmi_sensor_state{job=\"ipmi\", instance=\"jd-proxmox-02\", type=~\"Processor|Memory|Power Supply|Drive Slot|Critical Interrupt|Cable/Interconnect|Physical Security\"}, \"component\", \"$1\", \"type\", \"(.+)\"), \"component\", \"Temperatures\", \"component\", \"temperature\"), \"component\", \"Fans\", \"component\", \"fan_speed\"), \"component\", \"Voltages\", \"component\", \"voltage\"), \"component\", \"Power\", \"component\", \"current|power|Power Supply\"), \"component\", \"Processors\", \"component\", \"Processor\"), \"component\", \"Drive bays\", \"component\", \"Drive Slot\"), \"component\", \"PCIe errors\", \"component\", \"Critical Interrupt\"), \"component\", \"Cables\", \"component\", \"Cable/Interconnect\"), \"component\", \"Intrusion\", \"component\", \"Physical Security\")))",
              "legendFormat": "",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "✓ OK",
                      "color": "#0ca30c",
                      "index": 0
                    },
                    "1": {
                      "text": "⚠ Warning",
                      "color": "#fab219",
                      "index": 1
                    },
                    "2": {
                      "text": "✗ Critical",
                      "color": "#d03b3b",
                      "index": 2
                    },
                    "3": {
                      "text": "✗ Failed",
                      "color": "#d03b3b",
                      "index": 3
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": -2,
                    "to": -1,
                    "result": {
                      "text": "? Unknown",
                      "color": "text",
                      "index": 4
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "– No reading",
                      "color": "text",
                      "index": 5
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "noValue": "✗ No reading"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "text": {
              "valueSize": 30
            },
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
          "id": 2,
          "title": "linds-proxmox-01",
          "description": "Worst state of any component the iDRAC reports over SNMP, disks and RAID left out (those are storage health's). The row below breaks it down.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "max(max by (component) (label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace({job=\"snmp\", instance=\"linds-proxmox-01\", __name__=~\"(powerSupply|amperageProbe|coolingDevice|temperatureProbe|voltageProbe|memoryDevice|processorDevice|systemBattery|intrusion)Status\"}, \"component\", \"$1\", \"__name__\", \"(.+)Status\"), \"component\", \"Power\", \"component\", \"powerSupply|amperageProbe\"), \"component\", \"Fans\", \"component\", \"coolingDevice\"), \"component\", \"Temperatures\", \"component\", \"temperatureProbe\"), \"component\", \"Voltages\", \"component\", \"voltageProbe\"), \"component\", \"Memory\", \"component\", \"memoryDevice\"), \"component\", \"Processors\", \"component\", \"processorDevice\"), \"component\", \"Batteries\", \"component\", \"systemBattery\"), \"component\", \"Intrusion\", \"component\", \"intrusion\") - 3))",
              "legendFormat": "",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "✓ OK",
                      "color": "#0ca30c",
                      "index": 0
                    },
                    "1": {
                      "text": "⚠ Warning",
                      "color": "#fab219",
                      "index": 1
                    },
                    "2": {
                      "text": "✗ Critical",
                      "color": "#d03b3b",
                      "index": 2
                    },
                    "3": {
                      "text": "✗ Failed",
                      "color": "#d03b3b",
                      "index": 3
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": -2,
                    "to": -1,
                    "result": {
                      "text": "? Unknown",
                      "color": "text",
                      "index": 4
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "– No reading",
                      "color": "text",
                      "index": 5
                    }
                  }
                }
              ],
