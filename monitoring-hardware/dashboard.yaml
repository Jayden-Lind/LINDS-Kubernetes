        {
          "type": "stat",
          "id": 6,
          "title": "Devices not answering",
          "description": "Hardware targets (BMCs, Proxmox APIs, SNMP devices) that Prometheus could not read on its last scrape. PrometheusTargetDown names them.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 4
