        {
          "type": "stat",
          "id": 5,
          "title": "Guests running",
          "description": "Virtual machines and containers that Proxmox reports as running, per host.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 4
