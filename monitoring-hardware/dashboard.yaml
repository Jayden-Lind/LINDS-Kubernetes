            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "max(max by (component) (label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace({job=\"ipmi\", instance=\"jd-proxmox-02\", __name__=~\"ipmi_(temperature|fan_speed|voltage|current|power)_state\"}, \"component\", \"$1\", \"__name__\", \"ipmi_(.+)_state\") or label_replace(ipmi_sensor_state{job=\"ipmi\", instance=\"jd-proxmox-02\", type=~\"Processor|Memory|Power Supply|Drive Slot|Critical Interrupt|Cable/Interconnect|Physical Security\"}, \"component\", \"$1\", \"type\", \"(.+)\"), \"component\", \"Temperatures\", \"component\", \"temperature\"), \"component\", \"Fans\", \"component\", \"fan_speed\"), \"component\", \"Voltages\", \"component\", \"voltage\"), \"component\", \"Power\", \"component\", \"current|power|Power Supply\"), \"component\", \"Processors\", \"component\", \"Processor\"), \"component\", \"Drive bays\", \"component\", \"Drive Slot\"), \"component\", \"PCIe errors\", \"component\", \"Critical Interrupt\"), \"component\", \"Cables\", \"component\", \"Cable/Interconnect\"), \"component\", \"Intrusion\", \"component\", \"Physical Security\")))",
              "legendFormat": "",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "✓ OK",
                      "color": "#0ca30c",
                      "index": 0
                    },
                    "1": {
                      "text": "⚠ Warning",
                      "color": "#fab219",
                      "index": 1
                    },
                    "2": {
                      "text": "✗ Critical",
                      "color": "#d03b3b",
                      "index": 2
                    },
                    "3": {
                      "text": "✗ Failed",
                      "color": "#d03b3b",
                      "index": 3
                    }
                  }
                },
                {
                  "type": "range",
                  "options": {
                    "from": -2,
                    "to": -1,
                    "result": {
                      "text": "? Unknown",
                      "color": "text",
                      "index": 4
                    }
                  }
                },
                {
                  "type": "special",
                  "options": {
                    "match": "nan",
                    "result": {
                      "text": "– No reading",
                      "color": "text",
                      "index": 5
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "noValue": "✗ No reading"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "text": {
              "valueSize": 30
            },
            "showPercentChange": false
          }
        },
        {
          "type": "stat",
