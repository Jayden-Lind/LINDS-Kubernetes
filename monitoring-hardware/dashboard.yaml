---
# Grafana dashboard "Hardware": both hosts' BMCs, storage and Proxmox, and the
# LINDS NAS, switch and router. Picked up by the kube-prometheus grafana
# dashboard sidecar via the grafana_dashboard label; grafana_folder puts it in
# "Hardware".
#
# GENERATED by dashboard.py. Edit that file and run it again:
#   python3 monitoring-hardware/dashboard.py > monitoring-hardware/dashboard.yaml
#
# The data: the snmp, ipmi and pve jobs (scrape-configs.yaml) and storage
# health's proxmox-storage-health job. The alerts show as annotations. Like
# the Router dashboard: status tiles use the status colours with a text label
# (green "✓ OK", amber "⚠ Warning", red "✗ Critical"), and series use the
# same fixed colours in the same order, so jd-proxmox-02 is blue and
# linds-proxmox-01 orange wherever both are drawn.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hardware-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Hardware
data:
  hardware.json: |
    {
      "uid": "hardware",
      "title": "Hardware",
      "description": "Both hosts' BMCs, storage and Proxmox, and the LINDS NAS, switch and router. Exporters, scrape jobs and alerts: LINDS-Kubernetes monitoring-hardware/ (README). The Storage row reads storage health (base/monitoring/proxmox-storage-health.yaml).",
      "tags": [
        "hardware",
        "proxmox"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "templating": {
        "list": []
      },
      "annotations": {
        "list": [
          {
            "name": "Hardware alerts",
            "enable": true,
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "expr": "ALERTS{alertname=~\"Hardware.*|ProxmoxGuestStopped|NetworkInterfaceErrors|StorageTrueNas.*|StorageProxmoxLocalNearlyFull\", alertstate=\"firing\"} or ALERTS{alertname=~\"Storage.+\", severity=\"critical\", alertstate=\"firing\"}",
            "step": "60s",
            "titleFormat": "{{alertname}}",
            "textFormat": "{{instance}} {{sensor}}{{name}}{{pool}}{{device}}{{slot}}",
            "iconColor": "#d03b3b",
            "useValueForTime": false
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "id": 1,
          "title": "jd-proxmox-02",
          "description": "Worst state of any sensor on the XCC (IPMI): temperatures, fans, voltages, power, memory, processors, drive bays, PCIe errors, cables, intrusion. The row below breaks it down.",
