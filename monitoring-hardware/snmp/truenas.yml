# snmp_exporter module for TrueNAS: pool health, dataset space, pool I/O and
# the ARC. snmp_exporter's own snmp.yml has no TrueNAS module, so this one is
# written by hand from TRUENAS-MIB, which TrueNAS ships in
# /usr/share/snmp/mibs/TRUENAS-MIB.txt (checked against 25.10.7).
#
# Not here: hddTempTable (TRUENAS-MIB { trueNas 3 }). The MIB defines it, but
# 25.10 answers "No Such Object" for the whole subtree. linds-truenas-01 is a
# VM anyway: storage health watches the drives under its virtual disks. CPU,
# memory and interfaces come from the stock
# ucd_la_table, ucd_memory and if_mib modules, scraped in the same request
# (scrape-configs.yaml).
modules:
  truenas:
    walk:
      - 1.3.6.1.4.1.50536.1.1.1.1.2 # zpoolName
      - 1.3.6.1.4.1.50536.1.1.1.1.3 # zpoolHealth
      - 1.3.6.1.4.1.50536.1.1.1.1.6 # zpoolReadBytes
      - 1.3.6.1.4.1.50536.1.1.1.1.7 # zpoolWriteBytes
      - 1.3.6.1.4.1.50536.1.3 # arc
      - 1.3.6.1.4.1.50536.1.6.1.1.2 # datasetDescr
      - 1.3.6.1.4.1.50536.1.6.1.1.3 # datasetUsedBytes
      - 1.3.6.1.4.1.50536.1.6.1.1.4 # datasetAvailableBytes
    metrics:
      # A string ("ONLINE", "DEGRADED", ...). snmp_exporter puts a string in a
      # label of the same name, with the value 1.
      - name: zpoolHealth
        oid: 1.3.6.1.4.1.50536.1.1.1.1.3
        type: DisplayString
        help: The health of the zpool - 1.3.6.1.4.1.50536.1.1.1.1.3
        indexes:
          - labelname: zpoolIndex
            type: gauge
        lookups:
          - labels: [zpoolIndex]
            labelname: zpoolName
            oid: 1.3.6.1.4.1.50536.1.1.1.1.2
            type: DisplayString
      - name: zpoolReadBytes
        oid: 1.3.6.1.4.1.50536.1.1.1.1.6
        type: counter
        help: Bytes read from the zpool - 1.3.6.1.4.1.50536.1.1.1.1.6
        indexes:
          - labelname: zpoolIndex
            type: gauge
        lookups:
          - labels: [zpoolIndex]
            labelname: zpoolName
            oid: 1.3.6.1.4.1.50536.1.1.1.1.2
            type: DisplayString
      - name: zpoolWriteBytes
        oid: 1.3.6.1.4.1.50536.1.1.1.1.7
        type: counter
        help: Bytes written to the zpool - 1.3.6.1.4.1.50536.1.1.1.1.7
        indexes:
          - labelname: zpoolIndex
            type: gauge
        lookups:
          - labels: [zpoolIndex]
            labelname: zpoolName
            oid: 1.3.6.1.4.1.50536.1.1.1.1.2
            type: DisplayString
      # Counter64 in the MIB, but they are the ZFS "used" and "available"
      # properties, which go down as well as up.
      - name: datasetUsedBytes
        oid: 1.3.6.1.4.1.50536.1.6.1.1.3
        type: gauge
        help: The ZFS used property of the dataset - 1.3.6.1.4.1.50536.1.6.1.1.3
        indexes:
          - labelname: datasetIndex
            type: gauge
        lookups:
          - labels: [datasetIndex]
            labelname: datasetDescr
            oid: 1.3.6.1.4.1.50536.1.6.1.1.2
            type: DisplayString
      - name: datasetAvailableBytes
        oid: 1.3.6.1.4.1.50536.1.6.1.1.4
        type: gauge
        help: The ZFS available property of the dataset - 1.3.6.1.4.1.50536.1.6.1.1.4
        indexes:
          - labelname: datasetIndex
            type: gauge
        lookups:
          - labels: [datasetIndex]
            labelname: datasetDescr
            oid: 1.3.6.1.4.1.50536.1.6.1.1.2
            type: DisplayString
      # The agent reports the ARC sizes in KiB.
      - name: zfsArcSize
        oid: 1.3.6.1.4.1.50536.1.3.1
        type: gauge
        help: ARC size in bytes - 1.3.6.1.4.1.50536.1.3.1
        scale: 1024
      - name: zfsArcC
        oid: 1.3.6.1.4.1.50536.1.3.6
        type: gauge
        help: ARC target size in bytes - 1.3.6.1.4.1.50536.1.3.6
        scale: 1024
      # A percentage sent as a string ("99.93").
      - name: zfsArcCacheHitRatio
        oid: 1.3.6.1.4.1.50536.1.3.9
        type: DisplayString
        help: ARC hit ratio in percent - 1.3.6.1.4.1.50536.1.3.9
        regex_extracts:
          "":
            - regex: ^([0-9.]+)$
              value: $1
