# The logins of the IPMI and Proxmox exporters, from one Vault entry,
# linds-keyvault/hardware-monitoring:
#
#   jd_proxmox_02_bmc_password  the XCC's password for USERID
#   jd_proxmox_02_pve_token     the secret of prometheus@pve!pve-exporter on
#                               jd-proxmox-02
#   linds_proxmox_01_pve_token  the same on linds-proxmox-01
#
# Each ExternalSecret renders its exporter's whole config file, so the
# passwords exist only in these two Secrets. README.md says how the tokens
# were made and how to put new values in Vault (refreshPolicy OnChange: a
# Vault edit needs a force-sync).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ipmi-exporter-config
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  # refreshInterval, the template engine and merge policy and the remoteRef
  # strategies are ESO webhook defaults, declared explicitly so ArgoCD's diff
  # matches the live object.
  refreshInterval: 1h0m0s
  target:
    name: ipmi-exporter-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        # One module per BMC. privilege "user" reads every sensor and the
        # event log, and cannot change anything. toJson quotes the password
        # whatever characters it has.
        ipmi.yml: |
          modules:
            jd-proxmox-02:
              user: USERID
              pass: {{ .jd_proxmox_02_bmc_password | toJson }}
              driver: LAN_2_0
              privilege: user
              timeout: 10000
              collectors: [bmc, ipmi, chassis, dcmi, sel]
  data:
    - secretKey: jd_proxmox_02_bmc_password
      remoteRef:
        key: linds-keyvault/hardware-monitoring
        property: jd_proxmox_02_bmc_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pve-exporter-config
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshPolicy: OnChange
  refreshInterval: 1h0m0s
  target:
    name: pve-exporter-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        # One module per host. verify_ssl is off because each host's API
        # certificate is signed by its own Proxmox CA, and that CA has no
        # keyUsage extension, which the exporter's Python (3.13 and later)
        # rejects even with the CA pinned. The token can only read.
        pve.yml: |
          jd-proxmox-02:
            user: prometheus@pve
            token_name: pve-exporter
            token_value: {{ .jd_proxmox_02_pve_token | toJson }}
            verify_ssl: false
          linds-proxmox-01:
            user: prometheus@pve
            token_name: pve-exporter
            token_value: {{ .linds_proxmox_01_pve_token | toJson }}
            verify_ssl: false
  data:
    - secretKey: jd_proxmox_02_pve_token
      remoteRef:
        key: linds-keyvault/hardware-monitoring
        property: jd_proxmox_02_pve_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: linds_proxmox_01_pve_token
      remoteRef:
        key: linds-keyvault/hardware-monitoring
        property: linds_proxmox_01_pve_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
