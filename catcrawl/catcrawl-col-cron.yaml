apiVersion: batch/v1
kind: CronJob
metadata:
  name: catcrawl-col-scheduler
  namespace: default
spec:
  schedule: "0 2 * * 3"            # Wednesdays at 02:00
  concurrencyPolicy: Forbid        # never overlap two crawls
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Ceiling for the Job as a whole: two 5h attempts plus slack. The
      # meaningful per-attempt cap is on the Pod template below.
      activeDeadlineSeconds: 39600
      backoffLimit: 1
      # Delete the Job object 48h after it finishes, successful or not.
      # kube_job_failed is derived from the Job object, so without this a
      # failed run leaves a tombstone that keeps KubeJobFailed and
      # ColesCrawlJobFailed firing until three more runs fail and evict it
      # from failedJobsHistoryLimit. 48h is long enough to notice a
      # weekday failure and short enough that the alert clears itself
      # before the next weekly run. This also expires successful Jobs, so
      # the history shrinks to whatever ran in the last two days; pod logs
      # are shipped to Loki, which is where they should be read from now.
      ttlSecondsAfterFinished: 172800
      template:
        spec:
          # Per-attempt budget. activeDeadlineSeconds on the Job covers the
          # whole Job including retries, so with backoffLimit: 1 a slow first
          # attempt leaves the retry almost no time -- on 2026-08-17 attempt
          # one burned ~3h of the 4h Job budget and attempt two was killed 59
          # minutes in, mid-fetch, having crawled 8 of 22 categories. It still
          # pushed its partial counts on the way out, which is what tripped
          # ColesCrawlProductsDropped. Setting the deadline on the Pod instead
          # gives every attempt the same budget, because each retry is a new
          # Pod. 5h against a worst observed run of 3h37m.
          activeDeadlineSeconds: 18000
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
          # busybox initContainer fixes ownership of the PVC on first
          # mount so the non-root main container (UID 1001) can write
          # Chromium's SingletonLock and cookie store.
          # The PVC is pre-chowned to 1001:1001 on the NFS server; every
          # file Chromium writes thereafter is already owned by 1001
          # (the main container's UID). All this initContainer needs to
          # do is clear the stale Chromium singleton lock files left
          # behind by the previous pod — they're symlinks containing
          # <hostname>-<pid>, and a new pod with a different hostname
          # makes Chromium refuse to start ("profile appears to be in
          # use ... on another computer"). concurrencyPolicy: Forbid
          # already prevents two real concurrent runs.
          initContainers:
            - name: clear-chrome-locks
              image: busybox:1.38
              command:
                - sh
                - -c
                - "rm -f /data/chrome-profile/Singleton* /data/chrome-profile/*/Singleton* 2>/dev/null; echo done"
              volumeMounts:
                - name: chrome-profile
                  mountPath: /data/chrome-profile
          containers:
            - name: catcrawl-coles
              image: ghcr.io/jayden-lind/cat-crawl-coles:latest
              imagePullPolicy: Always
              # No args: the crawler is configured entirely from the
              # environment. It previously took -source and -chrome-profile
              # flags, which the image no longer accepts.
              env:
                - name: DB_HOST
                  valueFrom: { secretKeyRef: { name: catcrawl-coles-env-secret, key: DB_HOST } }
                - name: DB_USER
                  valueFrom: { secretKeyRef: { name: catcrawl-coles-env-secret, key: DB_USER } }
                - name: DB_PASSWORD
                  valueFrom: { secretKeyRef: { name: catcrawl-coles-env-secret, key: DB_PASSWORD } }
                - name: DB_PORT
                  valueFrom: { secretKeyRef: { name: catcrawl-coles-env-secret, key: DB_PORT } }
                - name: CAT_STORE_ID
                  valueFrom: { secretKeyRef: { name: catcrawl-coles-env-secret, key: CAT_STORE_ID } }
                # Persisted across runs on the PVC below, so Imperva sees a
                # returning visitor rather than a brand-new one every week.
                - name: CHROME_PROFILE
                  value: /data/chrome-profile
                # The crawl exits, so Prometheus cannot scrape it; it pushes its
                # outcome here instead. Unset would silently disable reporting,
                # which the ColesCrawlMetricsMissing alert then catches.
                - name: PUSHGATEWAY_URL
                  value: http://pushgateway.monitoring.svc:9091
              # API_KEY and API_URL are gone: the mobile API they authenticated
              # against has been blocked by Imperva since April and that code
              # path no longer exists. The keys remain in the secret for now.
              # Chromium rendering is bursty and parallel, and at a 2-core limit
              # it was being throttled in 36% of all CFS periods (39,281 of
              # 107,781 on the run of 2026-08-18). Peak usage read only 1.56
              # cores averaged over five minutes, which is why this did not look
              # like a CPU problem: throttling happens per 100ms period, so a
              # workload can sit well under its limit on average and still hit
              # the ceiling constantly.
              #
              # Four of twenty-two categories failed that run with
              # "context deadline exceeded" against a 60s per-page fetch budget.
              # A page that spends a third of its time descheduled has a good
              # chance of exhausting that.
              #
              # Three cores leaves headroom on the 4-core workers rather than
              # letting one weekly batch job monopolise a node. Removing the
              # limit altogether is the other defensible option — CPU is
              # compressible, so requests still guarantee neighbours their share
              # — but an unbounded limit on a job that runs Chromium is a bigger
              # change than the evidence calls for.
              resources:
                requests:
                  cpu: "1"
                  memory: "512Mi"
                limits:
                  cpu: "3"
                  memory: "2Gi"
              volumeMounts:
                - name: chrome-profile
                  mountPath: /data/chrome-profile
                - name: chrome-cache
                  mountPath: /tmp/chrome-cache
                - name: dshm
                  mountPath: /dev/shm
          volumes:
            - name: chrome-profile
              persistentVolumeClaim:
                claimName: catcrawl-coles-chrome-profile
            # Chromium's HTTP cache, deliberately NOT on the profile volume.
            #
            # The cache is worthless between weekly runs — every page is
            # refetched anyway — but Chromium never prunes it, so on the NFS
            # profile it simply accumulated: by 2026-08-19 it held 231,058
            # files in 2.0GB on a volume requesting 1Gi, and page loads had
            # started stalling past the crawler's 60s fetch timeout on cache
            # metadata alone. An emptyDir is discarded with the pod, and
            # CHROME_CACHE_MB caps it besides. Session cookies, which do need
            # to survive for the Imperva sensor, stay on chrome-profile.
            - name: chrome-cache
              emptyDir:
                sizeLimit: 512Mi
            # Chromium uses /dev/shm for shared memory between processes.
            # The kubelet's default 64MB tmpfs runs out mid-page; backing
            # /dev/shm with a memory-medium emptyDir avoids that.
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catcrawl-coles-chrome-profile
  namespace: default
spec:
  accessModes: ["ReadWriteMany"]   # NFS supports RWX, useful if you ever want a parallel debug pod
  resources:
    requests:
      storage: 1Gi
  storageClassName: nfs-csi
