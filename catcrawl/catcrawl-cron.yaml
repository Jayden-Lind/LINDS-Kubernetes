apiVersion: batch/v1
kind: CronJob
metadata:
  name: catcrawl-scheduler
  namespace: default
spec:
  schedule: "0 2 * * 3" 
  jobTemplate:
    spec:
      # See the matching comment in catcrawl-col-cron.yaml: a failed Job
      # object is what keeps KubeJobFailed firing, so it has to expire.
      ttlSecondsAfterFinished: 172800
      # This job previously had no deadline and no backoffLimit, so a hung
      # crawl would run indefinitely and concurrencyPolicy would block the
      # following week's run behind it. Same shape as the Coles job now:
      # a Job-wide ceiling, a per-attempt cap on the Pod, and one retry
      # rather than the default six.
      activeDeadlineSeconds: 39600
      backoffLimit: 1
      template:
        spec:
          # Per-attempt budget. activeDeadlineSeconds on the Job covers the
          # whole Job including retries, so with backoffLimit: 1 a slow first
          # attempt leaves the retry almost no time -- on 2026-08-17 attempt
          # one burned ~3h of the 4h Job budget and attempt two was killed 59
          # minutes in, mid-fetch, having crawled 8 of 22 categories. It still
          # pushed its partial counts on the way out, which is what tripped
          # ColesCrawlProductsDropped. Setting the deadline on the Pod instead
          # gives every attempt the same budget, because each retry is a new
          # Pod. 5h against a worst observed run of 3h37m.
          activeDeadlineSeconds: 18000
          containers:
          - name: catcrawl
            image: ghcr.io/jayden-lind/cat-crawl:latest
            imagePullPolicy: Always
            env:
              - name: DB_HOST
                valueFrom:
                  secretKeyRef:
                    name: catcrawl-env-secret
                    key: DB_HOST
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    name: catcrawl-env-secret
                    key: DB_USER
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: catcrawl-env-secret
                    key: DB_PASSWORD
              - name: DB_PORT
                valueFrom:
                  secretKeyRef:
                    name: catcrawl-env-secret
                    key: DB_PORT
              - name: CAT_STORE_ID
                valueFrom:
                  secretKeyRef:
                    name: catcrawl-env-secret
                    key: CAT_STORE_ID
              # One store per capital city and one regional town per state and
              # territory, chosen through each chain's own locator and checked
              # to be full-line supermarkets -- small formats (Woolworths
              # Metro, Coles Local and Central) carry a narrower range at
              # different prices, which would read as a regional difference.
              #
              # Only the categories below are captured at these stores. The
              # whole catalogue sixteen times over is sixteen times the
              # traffic for data that, department by department, mostly does
              # not vary; produce is the department where it does. See
              # docs/produce-pricing.md in the catcrawl repo.
              - name: CAT_EXTRA_STORES
                value: "1248=Sydney CBD,5662=Broken Hill,3304=Melbourne CBD,5674=Mildura,2596=Brisbane CBD,2537=Cairns,2539=Mount Isa,4365=Perth CBD,4304=Broome,5317=Adelaide CBD,5601=Port Augusta,7012=Hobart,7220=Launceston,5652=Darwin,5604=Alice Springs,1073=Canberra"
              - name: CAT_EXTRA_CATEGORIES
                value: "Fruit & Veg"
              - name: API_KEY
                valueFrom:
                  secretKeyRef:
                    name: catcrawl-env-secret
                    key: API_KEY
              - name: API_URL
                valueFrom:
                  secretKeyRef:
                    name: catcrawl-env-secret
                    key: API_URL
              # Where the crawl reports its outcome. Optional in the app: if this
              # is unset or the Pushgateway is unreachable, the crawl logs a
              # warning and carries on rather than failing.
              - name: PUSHGATEWAY_URL
                value: "http://pushgateway.monitoring.svc.cluster.local:9091"
          imagePullSecrets:
          - name: ghcr-pull-secret
          restartPolicy: Never
