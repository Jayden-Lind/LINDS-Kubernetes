        },
        {
          "type": "stat",
          "id": 7,
          "title": "401/403",
          "description": "HTTP answers 401 and 403 of the two ingress controllers in the time range: a request without a login or a client certificate. The dashboard \"Ingress traffic\" has the detail.",
          "gridPos": {
            "x": 21,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
