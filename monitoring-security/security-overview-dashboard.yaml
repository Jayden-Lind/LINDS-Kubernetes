                  "options": {
                    "0": {
                      "text": "● 0",
                      "color": "#0ca30c"
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
