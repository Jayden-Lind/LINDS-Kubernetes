        {
          "type": "state-timeline",
          "id": 23,
          "title": "Defence alerts in the time range",
          "gridPos": {
            "x": 12,
            "y": 50,
            "w": 12,
            "h": 10
          },
          "description": "Prometheus alerts on the defences and on the log pipeline: Suricata, the IPS, DNS, Loki, the tunnel. \"None firing\" fills the time when no such alert fired. The security alerts of Loki's ruler are not here: they have no history.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "range": true,
              "instant": false,
              "expr": "max by (alertname, instance, hostname) (ALERTS{alertstate=\"firing\", alertname=~\"RouterIPS.*|RouterSuricata.*|RouterDNS.*|LokiNotIngesting|RouterTunnelDown\"}) or on () label_replace(vector(0), \"alertname\", \"None firing\", \"\", \"\")",
              "legendFormat": "{{alertname}} {{instance}}{{hostname}}"
            }
          ],
          "options": {
            "showValue": "never",
            "mergeValues": true,
            "rowHeight": 0.5,
            "alignValue": "left",
            "legend": {
              "showLegend": false
            },
