        {
          "type": "alertlist",
          "id": 8,
          "title": "Security alerts firing now",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 9,
            "h": 9
          },
          "description": "The alerts with category=security that fire now, from Loki's ruler (windows-security-alerts, router-vpn-alerts, monitoring-security/rules.yaml). Alertmanager sends each one to Discord once. These alerts have no history: Loki's ruler does not store them. Empty: none fires.",
          "options": {
            "viewMode": "list",
            "groupMode": "default",
            "groupBy": [],
            "maxItems": 20,
            "sortOrder": 1,
            "dashboardAlerts": false,
            "alertName": "",
            "alertInstanceLabelFilter": "{category=\"security\"}",
            "datasource": "",
            "folder": null,
            "stateFilter": {
              "firing": true,
              "pending": true,
              "noData": false,
              "normal": false,
              "error": true
            },
            "showInstances": true
          }
        },
        {
          "type": "table",
          "id": 9,
          "title": "Logins in the time range",
          "gridPos": {
            "x": 9,
            "y": 4,
            "w": 15,
            "h": 9
          },
          "description": "Successful and failed logins for each system. Windows sends its failed logons only; Keycloak's logins are in the log since the change of keycloak/keycloak.yaml. \"sudo and su\": sudo outside Ansible, and the refusals. Open \"Access and logins\" for each event.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (system, result) (count_over_time({job=\"syslog\", appname=~\"sshd.*\", hostname=~\".+\"} |= \"Accepted \" | regexp `Accepted (?P<method>\\S+) for (?P<user>\\S+) from (?P<src>\\S+) port \\d+(?: ssh2(?:: (?P<key>.+))?)?` | label_format system=\"SSH\", result=\"Succeeded\" [$__range]))\nor\nsum by (system, result) (count_over_time({job=\"syslog\", appname=~\"sshd.*\", hostname=~\".+\"} |~ `(Connection closed by|Disconnected from|Disconnecting) (authenticating|invalid) user |Access denied for user ` | regexp `(?:for|user) (?P<user>\\S+) (?:from )?[0-9A-Fa-f.:]+(?: port| not allowed|$)` | regexp `User (?P<user>\\S+) from \\S+ not allowed` | regexp `Access denied for user (?P<user>\\S+)` | regexp `(?:from|user \\S*) (?P<src>[0-9A-Fa-f.:]+)(?: port|:| not allowed|$)` | label_format reason=`{{ if or (contains \"Invalid user\" __line__) (contains \"invalid user\" __line__) }}unknown user{{ else if contains \"Failed password\" __line__ }}wrong password{{ else if contains \"Failed keyboard-interactive\" __line__ }}wrong password{{ else if contains \"Failed publickey\" __line__ }}key refused{{ else if contains \"Failed \" __line__ }}login refused{{ else if or (contains \"maximum authentication\" __line__) (contains \"Too many authentication\" __line__) }}too many attempts{{ else if contains \"not allowed because\" __line__ }}user not allowed{{ else if contains \"Access denied\" __line__ }}refused by PAM{{ else if contains \"REFUSED\" __line__ }}root refused{{ else }}no key or password accepted{{ end }}` | label_format system=\"SSH\", result=\"Failed\" [$__range]))\nor\nsum by (system, result) (count_over_time({job=\"syslog\", appname=\"sudo\", hostname=~\".+\"} |= \" COMMAND=\" | regexp `(?P<user>[^ ]+) : +(?:[A-Z]+=[^;]*; +)*COMMAND=(?P<command>.*)` | regexp ` : +TTY=(?P<tty>[^ ]+) ;` | regexp `(?: : +|; )USER=(?P<run_as>[^ ]+) ;` | label_format command=`{{ if .command }}{{ .command }}{{ else }}{{ __line__ }}{{ end }}` | label_format kind=`{{ if contains \"BECOME-SUCCESS-\" .command }}Ansible{{ else if .tty }}Terminal{{ else }}No terminal{{ end }}` | kind!=\"Ansible\" | label_format system=\"sudo and su\", result=\"Succeeded\" [$__range]))\nor\nsum by (system, result) (count_over_time({job=\"syslog\", appname=~\"sudo|su\", hostname=~\".+\"} |~ ` : (user NOT in sudoers|[0-9]+ incorrect password attempts?|a password is required|command not allowed)|FAILED SU ` | regexp `(?P<user>[^ ]+) : (?P<reason>user NOT in sudoers|[0-9]+ incorrect password attempts?|a password is required|command not allowed)` | regexp `FAILED SU \\(to (?P<run_as>\\S+)\\) (?P<user>\\S+) on` | label_format reason=`{{ if .reason }}{{ .reason }}{{ else }}su refused{{ end }}` | label_format system=\"sudo and su\", result=\"Failed\" [$__range]))\nor\nsum by (system, result) (count_over_time({job=\"syslog\", appname=\"pvedaemon\", hostname=~\".+\"} |= \"successful auth for user\" | regexp `successful auth for user '(?P<user>[^']+)'` | label_format system=\"Proxmox\", result=\"Succeeded\" [$__range]))\nor\nsum by (system, result) (count_over_time({job=\"syslog\", appname=\"pvedaemon\", hostname=~\".+\"} |= \"authentication failure;\" | regexp `rhost=(?:::ffff:)?(?P<src>\\S*) user=(?P<user>\\S*) msg=(?P<reason>.*)` | label_format system=\"Proxmox\", result=\"Failed\" [$__range]))\nor\nsum by (system, result) (count_over_time({job=\"syslog\", appname=\"charon-systemd\", hostname=~\".+\"} |= \" established between \" | regexp `IKE_SA (?P<conn>[^\\[ ]+)\\[\\d+\\] established between [^\\[]+\\[[^\\]]*\\]\\.\\.\\.(?P<src>[^\\[]+)\\[(?P<user>[^\\]]*)\\]` | conn!=\"LINDS\" | label_format system=\"VPN\", result=\"Succeeded\" [$__range]))\nor\nsum by (system, result) (count_over_time({job=\"syslog\", appname=\"charon-systemd\", hostname=~\".+\"} |~ `EAP-MS-CHAPv2 verification failed|no EAP key found|EAP method EAP_[A-Z0-9]+ failed|with EAP failed` | regexp `no EAP key found for hosts '[^']*' - '(?P<user>[^']*)'` | label_format reason=`{{ if contains \"no EAP key\" __line__ }}unknown user{{ else if contains \"verification failed\" __line__ }}wrong password{{ else }}EAP failed{{ end }}` | label_format system=\"VPN\", result=\"Failed\" [$__range]))\nor\nsum by (system, result) (count_over_time({job=\"windows\", channel=\"Security\", hostname=~\".+\"} | event_id=~\"4625|4771|4776\" | json event_data=\"event_data\" | line_format \"{{.event_data}}\" | regexp \"<Data Name='TargetUserName'>(?P<user>[^<]*)</Data>\" | regexp \"<Data Name='TargetDomainName'>(?P<domain>[^<]*)</Data>\" | regexp \"<Data Name='IpAddress'>(?:::ffff:)?(?P<client>[^<]*)</Data>\" | regexp \"<Data Name='WorkstationName'>(?P<workstation>[^<]*)</Data>\" | regexp \"<Data Name='LogonType'>(?P<logon_type>[^<]*)</Data>\" | regexp \"<Data Name='Status'>(?P<status>[^<]*)</Data>\" | regexp \"<Data Name='SubStatus'>(?P<substatus>[^<]*)</Data>\" | regexp \"<Data Name='Workstation'>(?P<workstation>[^<]*)</Data>\" | label_format reason=`{{ if and .substatus (ne .substatus \"0x0\") }}{{ .substatus }}{{ else }}{{ .status }}{{ end }}`, client=`{{ if and .client (ne .client \"-\") }}{{ .client }}{{ else }}(no address){{ end }}`, event=`{{ if eq .event_id \"4625\" }}4625 failed logon{{ else if eq .event_id \"4771\" }}4771 Kerberos pre-auth failed{{ else }}4776 NTLM check failed{{ end }}` | label_format system=\"Windows domain\", result=\"Failed\" [$__range]))\nor\nsum by (system, result) (count_over_time({namespace=\"keycloak\", container=\"keycloak\"} |= \"[org.keycloak.events]\" |= `type=\"` | regexp `type=\"(?P<kc_event>[^\"]*)\"` | regexp `clientId=\"(?P<client>[^\"]*)\"` | regexp `ipAddress=\"(?P<src>[^\"]*)\"` | regexp `error=\"(?P<error>[^\"]*)\"` | regexp `username=\"(?P<user>[^\"]*)\"` | kc_event=\"LOGIN\" | label_format system=\"Keycloak\", result=\"Succeeded\" [$__range]))\nor\nsum by (system, result) (count_over_time({namespace=\"keycloak\", container=\"keycloak\"} |= \"[org.keycloak.events]\" |= `type=\"` | regexp `type=\"(?P<kc_event>[^\"]*)\"` | regexp `clientId=\"(?P<client>[^\"]*)\"` | regexp `ipAddress=\"(?P<src>[^\"]*)\"` | regexp `error=\"(?P<error>[^\"]*)\"` | regexp `username=\"(?P<user>[^\"]*)\"` | kc_event=\"LOGIN_ERROR\" | label_format system=\"Keycloak\", result=\"Failed\" [$__range]))\nor\nsum by (system, result) (count_over_time({namespace=\"argocd\", container=\"argocd-server\"} |= \"Web login successful\" | json login_type=\"[\\\"login.type\\\"]\", claims=\"claims\" | line_format \"{{.claims}}\" | json user=\"preferred_username\" | label_format system=\"Argo CD\", result=\"Succeeded\" [$__range]))\nor\nsum by (system, result) (count_over_time({namespace=\"argocd\", container=\"argocd-server\"} |= \"finished call\" |= \"session.SessionService\" | json method=\"[\\\"grpc.method\\\"]\", code=\"[\\\"grpc.code\\\"]\", error=\"[\\\"grpc.error\\\"]\" | method=\"Create\" | code=\"OK\" | label_format system=\"Argo CD\", result=\"Succeeded\" [$__range]))\nor\nsum by (system, result) (count_over_time({namespace=\"argocd\", container=\"argocd-server\"} |= \"finished call\" |= \"session.SessionService\" | json method=\"[\\\"grpc.method\\\"]\", code=\"[\\\"grpc.code\\\"]\", error=\"[\\\"grpc.error\\\"]\" | method=\"Create\" | code!=\"OK\" | label_format system=\"Argo CD\", result=\"Failed\" [$__range]))\nor\nsum by (system, result) (count_over_time({namespace=\"monitoring\", container=\"grafana\"} |= \"Failed to authenticate request\" | logfmt client, error | client!=\"auth.client.session\" | label_format system=\"Grafana\", result=\"Failed\" [$__range]))",
