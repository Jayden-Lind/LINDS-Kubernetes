        {
          "type": "stat",
          "id": 5,
          "title": "Quiet sources",
          "description": "Log sources that always send logs (the routers, the Proxmox hosts, TrueNAS, the Windows servers) and sent nothing for 2 hours. The alert LogSourceSilent is the same test. See \"Log sources\" below.",
