        {
          "type": "table",
          "id": 22,
          "title": "Log sources: the last line from each",
          "gridPos": {
            "x": 0,
            "y": 50,
            "w": 12,
            "h": 10
          },
          "description": "Each host that sent syslog or Windows logs in the last 7 days, the oldest first. A source that stops sending logs is blind: the alerts on its logs cannot fire. The routers, the Proxmox hosts, TrueNAS and the Windows servers send at least every hour (alert LogSourceSilent after 2 hours); the torrent VMs, the Plex VM and the switches can be quiet for hours. Suricata: the tiles at the top.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "max by (job, hostname) (max_over_time({job=~\"syslog|windows\"} | label_format ts=`{{ unixEpoch __timestamp__ }}` | unwrap ts [7d])) * 1000",
              "queryType": "instant",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "hostname": 0,
                  "job": 1,
                  "Value #A": 2
                },
                "renameByName": {
                  "hostname": "Host",
                  "job": "Kind",
                  "Value #A": "Last line"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Last line"
                  }
                ]
              }
            }
          ],
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left"
              },
              "noValue": ""
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last line"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeFromNow"
                  }
