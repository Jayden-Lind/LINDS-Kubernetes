---
# Grafana dashboard "Security overview" (folder Security, uid security-overview).
# The Grafana dashboard sidecar reads it (label grafana_dashboard).
#
# GENERATED. Edit dashboards.py and make this file again:
#   python3 monitoring-security/dashboards.py
#
# See monitoring-security/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Security
data:
  security-overview.json: |
    {
      "uid": "security-overview",
      "title": "Security overview",
      "description": "Is something attacking or failing now, and are the defences on? Each block links to the dashboard with the detail. Source: LINDS-Kubernetes monitoring-security/.",
      "tags": [
        "security",
        "logins",
        "suricata",
        "dns"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "refresh": "5m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "annotations": {
        "list": []
      },
      "links": [
        {
          "title": "Access and logins",
          "type": "link",
          "url": "/d/security-access",
          "icon": "dashboard",
          "keepTime": true
        },
        {
          "title": "Suricata",
          "type": "link",
          "url": "/d/suricata",
          "icon": "dashboard",
          "keepTime": true
        },
        {
          "title": "DNS blocking",
          "type": "link",
          "url": "/d/dns-blocking",
          "icon": "dashboard",
          "keepTime": true
        },
        {
          "title": "Network devices",
          "type": "link",
          "url": "/d/network-devices",
          "icon": "dashboard",
          "keepTime": true
        },
        {
          "title": "Logs / Windows",
          "type": "link",
          "url": "/d/logs-windows",
          "icon": "dashboard",
          "keepTime": true
        },
        {
          "title": "Router",
          "type": "link",
          "url": "/d/router",
          "icon": "dashboard",
          "keepTime": true
        },
        {
          "title": "Ingress traffic",
          "type": "link",
          "url": "/d/ingress-traffic",
          "icon": "dashboard",
          "keepTime": true
        },
        {
          "title": "Availability",
          "type": "link",
          "url": "/d/availability",
          "icon": "dashboard"
        },
        {
          "title": "Backups",
          "type": "link",
          "url": "/d/backups",
          "icon": "dashboard"
        },
        {
          "title": "Overview",
          "type": "link",
          "url": "/d/overview",
          "icon": "dashboard"
        }
      ],
      "templating": {
        "list": []
      },
      "panels": [
        {
          "type": "stat",
          "id": 1,
          "title": "IPS at JD",
          "description": "Suricata on jd-router-01 is inline: it blocks. \"Not blocking\" means it is off or not on its queue (alerts RouterIPSOff, RouterIPSNotAttached). linds-router-01 only reports.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "router_ips_enabled * on (instance) router_ips_attached",
              "legendFormat": "{{instance}}",
              "range": false,
              "instant": true,
              "editorMode": "code",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center",
            "orientation": "auto",
            "wideLayout": true,
            "showPercentChange": false,
            "text": {}
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "▲ No data",
              "decimals": null,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "● Blocking",
                      "color": "#0ca30c",
                      "index": 0
                    },
                    "0": {
                      "text": "▲ Not blocking",
                      "color": "#d03b3b",
                      "index": 1
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "#d03b3b"
                  },
                  {
                    "value": 1,
                    "color": "#0ca30c"
                  }
                ]
              }
            },
            "overrides": []
          },
          "links": [
            {
              "title": "Router",
              "url": "/d/router?${__url_time_range}"
            },
            {
              "title": "Suricata",
              "url": "/d/suricata?${__url_time_range}"
            }
          ]
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Suricata, 15 min",
          "description": "EVE lines in the last 15 minutes from each router's Suricata. 0 means it, or the relay to Loki, stopped (alert RouterSuricataNoLogs).",
          "gridPos": {
            "x": 3,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (hostname) (increase(loki_process_custom_suricata_eve_lines_total[15m]))",
