          "targets": [
            {
              "refId": "A",
              "expr": "count(sum by (job, hostname) (count_over_time({job=~\"syslog|windows\", hostname=~\"jd-router-01|linds-router-01|jd-proxmox-02|linds-proxmox-01|linds-truenas-01.linds.com.au|jd-dc-01|jd-fs-01|linds-dc|linds-dc2\"}[1d])) unless on (job, hostname) sum by (job, hostname) (count_over_time({job=~\"syslog|windows\", hostname=~\"jd-router-01|linds-router-01|jd-proxmox-02|linds-proxmox-01|linds-truenas-01.linds.com.au|jd-dc-01|jd-fs-01|linds-dc|linds-dc2\"}[2h])))",
              "legendFormat": "",
              "queryType": "instant",
              "instant": true,
              "range": false,
              "datasource": {
