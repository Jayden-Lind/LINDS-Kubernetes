name: Validate manifests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Single pin for the collection: used by the cache key and the install.
      ZABBIX_COLLECTION_VERSION: 4.2.0
      # Schema sources are tried in order. Locally generated schemas (see the
      # step below) win over the CRDs-catalog, which tracks upstream main and
      # so can disagree with the versions this repo actually pins.
      KUBECONFORM_ARGS: >-
        -strict
        -summary
        -ignore-missing-schemas
        -schema-location default
        -schema-location crd-schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Generate schemas for pinned CRDs
        run: |
          set -euo pipefail
          # The CRDs-catalog lags upstream: it rejected barman-cloud's
          # data.compression: lz4, which the pinned v0.13.0 ObjectStore CRD
          # accepts. Rather than pin yet another version here, derive the
          # schemas from the CRD bundles the kustomizations already pin, so
          # validation tracks whatever version this repo deploys.
          curl -sSLO https://raw.githubusercontent.com/yannh/kubeconform/master/scripts/openapi2jsonschema.py
          # venv keeps this working regardless of the runner's PEP 668 stance.
          python3 -m venv .venv
          .venv/bin/pip install --quiet pyyaml
          urls=$(git ls-files '*kustomization.yaml' \
            | xargs grep -hoE '^[[:space:]]*-[[:space:]]+https://[^[:space:]]+\.ya?ml' \
            | sed -E 's/^[[:space:]]*-[[:space:]]+//' | sort -u)
          echo "Deriving CRD schemas from:"; echo "${urls}"
          mkdir -p crd-schemas
          # openapi2jsonschema writes into the cwd, so run it from there.
          root="${PWD}"
          echo "${urls}" | (cd crd-schemas \
            && xargs -r "${root}/.venv/bin/python" "${root}/openapi2jsonschema.py")

      - name: Build and validate kustomizations
        run: |
          set -euo pipefail
          for dir in $(git ls-files '*kustomization.yaml' | xargs -n1 dirname); do
            echo "--- ${dir}"
            kubectl kustomize "${dir}" | kubeconform ${KUBECONFORM_ARGS}
          done

      - name: Validate Argo CD Applications
        run: |
          kubeconform ${KUBECONFORM_ARGS} applications/

      # Galaxy is the flakiest dependency in this workflow: it sometimes cuts
      # a response short mid-body, which ansible-galaxy reports as an
      # IncompleteRead crash rather than retrying. Cache the installed
      # collection so most runs never talk to Galaxy at all.
      - name: Cache Ansible collections
        id: collections-cache
        uses: actions/cache@v6
        with:
          path: ~/.ansible/collections
          key: ansible-collections-community.zabbix-${{ env.ZABBIX_COLLECTION_VERSION }}

      # Syntax and structure only. Nothing in CI can reach the cluster, so the
      # real check on the Zabbix playbook is the PostSync Job failing a sync.
      - name: Lint the Zabbix configuration playbook
        run: |
          set -euo pipefail
          python3 -m venv .venv-ansible
          .venv-ansible/bin/pip install --quiet ansible-core
          if [ "${{ steps.collections-cache.outputs.cache-hit }}" != "true" ]; then
            # Cache miss: fetch from Galaxy, retrying the truncated-response
            # failures described above with a growing back-off.
            for attempt in 1 2 3 4 5; do
              if .venv-ansible/bin/ansible-galaxy collection install \
                  "community.zabbix:==${ZABBIX_COLLECTION_VERSION}"; then
                break
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "::error::ansible-galaxy failed ${attempt} times; giving up"
                exit 1
              fi
              echo "ansible-galaxy failed (attempt ${attempt}); retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            done
          fi
          cd zabbix/config
          ../../.venv-ansible/bin/ansible-playbook \
            -i inventory.yml site.yml --syntax-check
