name: Build claude-code workspace image

on:
  push:
    branches: [master]
    paths:
      - "claude-code/Dockerfile"
      - "claude-code/entrypoint.sh"
      - "claude-code/rc-server.sh"
      - ".github/workflows/build-claude-code.yaml"
  pull_request:
    paths:
      - "claude-code/Dockerfile"
      - "claude-code/entrypoint.sh"
      - "claude-code/rc-server.sh"
      - ".github/workflows/build-claude-code.yaml"
  # Weekly rebuild picks up base-image CVE fixes and the current Claude Code
  # release, since the CLI's own auto-updater is disabled inside the image.
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/claude-code-workspace

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests only build to validate the Dockerfile; nothing is pushed.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: claude-code
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
