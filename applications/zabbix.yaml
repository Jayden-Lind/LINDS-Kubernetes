apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zabbix
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: zabbix
  # The chart source MUST stay first, as it is in every other helm+git
  # Application here. With the git source at index 0 the UI aimed its
  # RevisionMetadata call - which only makes sense for git - at the chart
  # source and asked for revision "default", so opening the app in Argo CD
  # returned "error acquiring repo lock ... fatal: repository
  # 'https://zabbix-community.github.io/helm-zabbix/' not found". Syncing was
  # unaffected throughout; the damage was confined to the UI.
  sources:
    - repoURL: https://zabbix-community.github.io/helm-zabbix/
      chart: zabbix
      targetRevision: 7.1.0
      helm:
        releaseName: zabbix
        values: |
          zabbixImageTag: alpine-7.4-latest

          postgresAccess:
            # Copy of the old zalando-operator-named secret; rotation is still
            # manual (must match the CNPG postgres-user secret).
            existingSecretName: zabbix-db-creds
            secretHostKey: ""
            secretPortKey: ""
            secretUserKey: username
            secretPasswordKey: password
            secretDBKey: ""
            host: linds-postgres-rw.postgresql-linds.svc.cluster.local
            port: "5432"
            database: zabbix

          postgresql:
            enabled: false

          zabbixServer:
            enabled: true
            replicaCount: 2
            podAntiAffinity: true
            zabbixServerHA:
              enabled: true
              dbCreateUpgradeJob:
                image:
                  tagSuffix: "20250802113243"
                # This PreSync hook must run next to the database. Scheduled at
                # linds it read dbversion over the saturated link, got an empty
                # result back, concluded the schema was missing and tried to
                # recreate all 207 tables - which aborts the transaction and
                # leaves the hook running until it is killed, blocking every
                # Argo sync behind it. (Nothing was applied; the transaction
                # rolls back.) The template's own nodeSelector comes from
                # zabbixServer.nodeSelector, which would pin the server too, so
                # set it here instead - safe while that value stays empty.
                extraPodSpecs:
                  nodeSelector:
                    datacenter: jd
            image:
              # Oracle Linux base instead of the global alpine tag: Alpine's
              # libcurl 8.21.0 leaks memory and file descriptors on TLS
              # connections, which drains through the http agent poller
              # (~112 MiB/hr, OOM at the 2Gi limit every ~14h). ol ships
              # libcurl 8.12.1. Only the server polls over HTTPS, so the
              # other components stay on the smaller alpine images.
              # Revert to alpine once curl >8.21.0 carries the fix.
              tag: ol-7.4-latest
              pullPolicy: Always
            securityContext:
              privileged: true
            resources:
              requests: { cpu: 100m, memory: 1Gi }
              limits: { memory: 2Gi }
            extraEnv:
              # Sized for a ~10-host homelab; the previous 1-2G caches held
              # ~5GB of shared memory per replica for no benefit.
              - { name: ZBX_CACHESIZE, value: "256M" }
              - { name: ZBX_TRENDCACHESIZE, value: "128M" }
              - { name: ZBX_HISTORYCACHESIZE, value: "256M" }
              - { name: ZBX_HISTORYINDEXCACHESIZE, value: "64M" }
              - { name: ZBX_STARTTRAPPERS, value: "5" }
              - { name: ZBX_STARTPREPROCESSORS, value: "10" }
              - { name: ZBX_STARTDBSYNCERS, value: "10" }
              - { name: ZBX_ENABLE_SNMP_TRAPS, value: "true" }
              - { name: ZBX_STARTPROXYPOLLERS, value: "5" }
              - { name: ZBX_PROXYCONFIGFREQUENCY, value: "60" }
              - { name: ZBX_STARTVMWARECOLLECTORS, value: "10" }
              - { name: ZBX_VMWAREFREQUENCY, value: "60" }
              - { name: ZBX_VMWAREPERFFREQUENCY, value: "60" }
              - { name: ZBX_VMWARETIMEOUT, value: "10" }
              - { name: ZBX_STARTIPMIPOLLERS, value: "3" }
              - { name: ZBX_TIMEOUT, value: "10" }
              - { name: ZBX_STARTPOLLERS, value: "8" }
              - { name: ZBX_STARTPINGERS, value: "2" }
              - { name: ZBX_STARTSNMPPOLLERS, value: "2" }
              - { name: ZBX_SERVICEMANAGERSYNCFREQUENCY, value: "10" }
              - { name: ZBX_PROBLEMHOUSEKEEPINGFREQUENCY, value: "60" }
              - { name: ZBX_ALLOWUNSUPPORTEDDBVERSIONS, value: "1" }
            extraPodSpecs:
              # The DB host is a 4-dot name, so the default ndots:5 makes the
              # resolver walk all four search domains (including linds.com.au,
              # which leaves the cluster) before trying the real name - ~10 DNS
              # packets per connection. ndots:2 tries the absolute name first.
              # Short names like zabbix-zabbix-server still resolve via search.
              dnsConfig:
                options:
                  - { name: ndots, value: "2" }
              # The chart's podAntiAffinity only spreads over hostname, so both
              # replicas can (and did) land in the same datacenter - which
              # defeats the point of running two. Spread over the site instead.
              # ScheduleAnyway, not DoNotSchedule: if one site is down we want
              # the survivor to keep running, not to block on an unmeetable
              # constraint or deadlock a rollout on maxSurge.
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: datacenter
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: zabbix
                      app.kubernetes.io/instance: zabbix
                      app.kubernetes.io/component: server
            extraContainers:
              - name: zabbix-snmptraps
                image: zabbix/zabbix-snmptraps:alpine-7.4-latest
                imagePullPolicy: Always
                ports:
                  - containerPort: 1162
                    protocol: UDP
                    name: snmp-trap
                volumeMounts:
                  - name: zabbix-snmptraps
                    mountPath: /var/lib/zabbix/snmptraps/
              # The zabbix-zabbix-server Service selects on
              # zabbix.com/server-ha-role=active, which this sidecar sets on
              # whichever pod is the active HA node. Chart 7.1.0 nests it inside
              # "if zabbixAgent.runAsSidecar" (deployment-zabbix-server.yaml:177),
              # so running the agent as a DaemonSet silently drops it and the
              # Service ends up with zero endpoints - the frontend then stalls
              # ~1-3.5s per page on the server check and active agent checks
              # break. Declaring it here restores upstream's intent; it needs
              # only LABEL_NAME, and the chart already gives the pod
              # shareProcessNamespace and the RBAC to label itself.
              - name: ha-labels-sidecar
                image: ghcr.io/zabbix-community/zabbix-server-ha-label-manager:20241230230305
                imagePullPolicy: IfNotPresent
                env:
                  - { name: LABEL_NAME, value: zabbix.com/server-ha-role }
                resources:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { memory: 64Mi }
            extraVolumes:
              - name: zabbix-snmptraps
                emptyDir: {}
            extraVolumeMounts:
              - name: zabbix-snmptraps
                mountPath: /var/lib/zabbix/snmptraps
                readOnly: true

          zabbixWeb:
            enabled: true
            replicaCount: 2
            podAntiAffinity: true
            image:
              pullPolicy: Always
            # Was unset, which made these pods BestEffort - first in line for
            # eviction under node pressure despite being the only user-facing
            # component. No CPU limit: page renders are bursty and throttling
            # them is worse than letting them spike.
            resources:
              requests: { cpu: 100m, memory: 256Mi }
              limits: { memory: 1Gi }
            extraPodSpecs:
              # See the zabbixServer note - the frontend opens a new DB
              # connection per request, so the ndots:5 search-domain walk is
              # paid on every page load.
              dnsConfig:
                options:
                  - { name: ndots, value: "2" }
              # Keep the frontend in the same datacenter as Postgres. The
              # frontend makes ~75 sequential DB round-trips to render a page,
              # so the same pod measures 0.03s at jd and 3-7s at linds - a 100x
              # difference that is pure inter-site latency, not tuning.
              #
              # This costs no availability: both CNPG instances are at jd, so a
              # web pod at linds has no database during a site split and could
              # never serve there anyway. Remote-site resilience needs a Zabbix
              # proxy at linds, not a frontend replica.
              #
              # Note the chart's own web podAntiAffinity is a no-op regardless -
              # it selects app.kubernetes.io/instance=zabbix-zabbix-web while
              # the pods are labelled instance=zabbix.
              #
              # Expressed as nodeSelector below rather than a nodeAffinity here:
              # the chart emits its own "affinity:" key after extraPodSpecs, so
              # an affinity set here is silently overridden by the duplicate.
            nodeSelector:
              datacenter: jd
            extraVolumes:
              - name: nginx-gzip
                configMap:
                  name: zabbix-web-nginx-gzip
              # Keycloak's realm SAML signing certificate. Zabbix reads the IdP
              # certificate from disk - zabbix.conf.php resolves $SSO['IDP_CERT']
              # to this exact path and there is no API or UI field for it - so
              # SAML login fails with a signature error if this mount is absent,
              # however correct the user directory looks in the frontend.
              # The ConfigMap comes from zabbix/kustomization.yaml.
              - name: saml-idp
                configMap:
                  name: zabbix-saml-idp
            extraVolumeMounts:
              - name: nginx-gzip
                mountPath: /etc/nginx/http.d/00-gzip.conf
                subPath: 00-gzip.conf
                readOnly: true
              # subPath, so the mount does not hide the rest of certs/ - the
              # image also resolves vault.crt, vault.key, sp.key and sp.crt
              # from this directory.
              - name: saml-idp
                mountPath: /etc/zabbix/web/certs/idp.crt
                subPath: idp.crt
                readOnly: true
            extraEnv:
              # The chart never sets these for the web tier - its env block is
              # only postgresAccess plus whatever is listed here. Without
              # ZBX_SERVER_HOST, zabbix.conf.php leaves $ZBX_SERVER unset, so
              # the frontend has no idea where the server is and System
              # Information permanently reports "Zabbix server is running: No"
              # (which also disables Execute now, queue and script actions).
              - { name: ZBX_SERVER_HOST, value: "zabbix-zabbix-server" }
              - { name: ZBX_SERVER_PORT, value: "10051" }
              - { name: ZBX_SERVER_NAME, value: "LINDS-Zabbix" }
              # Without this, SAML login dies at Keycloak with "Invalid
              # redirect uri". index_sso.php builds the SP's
              # AssertionConsumerServiceURL from the PHP request environment,
              # and TLS terminates at the ingress - so the pod sees plain HTTP
              # on 8080 and sends
              # http://zabbix.linds.com.au:8080/index_sso.php?acs, which
              # matches no redirect URI on the Keycloak client.
              #
              # baseurl overrides the auto-detection outright
              # (index_sso.php:73-75). Preferred over the use_proxy_headers
              # option on the next line of that file, because this depends on
              # one value we already control rather than on the ingress
              # emitting a correct X-Forwarded-Port.
              - { name: ZBX_SSO_SETTINGS, value: '{"baseurl":"https://zabbix.linds.com.au"}' }
              - { name: PHP_TZ, value: "Australia/Melbourne" }
              - { name: ZBX_DB_VERIFY_HOST, value: "false" }
              - { name: ENABLE_WEB_ACCESS_LOG, value: "true" }

          zabbixAgent:
            enabled: true
            runAsSidecar: false
            runAsDaemonSet: true
            image:
              repository: zabbix/zabbix-agent2
              pullPolicy: Always
            ZBX_SERVER_HOST: zabbix-zabbix-server
            ZBX_PASSIVE_ALLOW: true
            ZBX_ACTIVE_ALLOW: true
            ZBX_DEBUGLEVEL: 3
            ZBX_TIMEOUT: 4
            hostNetwork: true
            hostRootFsMount: true
            resources:
              requests: { cpu: 100m, memory: 64Mi }
              limits:   { cpu: 200m, memory: 128Mi }
            securityContext:
              privileged: true
            extraEnv:
              - { name: ZBX_DENYKEY,             value: "system.run[*]" }
              - { name: ZBX_LOGREMOTECOMMANDS,   value: "1" }
              - { name: ZBX_UNSAFEUSERPARAMETERS, value: "0" }
              - { name: DEBUG_MODE,              value: "3" }

          # A proxy at the linds site, so the hosts that live there are polled
          # from 0.4ms away instead of 13ms across the inter-site link.
          # Measured from the two sites (ICMP avg):
          #
          #   target            from linds    from jd
          #   192.168.6.1        0.42 ms      13.10 ms
          #   192.168.6.205      0.48 ms      12.79 ms
          #   192.168.6.210      1.94 ms      13.99 ms
          #   10.3.1.50          0.40 ms      12.92 ms
          #   10.0.50.246       14.71 ms       0.19 ms
          #
          # Everything is routed and reachable from both sites, so this buys
          # latency and link resilience, not connectivity. The active server
          # sits at jd (it follows Postgres), which is why the linds hosts were
          # paying the crossing on every single check.
          zabbixProxy:
            enabled: true
            replicaCount: 1
            # Must match the proxy object the playbook registers - see
            # zabbix/config/proxies.yml. The server rejects an unknown proxy.
            ZBX_HOSTNAME: linds
            # Active mode: the proxy dials out to the server, so there is no
            # ingress or NodePort to expose. It also buffers locally while the
            # link is down and catches up afterwards, which is the second
            # reason to want it.
            ZBX_PROXYMODE: 0
            ZBX_SERVER_HOST: zabbix-zabbix-server
            ZBX_SERVER_PORT: 10051
            ZBX_TIMEOUT: 10
            ZBX_DEBUGLEVEL: 3
            image:
              # NOT the global alpine tag. LINDS-Proxmox-01 carries 22 HTTP
              # agent items polling the Proxmox API over TLS, and once that
              # host moves here the proxy inherits exactly the libcurl leak
              # documented on zabbixServer above (~112 MiB/hr, OOM at the
              # memory limit every ~14h). ol ships libcurl 8.12.1.
              # Revert to alpine at the same time as the server, not before.
              repository: zabbix/zabbix-proxy-sqlite3
              tag: ol-7.4-latest
              pullPolicy: Always
            # The chart renders no volume for the proxy, so SQLite lives in the
            # container's writable layer. That is the right call here: the only
            # storage class available is democratic-csi iSCSI backed by
            # 10.0.50.246 *at jd*, so a "persistent" proxy database would write
            # every sample back across the link this proxy exists to avoid.
            # The cost of ephemeral is the unsent buffer on restart.
            resources:
              requests: { cpu: 100m, memory: 256Mi }
              limits: { memory: 512Mi }
            nodeSelector:
              datacenter: linds
            extraEnv:
              # Almost every item on the linds hosts is SNMP (~800 of ~900),
              # so the SNMP pollers are the ones that matter.
              - { name: ZBX_STARTSNMPPOLLERS, value: "4" }
              - { name: ZBX_STARTPOLLERS, value: "5" }
              - { name: ZBX_STARTPINGERS, value: "2" }
              # Network discovery runs here now; the default of 1 discoverer
              # would walk two /24s serially.
              - { name: ZBX_STARTDISCOVERERS, value: "3" }
              - { name: ZBX_CACHESIZE, value: "64M" }
              - { name: ZBX_HISTORYCACHESIZE, value: "32M" }
              # How long the proxy keeps data the server has not collected.
              - { name: ZBX_PROXYOFFLINEBUFFER, value: "24" }
              - { name: ZBX_ENABLEREMOTECOMMANDS, value: "0" }
            extraPodSpecs:
              # Same reasoning as the server and web tiers: the 4-dot service
              # name makes the default ndots:5 walk every search domain first.
              dnsConfig:
                options:
                  - { name: ndots, value: "2" }

          # No host has a JMX interface (nothing in zabbix/config references
          # one), so the gateway only ever served the chart's TCP probes - and
          # logged "error processing request: null" for every single probe
          # connection. Disabling it also renders ZBX_JAVAGATEWAY_ENABLE=false
          # on the server, so the Java pollers stop starting.
          zabbixJavaGateway:
            enabled: false

          zabbixWebService:
            enabled: false

          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: linds-ca
            pathType: Prefix
            hosts:
              - host: zabbix.linds.com.au
                paths:
                  - path: /
                    pathType: Prefix
            tls:
              - secretName: zabbix.linds.com.au
                hosts:
                  - zabbix.linds.com.au

          extraManifests:
            # The web image's nginx only gzips text/plain, text/css and the
            # legacy application/x-javascript type, so jsLoader.php ships
            # ~1.7 MB uncompressed on every cold load (403 KB gzipped).
            # gzip_types accumulates within the http context, and
            # /etc/nginx/http.d/*.conf is included there, so this appends to
            # the image's list rather than replacing it.
            - apiVersion: v1
              kind: ConfigMap
              metadata:
                name: zabbix-web-nginx-gzip
                labels:
                  app.kubernetes.io/name: zabbix
                  app.kubernetes.io/component: web
              data:
                00-gzip.conf: |
                  gzip_types application/javascript application/json application/xml image/svg+xml;
                  gzip_vary on;
            - apiVersion: v1
              kind: Service
              metadata:
                name: zabbix-snmptraps
                labels:
                  app.kubernetes.io/name: zabbix
                  app.kubernetes.io/component: snmptraps
              spec:
                type: ClusterIP
                ports:
                  - name: snmp-trap
                    port: 162
                    targetPort: 1162
                    protocol: UDP
                selector:
                  app.kubernetes.io/name: zabbix
                  app.kubernetes.io/instance: zabbix
                  app.kubernetes.io/component: server

    # Configuration as code: host groups, hosts, templates, alerting,
    # discovery, access and SSO, reconciled into the running Zabbix by a
    # PostSync hook. Kept in the same Application as the chart so the hook is
    # guaranteed to run after the server is up. See zabbix/README.md.
    - repoURL: https://github.com/Jayden-Lind/LINDS-Kubernetes
      targetRevision: master
      path: zabbix
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
