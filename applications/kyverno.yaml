apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  sources:
    - chart: kyverno
      repoURL: https://kyverno.github.io/kyverno
      targetRevision: 3.9.1
      helm:
        releaseName: kyverno
        valuesObject:
          # Only the admission + background controllers are needed for the
          # mTLS ingress-mirroring generate policy (kyverno/). The reports
          # and cleanup controllers are dead weight without audit/cleanup
          # policies, so keep them off.
          reportsController:
            enabled: false
          cleanupController:
            enabled: false
          # Each controller renewed its leader-election lease every 2s. On
          # 2026-10-04 lease renewals were 90% of all API writes in this
          # cluster (6.4 of 7.1 a second), and etcd fsyncs every one of them
          # onto the JD SSD pool. Kyverno sets the lease to six times this
          # value, so 10s means a 60s lease renewed every 10s. Each controller
          # runs one replica; the only cost is that one killed without
          # releasing its lease is replaced as leader after up to 60s instead
          # of 12s. The admission webhook answers whether or not it is leader.
          admissionController:
            container:
              extraArgs:
                leaderElectionRetryPeriod: 10s
          backgroundController:
            extraArgs:
              leaderElectionRetryPeriod: 10s
    # Policies live here; ArgoCD-managed from GitHub, so they must be
    # pushed to master before they take effect.
    - repoURL: "https://github.com/Jayden-Lind/LINDS-Kubernetes"
      targetRevision: HEAD
      path: kyverno/
  ignoreDifferences:
    # Kyverno's aggregated ClusterRoles get their .rules filled in by
    # kube-controller-manager; that drift is ignored cluster-wide via
    # resource.compareoptions.ignoreAggregatedRoles in bootstrap/.
    # Chart 3.8.2 renders the new policies.kyverno.io CRDs with literal
    # empty labels/annotations maps ({}), which ArgoCD diffs against the
    # live objects' absent fields — permanent OutOfSync. crds.additionalLabels
    # doesn't reach those templates either, so ignore both entirely.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .metadata.labels
        - .metadata.annotations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
