apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: democratic-csi-iscsi
  namespace: argocd
spec:
  project: default
  # democratic-csi/ renders the chart (kustomization.yaml, values.yaml) and
  # patches it, and adds the node plugin's iscsiadm wrapper. Renovate's
  # kustomize manager updates the chart version there.
  source:
    repoURL: https://github.com/Jayden-Lind/LINDS-Kubernetes
    targetRevision: master
    path: democratic-csi
  destination:
    server: https://kubernetes.default.svc
    namespace: democratic-csi
  syncPolicy:
    # The iSCSI node plugin is privileged (host namespaces, hostPath, mounts
    # on the host). Mark the namespace privileged on purpose, so the
    # cluster's baseline warnings (LINDS-Terraform proxmox/talos.tf) do not
    # flag it on every upgrade. Same as applications/home-assistant.yaml.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/warn: privileged
        pod-security.kubernetes.io/audit: privileged
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
