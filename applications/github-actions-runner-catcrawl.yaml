apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gha-runner-scale-set-catcrawl
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  source:
    chart: gha-runner-scale-set
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    targetRevision: 0.15.0
    helm:
      releaseName: arc-runner-set
      valuesObject:
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-gha-rs-controller

        githubConfigUrl: "https://github.com/Jayden-Lind/catcrawl"

        githubConfigSecret: pre-defined-secret

        containerMode:
          type: "dind"

        # Where runner pods may land. The dind sidecar unpacks image layers
        # onto the node's own disk: on 2026-10-03/04, 13 of 15 runner pods ran
        # on talos-cp and wrote 40 GiB to the disk etcd lives on (79 GiB that
        # day against a usual 16-21). Bulk writes there are what make etcd miss
        # its fsync deadline and the API server drop out.
        #
        # required: never the control plane. preferred: the LINDS workers,
        # whose disks are not on the JD SSD pool at all. They have 4 older
        # cores each, so builds run slower there; if that hurts, delete the
        # preferred block and the JD workers take the jobs again.
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: datacenter
                          operator: In
                          values:
                            - linds
  syncPolicy:
    automated:
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: actions.github.com
      kind: AutoscalingListener
      jsonPointers:
        - /
