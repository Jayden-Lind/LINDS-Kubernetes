apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-loki
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.3.0
      helm:
        releaseName: loki
        valuesObject:
          loki:
            auth_enabled: false
            commonConfig:
              replication_factor: 1
            schemaConfig:
              configs:
                - from: 2024-04-01
                  store: tsdb
                  object_store: s3
                  schema: v13
                  index:
                    prefix: loki_index_
                    period: 24h
            ingester:
              chunk_encoding: zstd
            tracing:
              enabled: false
            querier:
              # Concurrent sub-queries per querier. Was 2, which serialised
              # every wide-range dashboard; the SingleBinary pod has a 3-CPU
              # limit and sits at ~10% of it.
              max_concurrent: 6
            # 30-day log retention; enforced by the compactor below
            limits_config:
              retention_period: 720h
              # --- ingest ---
              # Syslog messages arrive up to 1 MiB (suricata EVE alerts embed
              # packet payloads); the default max line is 256 KiB and lines
              # over it are rejected, not truncated.
              max_line_size: 2MB
              max_line_size_truncate: false
              # Alert storms on the vyos feed pushed ~3M lines/day through one
              # stream; the defaults (4 MB/s tenant, 3 MB/s stream) 429'd them.
              ingestion_rate_mb: 16
              ingestion_burst_size_mb: 32
              per_stream_rate_limit: 8MB
              per_stream_rate_limit_burst: 32MB
              max_global_streams_per_user: 20000
              # --- query ---
              # What "Grafana can fetch more data" actually depends on: series
              # per metric query (default 500) and lines per log query
              # (default 5000, mirrored by the datasource maxLines).
              max_query_series: 2000
              max_entries_limit_per_query: 20000
            compactor:
              working_directory: /var/loki/compactor
              retention_enabled: true
              retention_delete_delay: 2h
              retention_delete_worker_count: 150
              delete_request_store: s3
            storage:
              bucketNames:
                chunks: loki-chunks
                ruler: loki-ruler
              type: 's3'
              s3:
                endpoint: jd-s3-01.linds.com.au:9000
                s3ForcePathStyle: true
                insecure: true
                accessKeyId: ${accessKeyId}
                secretAccessKey: ${secretAccessKey}


          deploymentMode: SingleBinary
          singleBinary:
            replicas: 1
            # WAL/index live on JD-side iSCSI; keep the pod next to the volume.
            nodeSelector:
              datacenter: jd
            persistence:
              enabled: true
              enableStatefulSetAutoDeletePVC: false
              size: 20Gi
              storageClass: zfs-iscsi
              accessModes:
                - ReadWriteOnce
            resources:
              limits:
                cpu: 3
                memory: 4Gi
              requests:
                cpu: 2
                memory: 2Gi
            extraArgs:
              - -config.expand-env=true
            extraEnv:
              - name: accessKeyId
                valueFrom:
                  secretKeyRef:
                    name: loki-access-creds
                    key: accessKeyId
              - name: secretAccessKey
                valueFrom:
                  secretKeyRef:
                    name: loki-access-creds
                    key: secretAccessKey

          # Keep both memcached caches on the JD site next to loki-0 — the
          # chunks cache once landed on a linds worker and every chunk lookup
          # crossed the ~13ms/52Mbit IPsec link (slow dashboards).
          chunksCache:
            # default is 500MB, with limited memory keep this smaller
            writebackSizeLimit: 10MB
            # Chart default is 8GB of memcached (a ~9.8Gi request) — the very
            # reason this pod could only ever schedule on a remote linds
            # worker. 1GB is plenty at this ingest volume.
            allocatedMemory: 1024
            nodeSelector:
              datacenter: jd
          resultsCache:
            nodeSelector:
              datacenter: jd

          # Enable minio for storage
          minio:
            enabled: false

          # Not needed for SingleBinary
          gateway:
            enabled: false

          # Logs + metrics only. Keep dashboards; drop canary/selfMonitoring/rules.
          monitoring:
            serviceMonitor:
              enabled: true
              labels:
                release: monitoring-kube-prometheus-stack
              metricsInstance:
                enabled: false
            selfMonitoring:
              enabled: false
              grafanaAgent:
                installOperator: false
            lokiCanary:
              enabled: false
            rules:
              enabled: false
            # Loki's bundled ~10 operator-grade dashboards are overkill here;
            # its metrics stay scraped for alerting.
            dashboards:
              enabled: false

          # Zero out replica counts of other deployment modes
          backend:
            replicas: 0
          read:
            replicas: 0
          write:
            replicas: 0

          ingester:
            replicas: 0
          querier:
            replicas: 0
          queryFrontend:
            replicas: 0
          queryScheduler:
            replicas: 0
          distributor:
            replicas: 0
          compactor:
            replicas: 0
          indexGateway:
            replicas: 0
          bloomCompactor:
            replicas: 0
          bloomGateway:
            replicas: 0
          lokiCanary:
            enabled: false
          test:
            enabled: false


    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.12.1
      helm:
        releaseName: alloy-podlogs
        values: |
          controller:
            type: deployment
            replicas: 1
            # Same-site as Loki: syslog ingest (incl. the vyos suricata feed)
            # shouldn't detour via the linds site.
            nodeSelector:
              datacenter: jd

          service:
            enabled: true
            type: LoadBalancer
            # Preserve real syslog client source IP (no SNAT to cluster IP)
            externalTrafficPolicy: Local
            annotations:
              lbipam.cilium.io/ips: "172.16.1.23"

          # Metrics: let kube-prometheus scrape Alloy's own metrics
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: monitoring-kube-prometheus-stack

          alloy:
            # Steady state is ~130Mi; the chart default (10m/50Mi) under-books it.
            resources:
              requests:
                cpu: 50m
                memory: 192Mi

            extraPorts:
              - name: "syslog-udp"
                port: 1514
                targetPort: 1514
                protocol: "UDP"
              - name: "syslog-tcp"
                port: 1515
                targetPort: 1515
                protocol: "TCP"
              - name: "syslog-udp-old"
                port: 514
                targetPort: 514
                protocol: "UDP"

            configMap:
              content: |
                // --- Kubernetes pod logs ---
                discovery.kubernetes "pods" {
                  role = "pod"
                }

                // Without this relabel every pod log stream carried only
                // job="loki.source.kubernetes.pods" and an instance label, so
                // Grafana saw one giant "service" and nothing could be
                // filtered by namespace or pod. The __meta_* labels are
                // dropped after relabelling, so these rules are what decides
                // the stream labels Loki keeps. Log levels are not extracted
                // here: Loki's discover_log_levels derives detected_level
                // server-side for every line (that is what the Logs
                // dashboards and Drilldown filter on).
                discovery.relabel "pods" {
                  targets = discovery.kubernetes.pods.targets

                  rule {
                    source_labels = ["__meta_kubernetes_namespace"]
                    target_label  = "namespace"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_name"]
                    target_label  = "pod"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_container_name"]
                    target_label  = "container"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_node_name"]
                    target_label  = "node"
                  }
                  // app: app.kubernetes.io/name, else the legacy app label,
                  // else the container name. The ";(.+)" rules only fire when
                  // the first source label is still empty.
                  rule {
                    source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                    target_label  = "app"
                  }
                  rule {
                    source_labels = ["app", "__meta_kubernetes_pod_label_app"]
                    separator     = ";"
                    regex         = ";(.+)"
                    replacement   = "$1"
                    target_label  = "app"
                  }
                  rule {
                    source_labels = ["app", "__meta_kubernetes_pod_container_name"]
                    separator     = ";"
                    regex         = ";(.+)"
                    replacement   = "$1"
                    target_label  = "app"
                  }
                  // What Grafana Logs Drilldown groups by.
                  rule {
                    source_labels = ["app"]
                    target_label  = "service_name"
                  }
                  rule {
                    source_labels = ["namespace", "app"]
                    separator     = "/"
                    target_label  = "job"
                  }
                }

                loki.source.kubernetes "pods" {
                  targets    = discovery.relabel.pods.output
                  forward_to = [loki.write.default.receiver]
                }

                // --- Syslog: three listeners -> relabel -> process -> Loki ---
                // Message size: a UDP datagram physically tops out at 64 KiB,
                // so both UDP listeners take the maximum. The TCP listener
                // carries suricata EVE alerts (packet payloads embedded) and
                // takes up to 1 MiB. Loki's max_line_size above is 2 MB so
                // nothing accepted here is rejected downstream.
                loki.source.syslog "syslog" {
                  // Legacy devices on UDP/514: strict RFC3164 (LINDS-Switch-01).
                  // An RFC5424 message sent here fails with "expecting a
                  // sequence number [col 4]" and is dropped - modern senders
                  // (proxmox, truenas, torrent, plex) belong on 1514.
                  listener {
                    address  = "0.0.0.0:514"
                    protocol = "udp"
                    syslog_format = "rfc3164"
                    rfc3164_default_to_current_year = true
                    label_structured_data = true
                    max_message_length = 65536
                    labels   = { job = "syslog", transport = "udp", port = "514" }
                  }

                  // General UDP/1514: strict RFC5424, whole formatted message
                  // kept as the log line (hostname/app/pid stay visible).
                  listener {
                    address  = "0.0.0.0:1514"
                    protocol = "udp"
                    syslog_format = "rfc5424"
                    use_rfc5424_message = true
                    label_structured_data = true
                    max_message_length = 65536
                    labels   = { job = "syslog", transport = "udp", port = "1514" }
                  }

                  // TCP/1515: strict RFC5424, octet-counted, message body only.
                  // Sole sender is jd-vyos-01 (suricata EVE JSON + system logs);
                  // keeping only the MSG part is what lets `| json` parse EVE.
                  listener {
                    address  = "0.0.0.0:1515"
                    protocol = "tcp"
                    syslog_format = "rfc5424"
                    max_message_length = 1048576
                    // EVE bursts queue in rsyslog before they reach us; the
                    // message's own timestamp keeps them in wire order.
                    use_incoming_timestamp = true
                    label_structured_data = true
                    labels   = { job = "syslog", transport = "tcp", port = "1515" }
                  }
                  relabel_rules = loki.relabel.syslog.rules
                  forward_to    = [loki.process.syslog.receiver]
                }

                // Rules only: the listeners apply these through relabel_rules.
                // Nothing is ever sent to this component's receiver.
                loki.relabel "syslog" {
                  forward_to = []

                  rule {
                    action        = "replace"
                    source_labels = ["__syslog_connection_hostname"]
                    target_label  = "host"
                  }
                  rule {
                    action        = "replace"
                    source_labels = ["__syslog_connection_ip_address"]
                    target_label  = "sender_ip"
                  }
                  rule {
                    source_labels = ["__syslog_message_severity"]
                    target_label  = "severity"
                  }
                  rule {
                    source_labels = ["__syslog_message_hostname"]
                    target_label  = "hostname"
                  }
                  rule {
                    source_labels = ["__syslog_message_app_name"]
                    target_label  = "appname"
                  }
                  // These three exist as labels only long enough for
                  // loki.process.syslog to move them into structured metadata.
                  rule {
                    source_labels = ["__syslog_message_facility"]
                    target_label  = "facility"
                  }
                  rule {
                    source_labels = ["__syslog_message_proc_id"]
                    target_label  = "procid"
                  }
                  rule {
                    source_labels = ["__syslog_message_msg_id"]
                    target_label  = "msgid"
                  }

                  // --- Split into distinct Grafana services (rules are ordered;
                  // later matches override earlier ones):
                  //   suricata EVE events -> "suricata"
                  //   jd-vyos-01 system logs -> "vyos"
                  //   VM/appliance senders keep job="syslog" from the listener.
                  rule {
                    source_labels = ["__syslog_message_hostname"]
                    regex         = "jd-vyos-01"
                    target_label  = "job"
                    replacement   = "vyos"
                  }
                  rule {
                    source_labels = ["__syslog_message_hostname"]
                    regex         = "jd-vyos-01"
                    target_label  = "service_name"
                    replacement   = "vyos"
                  }
                  rule {
                    source_labels = ["__syslog_message_app_name"]
                    regex         = "suricata"
                    target_label  = "job"
                    replacement   = "suricata"
                  }
                  rule {
                    source_labels = ["__syslog_message_app_name"]
                    regex         = "suricata"
                    target_label  = "service_name"
                    replacement   = "suricata"
                  }
                }

                loki.process "syslog" {
                  forward_to = [loki.write.default.receiver]

                  // procid as a stream label was a cardinality bomb: 6.9k
                  // distinct values, 84% of every stream in Loki, and the
                  // Drilldown label browser was unusable. As structured
                  // metadata it stays queryable (`| procid="1234"`) without
                  // splitting streams. (The stage moves matching labels.)
                  stage.structured_metadata {
                    values = {
                      procid   = "",
                      msgid    = "",
                      facility = "",
                    }
                  }

                  // Suricata EVE: event_type becomes a label (about a dozen
                  // values), and the fields the dashboards aggregate on become
                  // structured metadata, so panels filter with
                  // `| alert_severity="1"` instead of `| json` over every line.
                  // Absent fields (e.g. alert.* on a dns event) are skipped.
                  stage.match {
                    selector = "{job=\"suricata\"}"

                    stage.json {
                      expressions = {
                        event_type         = "event_type",
                        alert_signature    = "alert.signature",
                        alert_signature_id = "alert.signature_id",
                        alert_category     = "alert.category",
                        alert_severity     = "alert.severity",
                        alert_action       = "alert.action",
                        src_ip             = "src_ip",
                        dest_ip            = "dest_ip",
                        dest_port          = "dest_port",
                        proto              = "proto",
                        app_proto          = "app_proto",
                        dns_type           = "dns.type",
                        dns_rrname         = "dns.rrname",
                        tls_sni            = "tls.sni",
                        http_hostname      = "http.hostname",
                        http_method        = "http.method",
                        http_status        = "http.status",
                      }
                    }
                    stage.labels {
                      values = {
                        event_type = "",
                      }
                    }
                    stage.structured_metadata {
                      values = {
                        alert_signature    = "",
                        alert_signature_id = "",
                        alert_category     = "",
                        alert_severity     = "",
                        alert_action       = "",
                        src_ip             = "",
                        dest_ip            = "",
                        dest_port          = "",
                        proto              = "",
                        app_proto          = "",
                        dns_type           = "",
                        dns_rrname         = "",
                        tls_sni            = "",
                        http_hostname      = "",
                        http_method        = "",
                        http_status        = "",
                      }
                    }
                  }
                }

                // --- Write to Loki ---
                loki.write "default" {
                  endpoint {
                    url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                  }
                }
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # SSA + server-side diff together: the chart's StatefulSet has
      # volumeClaimTemplates, whose API-defaulted apiVersion/kind/status
      # fields read as permanent drift under SSA with the classic diff.
      - ServerSideApply=true
      - ServerSideDiff=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
