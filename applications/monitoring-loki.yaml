apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-loki
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.3.0
      helm:
        releaseName: loki
        valuesObject:
          loki:
            auth_enabled: false
            commonConfig:
              replication_factor: 1
            schemaConfig:
              configs:
                - from: 2024-04-01
                  store: tsdb
                  object_store: s3
                  schema: v13
                  index:
                    prefix: loki_index_
                    period: 24h
            ingester:
              chunk_encoding: zstd
            tracing:
              enabled: false
            querier:
              max_concurrent: 2
            # 30-day log retention; enforced by the compactor below
            limits_config:
              retention_period: 720h
            compactor:
              working_directory: /var/loki/compactor
              retention_enabled: true
              retention_delete_delay: 2h
              retention_delete_worker_count: 150
              delete_request_store: s3
            storage:
              bucketNames:
                chunks: loki-chunks
                ruler: loki-ruler
              type: 's3'
              s3:
                endpoint: jd-s3-01.linds.com.au:9000
                s3ForcePathStyle: true
                insecure: true
                accessKeyId: ${accessKeyId}
                secretAccessKey: ${secretAccessKey}


          deploymentMode: SingleBinary
          singleBinary:
            replicas: 1
            # WAL/index live on JD-side iSCSI; keep the pod next to the volume.
            nodeSelector:
              datacenter: jd
            persistence:
              enabled: true
              enableStatefulSetAutoDeletePVC: false
              size: 20Gi
              storageClass: zfs-iscsi
              accessModes:
                - ReadWriteOnce
            resources:
              limits:
                cpu: 3
                memory: 4Gi
              requests:
                cpu: 2
                memory: 2Gi
            extraArgs:
              - -config.expand-env=true
            extraEnv:
              - name: accessKeyId
                valueFrom:
                  secretKeyRef:
                    name: loki-access-creds
                    key: accessKeyId
              - name: secretAccessKey
                valueFrom:
                  secretKeyRef:
                    name: loki-access-creds
                    key: secretAccessKey

          # Keep both memcached caches on the JD site next to loki-0 — the
          # chunks cache once landed on a linds worker and every chunk lookup
          # crossed the ~13ms/52Mbit IPsec link (slow dashboards).
          chunksCache:
            # default is 500MB, with limited memory keep this smaller
            writebackSizeLimit: 10MB
            # Chart default is 8GB of memcached (a ~9.8Gi request) — the very
            # reason this pod could only ever schedule on a remote linds
            # worker. 1GB is plenty at this ingest volume.
            allocatedMemory: 1024
            nodeSelector:
              datacenter: jd
          resultsCache:
            nodeSelector:
              datacenter: jd

          # Enable minio for storage
          minio:
            enabled: false

          # Not needed for SingleBinary
          gateway:
            enabled: false

          # Logs + metrics only. Keep dashboards; drop canary/selfMonitoring/rules.
          monitoring:
            serviceMonitor:
              enabled: true
              labels:
                release: monitoring-kube-prometheus-stack
              metricsInstance:
                enabled: false
            selfMonitoring:
              enabled: false
              grafanaAgent:
                installOperator: false
            lokiCanary:
              enabled: false
            rules:
              enabled: false
            # Loki's bundled ~10 operator-grade dashboards are overkill here;
            # its metrics stay scraped for alerting.
            dashboards:
              enabled: false

          # Zero out replica counts of other deployment modes
          backend:
            replicas: 0
          read:
            replicas: 0
          write:
            replicas: 0

          ingester:
            replicas: 0
          querier:
            replicas: 0
          queryFrontend:
            replicas: 0
          queryScheduler:
            replicas: 0
          distributor:
            replicas: 0
          compactor:
            replicas: 0
          indexGateway:
            replicas: 0
          bloomCompactor:
            replicas: 0
          bloomGateway:
            replicas: 0
          lokiCanary:
            enabled: false
          test:
            enabled: false


    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.12.1
      helm:
        releaseName: alloy-podlogs
        values: |
          controller:
            type: deployment
            replicas: 1
            # Same-site as Loki: syslog ingest (incl. the vyos suricata feed)
            # shouldn't detour via the linds site.
            nodeSelector:
              datacenter: jd

          service:
            enabled: true
            type: LoadBalancer
            # Preserve real syslog client source IP (no SNAT to cluster IP)
            externalTrafficPolicy: Local
            annotations:
              lbipam.cilium.io/ips: "172.16.1.23"

          # Metrics: let kube-prometheus scrape Alloy's own metrics
          serviceMonitor:
            enabled: true
            additionalLabels:
              release: monitoring-kube-prometheus-stack

          alloy:
            extraPorts:
              - name: "syslog-udp"
                port: 1514
                targetPort: 1514
                protocol: "UDP"
              - name: "syslog-tcp"
                port: 1515
                targetPort: 1515
                protocol: "TCP"
              - name: "syslog-udp-old"
                port: 514
                targetPort: 514
                protocol: "UDP"

            configMap:
              content: |
                // --- Kubernetes pod logs ---
                discovery.kubernetes "pods" {
                  role = "pod"
                }

                // Without this relabel every pod log stream carried only
                // job="loki.source.kubernetes.pods" and an instance label, so
                // Grafana saw one giant "service" and nothing could be
                // filtered by namespace or pod. The __meta_* labels are
                // dropped after relabelling, so these rules are what decides
                // the stream labels Loki keeps.
                discovery.relabel "pods" {
                  targets = discovery.kubernetes.pods.targets

                  rule {
                    source_labels = ["__meta_kubernetes_namespace"]
                    target_label  = "namespace"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_name"]
                    target_label  = "pod"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_container_name"]
                    target_label  = "container"
                  }
                  rule {
                    source_labels = ["__meta_kubernetes_pod_node_name"]
                    target_label  = "node"
                  }
                  // app: app.kubernetes.io/name, else the legacy app label,
                  // else the container name. The ";(.+)" rules only fire when
                  // the first source label is still empty.
                  rule {
                    source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                    target_label  = "app"
                  }
                  rule {
                    source_labels = ["app", "__meta_kubernetes_pod_label_app"]
                    separator     = ";"
                    regex         = ";(.+)"
                    replacement   = "$1"
                    target_label  = "app"
                  }
                  rule {
                    source_labels = ["app", "__meta_kubernetes_pod_container_name"]
                    separator     = ";"
                    regex         = ";(.+)"
                    replacement   = "$1"
                    target_label  = "app"
                  }
                  // What Grafana Logs Drilldown groups by.
                  rule {
                    source_labels = ["app"]
                    target_label  = "service_name"
                  }
                  rule {
                    source_labels = ["namespace", "app"]
                    separator     = "/"
                    target_label  = "job"
                  }
                }

                loki.source.kubernetes "pods" {
                  targets    = discovery.relabel.pods.output
                  forward_to = [loki.write.default.receiver]
                }

                // --- Syslog source with multiple listeners (per Alloy docs) ---
                loki.source.syslog "syslog" {
                  // Legacy devices on UDP/514 (strict RFC3164)
                  listener {
                    address  = "0.0.0.0:514"
                    protocol = "udp"
                    rfc3164_default_to_current_year = true
                    syslog_format   = "rfc3164"
                    label_structured_data = true
                    labels   = { job = "syslog", transport = "udp", port = "514" }
                  }

                  // General UDP/1514 (auto-detect RFC3164/RFC5424)
                  listener {
                    address  = "0.0.0.0:1514"
                    protocol = "udp"
                    syslog_format = "rfc5424"
                    use_rfc5424_message = true
                    label_structured_data = true
                    labels   = { job = "syslog", transport = "udp", port = "1514" }
                  }

                  // General TCP/1515 (strict RFC5424, message body only).
                  // Sole sender is jd-vyos-01 (suricata EVE JSON + system logs);
                  // keeping only the MSG part lets LogQL `| json` parse EVE events.
                  listener {
                    address  = "0.0.0.0:1515"
                    protocol = "tcp"
                    // Suricata EVE events with payloads run well past the
                    // 8 KiB default and were being dropped ("message length
                    // exceeds maximum length", ~300/day).
                    max_message_length = 65536
                    syslog_format = "rfc5424"
                    label_structured_data = true
                    labels   = { job = "syslog", transport = "tcp", port = "1515" }
                  }
                  relabel_rules = loki.relabel.syslog.rules
                  forward_to = [loki.write.default.receiver]
                }

                loki.relabel "syslog" {
                  rule {
                    action        = "replace"
                    source_labels = ["__syslog_connection_hostname"]
                    target_label  = "host"
                  }
                  rule {
                    action        = "replace"
                    source_labels = ["__syslog_connection_ip_address"]
                    target_label  = "sender_ip"
                  }
                  rule {
                    source_labels = ["__syslog_message_severity"]
                    target_label  = "severity"
                  }

                  rule { 
                    source_labels = ["__syslog_message_hostname"]
                    target_label  = "hostname"
                  }
                  rule {
                    source_labels = ["__syslog_message_app_name"]
                    target_label  = "appname"
                  }
                  rule {
                    source_labels = ["__syslog_message_proc_id"]
                    target_label  = "procid"
                  }
                  rule {
                    source_labels = ["__syslog_message_msg_id"]
                    target_label  = "msgid"
                  }

                  // --- Split into distinct Grafana services (rules are ordered;
                  // later matches override earlier ones):
                  //   suricata EVE events -> "suricata"
                  //   jd-vyos-01 system logs -> "vyos"
                  //   VM/appliance senders keep job="syslog" from the listener.
                  rule {
                    source_labels = ["__syslog_message_hostname"]
                    regex         = "jd-vyos-01"
                    target_label  = "job"
                    replacement   = "vyos"
                  }
                  rule {
                    source_labels = ["__syslog_message_hostname"]
                    regex         = "jd-vyos-01"
                    target_label  = "service_name"
                    replacement   = "vyos"
                  }
                  rule {
                    source_labels = ["__syslog_message_app_name"]
                    regex         = "suricata"
                    target_label  = "job"
                    replacement   = "suricata"
                  }
                  rule {
                    source_labels = ["__syslog_message_app_name"]
                    regex         = "suricata"
                    target_label  = "service_name"
                    replacement   = "suricata"
                  }
                  forward_to = [loki.write.default.receiver]
                }

                // --- Write to Loki ---
                loki.write "default" {
                  endpoint {
                    url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                  }
                }
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # SSA + server-side diff together: the chart's StatefulSet has
      # volumeClaimTemplates, whose API-defaulted apiVersion/kind/status
      # fields read as permanent drift under SSA with the classic diff.
      - ServerSideApply=true
      - ServerSideDiff=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
