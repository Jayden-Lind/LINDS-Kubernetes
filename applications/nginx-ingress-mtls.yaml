apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress-mtls
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-ingress-mtls
  sources:
    - chart: nginx-ingress
      repoURL: ghcr.io/nginx/charts
      targetRevision: 2.8.1
      helm:
        releaseName: nginx-ingress-mtls
        # CRDs are owned by the primary nginx-ingress Application; installing
        # them twice makes the two apps fight over the same cluster objects.
        skipCrds: true
        valuesObject:
          controller:
            kind: deployment
            # Two replicas per site, each on its own node. The Service is
            # externalTrafficPolicy Local, so only a node with a replica
            # announces 172.16.1.12, and each router prefers its own site's
            # nodes (a shorter AS path than the route from the other site).
            #
            # Public 443 comes in at JD, and only a JD replica can answer it:
            # a LINDS replica's reply leaves by LINDS's own default route, and
            # the LINDS router drops a private source address at its WAN. On
            # 2026-11-06 the 2.8.1 rollout put both replicas (there were two,
            # with no spread) on the linds workers: from 21:48 every public
            # connection timed out, until this change. So JD keeps two
            # replicas, one survives a node drain or reboot there, and a
            # rollout adds a new pod before it takes an old one away.
            #
            # The site spread is hard (DoNotSchedule). Tainted nodes (not
            # ready, cordoned) do not count, so with a site down every replica
            # runs at the other one; the kube-descheduler profile
            # ingress-site-spread moves them back when the site returns.
            # pod-template-hash: a rollout's new pods are spread among
            # themselves, not against the old ReplicaSet's.
            replicaCount: 4
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: datacenter
                whenUnsatisfiable: DoNotSchedule
                nodeTaintsPolicy: Honor
                matchLabelKeys: [pod-template-hash]
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nginx-ingress
                    app.kubernetes.io/instance: nginx-ingress-mtls
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: ScheduleAnyway
                matchLabelKeys: [pod-template-hash]
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nginx-ingress
                    app.kubernetes.io/instance: nginx-ingress-mtls
            # A node drain or the descheduler takes one replica at a time.
            podDisruptionBudget:
              enabled: true
              maxUnavailable: 1
            hostNetwork: false
            disableIPV6: true
            enableExternalDNS: false
            # Required for the ConfigMap server-snippets below.
            enableSnippets: true
            # Public cert of linds-ca, synced from Vault by external-secrets
            # (linds-ca-cert). The CA private key never enters this namespace.
            volumes:
              - name: linds-ca-cert
                secret:
                  secretName: linds-ca-cert
            volumeMounts:
              - name: linds-ca-cert
                mountPath: /etc/nginx/mtls
                readOnly: true
            service:
              create: true
              type: LoadBalancer
              externalTrafficPolicy: Local
              annotations:
                # Dedicated VIP for the mTLS-only endpoint.
                lbipam.cilium.io/ips: "172.16.1.12"
                # The router forwards WAN port 443 here
                # (docs/publish-a-service.md). The names come from the mirror
                # Ingresses, which external-dns-public publishes.
                public.linds.com.au/ports: "443/tcp"
              # mTLS-only endpoint: do not expose plain HTTP at all.
              httpPort:
                enable: false
            mgmt:
              resolver:
                ipv6: false
            enableLatencyMetrics: true
            # No product telemetry to F5. The network policy
            # (nginx-ingress-mtls/network-policy.yaml) gives this controller no
            # internet, so the daily report would only fail.
            telemetryReporting:
              enable: false
            ingressClass:
              name: nginx-mtls
              create: true
              setAsDefaultIngress: false
            config:
              entries:
                client-max-body-size: "0"
                # Long timeouts so Home Assistant websockets survive.
                proxy-read-timeout: "3600"
                proxy-send-timeout: "3600"
                # Stream large responses instead of spooling them to disk
                # (same as applications/nginx-ingress.yaml).
                proxy-max-temp-file-size: "0"
                # Send request bodies to the application while the client
                # uploads them, not from a temporary file on the node's disk
                # (same as applications/nginx-ingress.yaml).
                http-snippets: |
                  proxy_request_buffering off;
                http2: "true"
                keepalive: "32"
                server-tokens: "false"
                # The address in the status of every nginx-mtls Ingress. It is
                # the public name of this endpoint (jd.linds.com.au follows the
                # WAN address), so external-dns-public publishes each host as a
                # CNAME to it. The internal external-dns skips the mirrors.
                external-status-address: jd.linds.com.au
                hsts: "true"
                hsts-max-age: "31536000"
                # This is what makes the class mTLS-only: every server block
                # this controller generates demands a client certificate
                # signed by linds-ca (client certs live in pki.yaml). Requests
                # without a valid cert are rejected before reaching any app.
                server-snippets: |
                  ssl_client_certificate /etc/nginx/mtls/ca.crt;
                  ssl_verify_client on;
                  ssl_verify_depth 1;
                  # Drop connections without a valid client cert (444 closes
                  # the socket with no response) instead of serving a 400 page.
                  error_page 495 496 = @mtls_drop;
                  location @mtls_drop {
                    return 444;
                  }
          prometheus:
            create: true
            port: 9113
            service:
              create: true
            serviceMonitor:
              create: true
    - repoURL: "https://github.com/Jayden-Lind/LINDS-Kubernetes"
      targetRevision: HEAD
      path: nginx-ingress-mtls/
  ignoreDifferences:
    - kind: Service
      jqPathExpressions:
        - .spec.clusterIP
        - .spec.clusterIPs
        - .spec.ipFamilies
        - .spec.ipFamilyPolicy
        - .spec.internalTrafficPolicy
        - .spec.sessionAffinity
        - .spec.allocateLoadBalancerNodePorts
        - .spec.healthCheckNodePort
        # apiserver assigns nodePorts on LoadBalancer services and attributes
        # them to the SSA applier - permanent OutOfSync unless ignored.
        - .spec.ports[].nodePort
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
