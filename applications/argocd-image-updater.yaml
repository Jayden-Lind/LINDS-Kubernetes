apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-image-updater
      targetRevision: 1.3.0
      helm:
        values: |
          config:
            argocd:
              grpcWeb: true
              serverAddress: http://argocd-server
              insecure: true
              plaintext: true
            registries:
              - name: Docker Hub
                api_url: https://registry-1.docker.io
                prefix: docker.io
                default: true
          metrics:
            enabled: true
            serviceMonitor:
              enabled: false
          extraArgs:
            - --loglevel=info
            # Every 6h: the hourly tag scans were tripping Docker Hub's
            # anonymous rate limit (toomanyrequests, ~45/day) at 60m.
            - --interval=6h
    - repoURL: "https://github.com/Jayden-Lind/LINDS-Kubernetes"
      targetRevision: HEAD
      path: "image-updates"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
