apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plex-jd
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: plex-jd
  sources:
    - repoURL: https://raw.githubusercontent.com/plexinc/pms-docker/gh-pages
      chart: plex-media-server
      targetRevision: 1.9.0
      helm:
        values: |
          nameOverride: plex-jd
          ingress:
            enabled: true
            ingressClassName: nginx
            url: plex.linds.com.au
            tls:
              - hosts:
                - plex.linds.com.au
                secretName: plex.linds.com.au
            annotations:
              cert-manager.io/cluster-issuer: linds-ca
              # Stream media through instead of buffering (seeking / direct play)
              nginx.org/proxy-buffering: "false"
              # Plex uses websockets for live notifications (/:/websockets/...)
              nginx.org/websocket-services: "plex-jd"
          pms:
            # Plex's SQLite library DB belongs on block storage, not NFS.
            storageClassName: zfs-iscsi
            configStorage: 50Gi
          service:
            type: LoadBalancer
            # Local: Plex sees each client's own address. With Cluster, a
            # connection that reached another node was source-NATed to that
            # node's address (10.0.53.x), so Plex could not tell LAN from
            # internet: LAN clients missed allowedNetworks and
            # LanNetworksBandwidth, and Tautulli logged node addresses. It also
            # makes Cilium advertise the address only from Plex's node.
            externalTrafficPolicy: Local
            annotations:
              # The router forwards WAN port 32400 here
              # (docs/publish-a-service.md). No public name: clients find the
              # server through plex.tv.
              public.linds.com.au/ports: "32400/tcp"
          nodeSelector:
            datacenter: jd
          # Never on the control plane: transcodes and the scheduled analysis
          # tasks (loudness, markers, previews) use every vCPU, and on talos-cp
          # that starves etcd (see immich-machine-learning in immich/immich.yaml).
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          extraVolumeMounts:
            - name: nas
              mountPath: /data/media
            - name: holiday
              mountPath: /data/holiday
          extraVolumes:
            - name: holiday
              persistentVolumeClaim:
                claimName: holiday-videos-pvc
            - name: nas
              persistentVolumeClaim:
                claimName: jd-torrent-pvc
    - repoURL: "https://github.com/Jayden-Lind/LINDS-Kubernetes"
      targetRevision: HEAD
      path: plex-jd/
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
