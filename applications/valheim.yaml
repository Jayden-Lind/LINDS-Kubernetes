apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valheim
  namespace: argocd
  # No compare-options here any more: ServerSideDiff was only needed because
  # the old chart's StatefulSet carried volumeClaimTemplates that the API
  # server filled in with apiVersion/kind/volumeMode/status, which the classic
  # diff reported as permanent drift. valheim/ has no volumeClaimTemplates.
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: valheim
  # Single source since 2026-09-12: the max-pfeiffer Helm chart is gone, and
  # with it the whole reason this app needed a chart repo alongside git. The
  # chart baked one Valheim build into its image, so the server was only ever
  # as current as that image's publisher - see valheim/statefulset.yaml. The
  # replacement image updates the game itself from Steam, so there is nothing
  # left for a chart to parameterise.
  #
  # As a single spec.source this app is also out of the way of the
  # argocd-image-updater write-back collision described in applications/
  # root.yaml, which only bites multi-source apps.
  source:
    repoURL: "https://github.com/Jayden-Lind/LINDS-Kubernetes"
    targetRevision: HEAD
    path: valheim
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
