---
# App-of-apps: syncs every Application manifest directly in applications/
# (including itself and argocd). Adding a new app = committing a new file here.
# Subdirectories are NOT synced (recurse is off) - park apps you don't want
# deployed in applications/disabled/ and they are ignored.
# Pruning the root app only deletes the Application object, not the
# workloads it deployed (no finalizer is set on the child apps).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Jayden-Lind/LINDS-Kubernetes"
    targetRevision: HEAD
    path: "applications"
    # recurse defaults to false (subdirectories like disabled/ are ignored);
    # declaring it explicitly caused permanent OutOfSync because the API
    # normalizes the default away.
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  # argocd-image-updater (image-updates/) does NOT write to git: it writes the
  # digest it resolves into the live child Application - as
  # spec.sources[].helm.parameters for a helm app, spec.sources[].kustomize.images
  # for a kustomize one. spec.sources is an atomic list, so a server-side apply
  # of this repo's copy replaces the whole list and takes the override with it.
  # The updater rewrites it on its next pass, the child flip-flops between two
  # images, and every cycle costs a pod kill.
  # Verified 2026-09-12 on valheim: Application history alternating
  # params/no-params one second apart at 12:22, 18:22 and 00:22 UTC - the game
  # server was being deleted and recreated 4x a day while staying pinned to a
  # build the updater had already superseded. plex-jd showed the same pattern.
  #
  # Single-source apps never hit this: spec.source is an object, which
  # server-side apply merges field by field, so the parameters survive there
  # (home-assistant has held its digest since 2026-09-02).
  #
  # BOTH shapes need an expression here. The kustomize one was missing until
  # 2026-09-13 and immich was the only app in the gap - a kustomize app on
  # spec.sources - so it alone kept losing its digest while plex-jd and zabbix
  # held theirs. Its sync history recorded the override appearing and vanishing
  # in consecutive revisions (76 -> 77, 79 -> 80, 83 -> 84), one second apart
  # every time, so immich-server never left the floating v3 tag.
  #
  # Note the asymmetry: the helm expression ends at .parameters, the kustomize
  # one at .kustomize. Argo removes the matched path from the live object before
  # diffing, so what it leaves behind has to equal what git has. Every helm app
  # here declares .helm in git already (for values), so dropping .parameters
  # leaves a helm block that matches. No Application declares .kustomize in git
  # at all, so dropping only .images leaves an empty "kustomize: {}" - which
  # still differs from absent, and immich kept being synced back on that alone.
  # Verified 2026-09-13: with .kustomize.images the root sync applied immich
  # one second after every write; ending at .kustomize is what actually holds.
  #
  # Adding a real kustomize block to an Application under applications/ would
  # therefore be silently unsyncable - split it into its own app, or narrow
  # this back to the specific keys the updater writes.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - '.spec.sources[]? | select(.helm.parameters) | .helm.parameters'
        - '.spec.sources[]? | select(.kustomize) | .kustomize'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      # ignoreDifferences alone only stops self-heal from firing. This is what
      # keeps a real sync - one triggered by an actual change under
      # applications/ - from stripping the digest as well.
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
