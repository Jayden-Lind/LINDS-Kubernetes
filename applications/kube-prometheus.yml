apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.1.5
    helm:
      values: |
        # Rule groups built solely from the apiserver/etcd latency histogram
        # buckets we drop below (SLO burn rates etc.) - disable so they don't
        # evaluate against metrics that no longer exist.
        defaultRules:
          rules:
            kubeApiserverAvailability: false
            kubeApiserverBurnrate: false
            kubeApiserverHistogram: false
            kubeApiserverSlos: false
            windows: false
        grafana:
          # The ~26 mixin dashboards the chart ships by default are replaced by
          # the curated dotdc set under dashboards.kubernetes below.
          defaultDashboardsEnabled: false
          # Grafana self-metrics were 6.3k series nobody looked at.
          serviceMonitor:
            enabled: false
          dashboards:
            kubernetes:
              k8s-views-global:
                gnetId: 15757
                revision: 43
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
              k8s-views-namespaces:
                gnetId: 15758
                revision: 46
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
              k8s-views-nodes:
                gnetId: 15759
                revision: 40
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
              k8s-views-pods:
                gnetId: 15760
                revision: 39
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
            default:
              cilium-metrics:
                gnetId: 21431
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
              cilium-operator:
                gnetId: 16612
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
              cilium-hubble:
                gnetId: 16613
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
              cilium-policy-verdicts:
                gnetId: 18015
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
              cilium-flows:
                gnetId: 23862
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
            infrastructure:
              cert-manager:
                gnetId: 20842
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
              external-dns:
                gnetId: 15038
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
              external-secrets:
                gnetId: 21640
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
              vault:
                gnetId: 12904
                revision: 1
                datasource:
                  - name: DS_PROMETHEUS
                    value: prometheus
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
              - name: kubernetes
                orgId: 1
                folder: Kubernetes
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/kubernetes
              - name: cilium
                orgId: 1
                folder: Cilium
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
              - name: infrastructure
                orgId: 1
                folder: Infrastructure
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/infrastructure
          admin:
            existingSecret: grafana-credentials
          # Only Grafana's own client secret enters this pod - not the whole
          # keycloak-client-secrets entry, which would hand Grafana every
          # other app's secret.
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc
                key: client-secret
          # Grafana's back-channel token exchange runs from inside the pod,
          # which trusts only the public CA bundle - so the browser leg
          # succeeds (domain-joined clients trust linds-CA via AD) and the
          # token exchange then fails with "certificate signed by unknown
          # authority". Mount linds-CA and point the OAuth client at it.
          extraSecretMounts:
            - name: linds-ca
              secretName: linds-ca-cert
              mountPath: /etc/grafana/certs
              readOnly: true
              defaultMode: 0440
          grafana.ini:
            server:
              # Required, or OAuth redirects are built against the pod address.
              root_url: https://grafana.linds.com.au
            auth:
              # Break-glass: the local admin from grafana-credentials must stay
              # usable. Do NOT set disable_login_form - Keycloak is a new
              # single point of failure and Grafana keeps a local path.
              oauth_auto_login: false
              signout_redirect_url: https://grafana.linds.com.au/login
            auth.generic_oauth:
              enabled: true
              name: Keycloak
              icon: signin
              allow_sign_up: true
              client_id: grafana
              scopes: openid email profile groups
              email_attribute_path: email
              login_attribute_path: preferred_username
              name_attribute_path: name
              auth_url: https://keycloak.linds.com.au/realms/linds/protocol/openid-connect/auth
              token_url: https://keycloak.linds.com.au/realms/linds/protocol/openid-connect/token
              api_url: https://keycloak.linds.com.au/realms/linds/protocol/openid-connect/userinfo
              # Roles come from the flat `groups` claim the client scope emits
              # (bare names, no leading slash). The trailing 'Viewer' is the
              # fallback, so anyone in k8s-users without a Grafana-specific
              # group still gets read access.
              role_attribute_path: "contains(groups[*], 'k8s-admins') && 'Admin' || contains(groups[*], 'k8s-grafana-admins') && 'Admin' || contains(groups[*], 'k8s-grafana-editors') && 'Editor' || 'Viewer'"
              role_attribute_strict: false
              use_refresh_token: true
              # Scoped to this OAuth client only - deliberately NOT a global
              # trust change (SSL_CERT_FILE would replace Go's whole file
              # list) and NOT tls_skip_verify_insecure.
              tls_client_ca: /etc/grafana/certs/ca.crt
          nodeSelector:
            datacenter: jd
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          persistence:
            enabled: true
            size: 10Gi
            storageClassName: nfs-csi
          service:
            type: ClusterIP
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              jsonData:
                timeout: 60
                maxLines: 5000
          ingress:
            annotations:
              cert-manager.io/cluster-issuer: linds-ca
              # Grafana Live (dashboards, log tail) uses websockets
              nginx.org/websocket-services: "monitoring-kube-prometheus-stack-grafana"
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.linds.com.au
            tls:
              - secretName: grafana.linds.com.au
                hosts:
                  - grafana.linds.com.au
            path: /
        prometheus:
          ingress:
            enabled: false
          prometheusSpec:
            # Whichever hits first triggers deletion: 14 days OR 15GB
            retention: 14d
            retentionSize: "15GB"
            # 60s halves sample volume vs 30s; the chart propagates this to the
            # Grafana datasource timeInterval so $__rate_interval stays correct.
            scrapeInterval: 60s
            evaluationInterval: 60s
            # TSDB lives on JD-side iSCSI now; keep the pod next to it.
            nodeSelector:
              datacenter: jd
            resources:
              requests:
                cpu: 200m
                memory: 1536Mi
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorSelector: {}
            serviceMonitorNamespaceSelector: {}
            podMonitorSelectorNilUsesHelmValues: false
            podMonitorSelector: {}
            podMonitorNamespaceSelector: {}
            ruleSelectorNilUsesHelmValues: false
            ruleSelector: {}
            ruleNamespaceSelector: {}
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: zfs-iscsi
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 30Gi
        alertmanager:
          # Routes/receivers live in the AlertmanagerConfig CR
          # (base/monitoring/alertmanager-config.yaml). The chart's raw config
          # path cannot reference the Discord webhook from a secret - the
          # operator's parser has no webhook_url_file - and it silently fell
          # back to a null config (no alerts delivered at all).
          alertmanagerSpec:
            alertmanagerConfiguration:
              name: global-alertmanager-config
              global:
                resolveTimeout: 5m
            nodeSelector:
              datacenter: jd
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-csi
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 5Gi
        # Latency/size histogram buckets were ~25k of 156k head series and fed
        # only the (now disabled) apiserver SLO rules and mixin dashboards.
        # etcd_* client buckets arrive via the apiserver's own /metrics.
        kubeApiServer:
          serviceMonitor:
            metricRelabelings:
              - sourceLabels: [__name__]
                regex: (apiserver_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_list_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket|apiserver_watch_events_sizes_bucket|apiserver_storage_list_duration_seconds_bucket|etcd_request_duration_seconds_bucket)
                action: drop
        kubelet:
          serviceMonitor:
            # Kubelet operation-latency buckets; nothing dashboards on them.
            metricRelabelings:
              - sourceLabels: [__name__]
                regex: (kubelet_runtime_operations_duration_seconds_bucket|kubelet_http_requests_duration_seconds_bucket|kubelet_pod_worker_duration_seconds_bucket|kubelet_pod_start_duration_seconds_bucket|kubelet_pleg_relist_duration_seconds_bucket|storage_operation_duration_seconds_bucket|csi_operations_seconds_bucket)
                action: drop
            probesMetricRelabelings:
              - sourceLabels: [__name__]
                regex: prober_probe_duration_seconds_bucket
                action: drop
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          # kube-proxy is replaced by Cilium (kubeProxyReplacement) - scraping
          # it only produced a permanent KubeProxyDown false positive.
          enabled: false
        prometheusOperator:
          prometheusConfigReloader:
            # The default limit OOM-killed the reloader on 2026-07-13.
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

