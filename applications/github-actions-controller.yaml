apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gha-runner-scale-set-controller
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  source:
    chart: gha-runner-scale-set-controller
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    targetRevision: 0.15.1
    helm:
      releaseName: arc
      valuesObject:
        flags:
          # The chart default is debug, and the controller hands its level to
          # every runner set's listener. At debug/info each listener logs
          # five lines a minute even when no job is queued (~35k lines a
          # day for the four sets). warn keeps their warnings and errors;
          # job history is in GitHub Actions.
          logLevel: warn
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
