---
# In-cluster Claude Code web terminal (claude-code/), exposed only on the
# mTLS-only ingress class.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: claude-code
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Jayden-Lind/LINDS-Kubernetes"
    targetRevision: HEAD
    path: "claude-code"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: claude-code
  ignoreDifferences:
    # The API decorates each volumeClaimTemplates item with
    # apiVersion/kind/volumeMode/status that the manifest doesn't declare, and
    # the templates are an atomic list, so the whole list reads as changed.
    # Without this the StatefulSet is permanently OutOfSync and selfHeal
    # re-applies it every 5 minutes, firing ArgoCDAppOutOfSync forever.
    # Same workaround as applications/mumble.yaml.
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[].apiVersion
        - .spec.volumeClaimTemplates[].kind
        - .spec.volumeClaimTemplates[].spec.volumeMode
        - .spec.volumeClaimTemplates[].status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
