apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-ingress
  source:
    chart: nginx-ingress
    repoURL: ghcr.io/nginx/charts
    targetRevision: 2.9.1
    helm:
      releaseName: nginx-ingress
      valuesObject:
        controller:
          kind: daemonset
          hostNetwork: false
          disableIPV6: true
          enableExternalDNS: true
          service:
            create: true
            type: LoadBalancer
            externalTrafficPolicy: Local
          mgmt:
            resolver:
              ipv6: false
          enableLatencyMetrics: true
          # No product telemetry to F5, as on the nginx-mtls controller.
          telemetryReporting:
            enable: false
          ingressClass:
            name: nginx
            create: true
            setAsDefaultIngress: true
          config:
            entries:
              client-max-body-size: "0"
              proxy-read-timeout: "3600"
              proxy-send-timeout: "3600"
              # Do not spool large upstream responses to a temporary file on
              # the node's disk (Grafana's JS bundles logged "an upstream
              # response is buffered to a temporary file" a few times a day).
              # Large responses then stream through the proxy buffers.
              proxy-max-temp-file-size: "0"
              # Send a request body to the application while the client
              # uploads it. By default nginx first writes the whole body to a
              # temporary file on the node's disk, then sends it: a large
              # upload (a phone video to Immich) is written twice and the
              # application sees nothing until the client has finished. The
              # ConfigMap has no key for this directive, so it is a snippet
              # in the http block (ConfigMap snippets do not need
              # enableSnippets).
              http-snippets: |
                proxy_request_buffering off;
              # Enable HTTP/2 for all TLS servers on this controller.
              # This controller defaults http2 to false; there is no per-Ingress
              # toggle, so it must be set here on the ConfigMap.
              http2: "true"
              # Reuse upstream connections (off by default) - throughput win for
              # the chatty UIs (arr, grafana) and APIs.
              keepalive: "32"
              # Force HTTPS on every host. Safe because linds-ca is a private CA
              # issuer (no HTTP-01 challenge on :80 to break).
              redirect-to-https: "true"
              # Stop advertising the nginx version.
              server-tokens: "false"
              # HSTS on all TLS hosts. Sticky in browsers - only because every
              # *.linds.com.au host is (and stays) HTTPS.
              hsts: "true"
              hsts-max-age: "31536000"
              # The access log: one JSON object for each request. The Ingress
              # traffic dashboard reads it (monitoring-ingress/README.md lists
              # the fields). The path has no query string, because query
              # strings can hold OAuth codes and tokens. The controller's main
              # template defines $request_uri_no_args. Keep the same fields in
              # nginx-ingress-mtls.yaml.
              log-format-escaping: json
              log-format: |
                {"t":"$time_iso8601","ip":"$remote_addr","xff":"$http_x_forwarded_for",
                "host":"$host","sn":"$server_name","m":"$request_method","path":"$request_uri_no_args","proto":"$server_protocol",
                "s":"$status","bytes":"$body_bytes_sent","rt":"$request_time",
                "up":"$upstream_addr","ups":"$upstream_status","urt":"$upstream_response_time","uht":"$upstream_header_time",
                "ing":"$resource_namespace/$resource_name","svc":"$service",
                "tls":"$ssl_protocol","cipher":"$ssl_cipher","ua":"$http_user_agent","origin":"$http_origin"}
        prometheus:
          create: true
          port: 9113
          service:
            create: true
          serviceMonitor:
            create: true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion
    - kind: Service
      jqPathExpressions:
        - .spec.clusterIP
        - .spec.clusterIPs
        - .spec.ipFamilies
        - .spec.ipFamilyPolicy
        - .spec.internalTrafficPolicy
        - .spec.sessionAffinity
        - .spec.allocateLoadBalancerNodePorts
        - .spec.healthCheckNodePort
        # apiserver assigns nodePorts on LoadBalancer services and attributes
        # them to the SSA applier - permanent OutOfSync unless ignored.
        - .spec.ports[].nodePort
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
