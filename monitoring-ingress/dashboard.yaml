              "expr": "(sum by (namespace) (count_over_time({namespace=~\"$controller\", container=\"nginx-ingress\"} |= \"{\\\"t\\\":\" !~ `$probes` | json sn=\"sn\", ip=\"ip\", s=\"s\" | sn=~\"$site\" | ip=~\"$client\" | label_format src=`{{ if eq (regexReplaceAll \"^(10|127)[.].*|^192[.]168[.].*|^172[.](1[6-9]|2[0-9]|3[01])[.].*\" .ip \"\") \"\" }}internal{{ else }}public{{ end }}` | src=~\"$source\" | s=~\"5..\" [$__range])) or sum by (namespace) (count_over_time({namespace=~\"$controller\", container=\"nginx-ingress\"} |= \"{\\\"t\\\":\" !~ `$probes` | json sn=\"sn\", ip=\"ip\" | sn=~\"$site\" | ip=~\"$client\" | label_format src=`{{ if eq (regexReplaceAll \"^(10|127)[.].*|^192[.]168[.].*|^172[.](1[6-9]|2[0-9]|3[01])[.].*\" .ip \"\") \"\" }}internal{{ else }}public{{ end }}` | src=~\"$source\" [$__range])) * 0) / sum by (namespace) (count_over_time({namespace=~\"$controller\", container=\"nginx-ingress\"} |= \"{\\\"t\\\":\" !~ `$probes` | json sn=\"sn\", ip=\"ip\" | sn=~\"$site\" | ip=~\"$client\" | label_format src=`{{ if eq (regexReplaceAll \"^(10|127)[.].*|^192[.]168[.].*|^172[.](1[6-9]|2[0-9]|3[01])[.].*\" .ip \"\") \"\" }}internal{{ else }}public{{ end }}` | src=~\"$source\" [$__range]))",
