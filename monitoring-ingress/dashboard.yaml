---
# Grafana dashboard "Ingress traffic" (uid ingress-traffic, folder Network):
# requests through the nginx and nginx-mtls controllers, by site, client,
# status and latency, and the client-certificate gate of nginx-mtls. Picked
# up by the Grafana dashboard sidecar (label grafana_dashboard).
#
# GENERATED by dashboard.py. Edit that file and run it again:
#   python3 monitoring-ingress/dashboard.py > monitoring-ingress/dashboard.yaml
#
# The data: the JSON access logs of both controllers in Loki (README.md lists
# the fields), parsed at query time with | json; the last row reads the
# controllers' Prometheus metrics.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-traffic-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Network
data:
  ingress-traffic.json: |
    {
      "uid": "ingress-traffic",
      "title": "Ingress traffic",
      "description": "Requests through the two ingress controllers: nginx (LAN, VPN, pods) and nginx-mtls (the internet endpoint, client certificate required). Read from their JSON access logs in Loki; the last row from their Prometheus metrics. See monitoring-ingress/README.md.",
      "tags": [
        "ingress",
        "nginx",
        "network",
        "security",
        "logs"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "annotations": {
        "list": []
      },
      "links": [
        {
          "title": "Overview",
          "type": "link",
          "url": "/d/overview",
          "icon": "dashboard"
        },
        {
          "title": "Availability",
          "type": "link",
          "url": "/d/availability",
          "icon": "dashboard"
        },
        {
          "title": "Security overview",
          "type": "link",
          "url": "/d/security-overview",
          "icon": "dashboard"
        },
        {
          "title": "Security access",
          "type": "link",
          "url": "/d/security-access",
          "icon": "dashboard"
        },
        {
          "title": "Suricata",
          "type": "link",
          "url": "/d/suricata",
          "icon": "dashboard"
        },
        {
          "title": "Router",
          "type": "link",
          "url": "/d/router",
          "icon": "dashboard"
        },
        {
          "title": "Logs / Kubernetes",
          "type": "link",
          "url": "/d/logs-kubernetes",
          "icon": "dashboard"
        }
      ],
      "templating": {
        "list": [
          {
            "name": "controller",
            "label": "Controller",
            "type": "custom",
            "description": "nginx serves the LAN, the VPN and the pods. nginx-mtls is the internet endpoint: the router forwards port 443 to it, and it requires a client certificate.",
            "query": "nginx (internal) : nginx-ingress,nginx-mtls (internet) : nginx-ingress-mtls",
            "multi": true,
            "includeAll": true,
            "allValue": "nginx-ingress|nginx-ingress-mtls",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "site",
            "label": "Site",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "description": "The host of an Ingress. All also includes \"_\", the default server.",
            "query": {
              "qryType": 1,
              "query": "label_values(kube_ingress_path, host)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(kube_ingress_path, host)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "source",
            "label": "Source",
            "type": "custom",
            "description": "Internal: a private address (LAN, VPN, pods). Internet: any other address.",
            "query": "internet : public,internal : internal",
            "multi": false,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "probes",
            "label": "Probes",
            "type": "custom",
            "description": "The availability probes (blackbox exporter) ask every site's health URL each minute, from both sites. Hidden: their requests are left out of every panel except the tripwire.",
            "query": "hidden : Blackbox Exporter/,shown : ^$",
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "hidden",
              "value": "Blackbox Exporter/"
            },
            "options": []
          },
          {
            "name": "client",
            "label": "Client",
            "description": "Client address, as a regular expression. Example: 192[.]168[.]1[.]20 for one device, 192[.]168[.]1[.].* for a network.",
            "type": "textbox",
            "query": ".*",
            "current": {
              "text": ".*",
              "value": ".*"
            },
            "options": []
          },
          {
            "name": "status",
            "label": "Status",
            "description": "For \"Recent requests\": the status, as a regular expression. Example: 5.. or 401|403",
            "type": "textbox",
            "query": ".*",
            "current": {
              "text": ".*",
              "value": ".*"
            },
            "options": []
          },
          {
            "name": "path",
            "label": "Path contains",
            "description": "For \"Recent requests\": text in the path.",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "options": []
          }
        ]
      },
