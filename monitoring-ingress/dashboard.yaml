              "expr": "sum by (namespace) (rate({namespace=~\"$controller\", container=\"nginx-ingress\"} |= \"{\\\"t\\\":\" !~ `$probes` | json sn=\"sn\", ip=\"ip\" | sn=~\"$site\" | ip=~\"$client\" | label_format src=`{{ if eq (regexReplaceAll \"^(10|127)[.].*|^192[.]168[.].*|^172[.](1[6-9]|2[0-9]|3[01])[.].*\" .ip \"\") \"\" }}internal{{ else }}public{{ end }}` | src=~\"$source\" [$__range]))",
