apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: linds-ca-keypair
spec:
  externalSecretName: linds-ca-keypair
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: cert-manager
  refreshTime: 1h
  externalSecretSpec:
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    refreshPolicy: OnChange
    target:
      name: linds-ca-keypair
      creationPolicy: Orphan
      deletionPolicy: Retain
    dataFrom:
      - extract:
          key: linds-keyvault/linds-ca-keypair
          # As above: Vault holds base64 PEM, cert-manager needs raw PEM or the
          # linds-ca ClusterIssuer fails with "no valid certificates found".
          decodingStrategy: Base64
---
# Public cert of linds-ca for the mTLS-only ingress controller, which mounts
# it to verify client certificates (applications/nginx-ingress-mtls.yaml).
# Only tls.crt is synced; the CA private key stays out of this namespace.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: linds-ca-cert
spec:
  externalSecretName: linds-ca-cert
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: nginx-ingress-mtls
    # Keycloak validates the domain controllers' LDAPS certificates against
    # this same CA - linds-CA issued both the cluster certs and the DC certs,
    # so no separate trust material is needed (keycloak/keycloak.yaml).
    - matchLabels:
        kubernetes.io/metadata.name: keycloak
    # Any OIDC client needs this too. Browsers trust linds-CA via AD, but the
    # back-channel token exchange runs from inside the pod, which has only the
    # public CA bundle - without this it fails with
    # "x509: certificate signed by unknown authority".
    - matchLabels:
        kubernetes.io/metadata.name: monitoring
    # Immich reads it via NODE_EXTRA_CA_CERTS.
    - matchLabels:
        kubernetes.io/metadata.name: immich
    # Zabbix's SAML frontend fetches IdP metadata over HTTPS.
    - matchLabels:
        kubernetes.io/metadata.name: zabbix
  refreshTime: 1h
  externalSecretSpec:
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    refreshPolicy: OnChange
    target:
      name: linds-ca-cert
      creationPolicy: Orphan
      deletionPolicy: Retain
    data:
      - secretKey: ca.crt
        remoteRef:
          key: linds-keyvault/linds-ca-keypair
          property: tls.crt
          # The value in Vault is base64-encoded PEM; nginx needs raw PEM.
          decodingStrategy: Base64
---
