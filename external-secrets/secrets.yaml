apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: argocd-admin
spec:
  externalSecretName: argocd-secret
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: argocd
  refreshTime: 1h
  externalSecretSpec:
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    refreshPolicy: OnChange
    target:
      name: argocd-secret
      creationPolicy: Merge
      deletionPolicy: Retain
    data:
      - secretKey: admin.password
        remoteRef:
          key: linds-keyvault/argocd-secret
          property: admin.password
      - secretKey: admin.passwordMtime
        remoteRef:
          key: linds-keyvault/argocd-secret
          property: admin.passwordMtime
      # Referenced as $oidc.keycloak.clientSecret from argocd-cm's oidc.config
      # (bootstrap/kustomization.yaml). This rides on the existing Merge
      # secret deliberately: a second Orphan ExternalSecret targeting
      # argocd-secret would prune runtime keys such as server.secretkey.
      - secretKey: oidc.keycloak.clientSecret
        remoteRef:
          key: linds-keyvault/keycloak-client-secrets
          property: argocd
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: linds-certificate-secret
spec:
  externalSecretName: linds-certificate-secret
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: default
    - matchLabels:
        kubernetes.io/metadata.name: nginx-ingress
    - matchLabels:
        kubernetes.io/metadata.name: argocd
  refreshTime: 1h
  externalSecretSpec:
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    refreshPolicy: OnChange
    target:
      name: linds-certificate-secret
      creationPolicy: Orphan
      deletionPolicy: Retain
    dataFrom:
      - extract:
          key: linds-keyvault/linds-certificate-secret
          # tls.crt/tls.key are stored base64-encoded in Vault; without this
          # ESO writes them base64 again and consumers see garbage, not PEM.
          decodingStrategy: Base64
---
