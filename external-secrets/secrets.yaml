# Everything the in-cluster Claude Code terminal needs. `extract` pulls the
# whole Vault entry, and the StatefulSet consumes it with envFrom, so adding a
# new credential is a Vault write with no change to this repo. Keys the pod
# understands are documented in claude-code/README.md.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: claude-code-secret
spec:
  externalSecretName: claude-code-secret
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: claude-code
  refreshTime: 1h
  externalSecretSpec:
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    refreshPolicy: OnChange
    target:
      name: claude-code-secret
      creationPolicy: Orphan
      deletionPolicy: Retain
    dataFrom:
      - extract:
          key: linds-keyvault/claude-code-secret---
# CNPG role password for the keycloak database. Needed in postgresql-linds so
# the Cluster's managed role can consume it, and in keycloak so the server can
# authenticate with it.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: keycloak-auth
spec:
  externalSecretName: keycloak-auth
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: postgresql-linds
    - matchLabels:
        kubernetes.io/metadata.name: keycloak
  refreshTime: 1h
  externalSecretSpec:
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    refreshPolicy: OnChange
    target:
      name: keycloak-auth
      creationPolicy: Orphan
      deletionPolicy: Retain
    dataFrom:
      - extract:
          key: linds-keyvault/keycloak-auth
---
# Break-glass admin for the master realm, which is never federated to AD. Also
# the account keycloak-config-cli authenticates as, so reconciling the realm
# needs no second identity.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: keycloak-bootstrap-admin
spec:
  externalSecretName: keycloak-bootstrap-admin
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: keycloak
  refreshTime: 1h
  externalSecretSpec:
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    refreshPolicy: OnChange
    target:
      name: keycloak-bootstrap-admin
      creationPolicy: Orphan
      deletionPolicy: Retain
    dataFrom:
      - extract:
          key: linds-keyvault/keycloak-bootstrap-admin
---
# AD bind account for the LDAP user federation provider (read-only rights).
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: keycloak-ldap
spec:
  externalSecretName: keycloak-ldap
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: keycloak
  refreshTime: 1h
  externalSecretSpec:
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    refreshPolicy: OnChange
    target:
      name: keycloak-ldap
      creationPolicy: Orphan
      deletionPolicy: Retain
    dataFrom:
      - extract:
          key: linds-keyvault/keycloak-ldap
---
# Every OIDC client secret, extracted whole because keycloak-config-cli needs
# all of them to reconcile the realm. Application namespaces get ONLY their own
# key (see grafana-oidc below) so no app can read another app's secret.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: keycloak-client-secrets
spec:
  externalSecretName: keycloak-client-secrets
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: keycloak
  refreshTime: 1h
  externalSecretSpec:
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    refreshPolicy: OnChange
    target:
      name: keycloak-client-secrets
      creationPolicy: Orphan
      deletionPolicy: Retain
    dataFrom:
      - extract:
          key: linds-keyvault/keycloak-client-secrets
---
# Grafana gets only its own client secret, not the whole set.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: grafana-oidc
spec:
  externalSecretName: grafana-oidc
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: monitoring
  refreshTime: 1h
