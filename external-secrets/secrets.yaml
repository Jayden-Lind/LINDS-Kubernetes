      creationPolicy: Orphan
      deletionPolicy: Retain
    data:
      - secretKey: client-secret
        remoteRef:
          key: linds-keyvault/keycloak-client-secrets
          property: grafana
---
# Immich gets only its own client secret, not the whole set.
apiVersion: external-secrets.io/v1
