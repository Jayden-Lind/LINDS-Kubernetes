  - coredns.yml
  - argocd-servicemonitor.yaml
  - monitoring/alerts.yaml
  - monitoring/alertmanager-config.yaml
  - monitoring/external-secret.yaml
  - monitoring/pushgateway.yaml
  - monitoring/proxmox-storage-health.yaml
  - monitoring/router-metrics.yaml
  - monitoring/router-dashboard.yaml
  - monitoring/suricata-dashboard.yaml
  - monitoring/network-devices-dashboard.yaml
  - monitoring/logs-kubernetes-dashboard.yaml
  - monitoring/logs-syslog-dashboard.yaml

  - nginx/pdf.yml
