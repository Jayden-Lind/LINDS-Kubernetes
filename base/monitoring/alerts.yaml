apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: linds-kubernetes-alerts
  namespace: monitoring
  labels:
    release: monitoring-kube-prometheus-stack
spec:
  groups:
    # These rules and the ones kube-prometheus-stack ships do not repeat each
    # other. Until 2026-10-04 many did, so a node reboot or a sealed Vault
    # arrived as pairs of notifications. For each pair one side was kept:
    #
    # - The chart's rule, where it is the better one. Crash loops, pods not
    #   ready and Deployments, StatefulSets and DaemonSets short of replicas
    #   are KubePodCrashLooping, KubePodNotReady, Kube*ReplicasMismatch and
    #   KubeDaemonSetRolloutStuck, and a failed Alertmanager reload is
    #   AlertmanagerFailedReload. The copies that were here fired after 5
    #   minutes instead of 15 and did not wait out a rollout, so what they
    #   added was mostly controllers restarting after an API server blip. The
    #   two for pods also left out kube-system, and the one for Deployments
    #   read a metric that does not exist and never fired.
    # - The rule here, where it says more or says it sooner: nodes, volumes and
    #   scrape targets, below. The chart's version of each is switched off in
    #   applications/kube-prometheus.yml (defaultRules.disabled), which lists
    #   them against the rule here that stands in.
    # - Node pressure is the exception. Both stay on, and Alertmanager holds
    #   the chart's KubeNodePressure back (alertmanager-config.yaml).
    #
    # Before adding a generic rule, check the chart does not already have it:
    # kubectl get prometheusrules -n monitoring
    - name: kubernetes.nodes
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is not ready"
            description: "Node {{ $labels.node }} has been in a non-ready state for more than 2 minutes."

        - alert: NodeMemoryHigh
          expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on {{ $labels.instance }}"
            description: "Node {{ $labels.instance }} has less than 10% memory available."

        - alert: NodeMemoryCritical
          expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Critical memory on {{ $labels.instance }}"
            description: "Node {{ $labels.instance }} has less than 5% memory available."

        - alert: NodeDiskAlmostFull
          expr: >
            (
              node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/boot.*"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/boot.*"}
            ) < 0.10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Disk almost full on {{ $labels.instance }}"
            description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 10% free."

        - alert: NodeDiskFull
          expr: >
            (
              node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/boot.*"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/boot.*"}
            ) < 0.03
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Disk critically full on {{ $labels.instance }}"
            description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has less than 3% free."

        - alert: NodeCPUHighLoad
          expr: >
            (1 - avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "High CPU on {{ $labels.instance }}"
            description: "Node {{ $labels.instance }} CPU utilisation is above 90% sustained for 15 minutes."

        - alert: NodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} disk pressure"
            description: "Node {{ $labels.node }} has DiskPressure condition active — kubelet may begin evicting pods."

        - alert: NodeMemoryPressure
          expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} memory pressure"
            description: "Node {{ $labels.node }} has MemoryPressure condition active — kubelet may begin evicting pods."

    - name: kubernetes.pods
      rules:
        - alert: PodOOMKilled
          expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} OOM killed"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} ({{ $labels.namespace }}) was killed due to out of memory."

        - alert: PodImagePullError
          expr: >
            max_over_time(kube_pod_container_status_waiting_reason{
              reason=~"ImagePullBackOff|ErrImagePull"
            }[10m]) >= 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} image pull error"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} ({{ $labels.namespace }}) cannot pull image: {{ $labels.reason }}."

    - name: kubernetes.storage
      rules:
        - alert: PVCNotBound
          expr: kube_persistentvolumeclaim_status_phase{phase!="Bound"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} not bound"
            description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} is in {{ $labels.phase }} state."

        - alert: PVCAlmostFull
          expr: >
            kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} almost full"
            description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} has less than 15% free space remaining."

        - alert: PVCFull
          expr: >
            kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} critically full"
            description: "PVC {{ $labels.persistentvolumeclaim }} in {{ $labels.namespace }} has less than 5% free space — imminent write failures."

    - name: argocd
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status!="Synced"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} out of sync"
            description: "ArgoCD application {{ $labels.name }} (project: {{ $labels.project }}) has sync status: {{ $labels.sync_status }}."

        - alert: ArgoCDAppUnhealthy
          # Missing or Unknown. Degraded is left to ArgoCDAppDegraded below:
          # this used to match it too, so every degraded app arrived twice,
          # once at each severity.
          expr: argocd_app_info{health_status!~"Healthy|Progressing|Suspended|Degraded"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} unhealthy"
            description: "ArgoCD application {{ $labels.name }} has health status: {{ $labels.health_status }}."

        - alert: ArgoCDAppDegraded
          # Not the catcrawl app. ArgoCD calls a CronJob degraded from the
          # moment a run fails until the next one succeeds, and catcrawl's run
          # weekly: the Coles crawl that failed on 2026-09-30 held this at
          # critical, repeating every four hours, for as long as nothing else
          # was holding it back. It said nothing the crawl alerts had not: each
          # crawler, the vacuum and the viewer have alerts of their own, which
          # name the one that is failing and stop when there is nothing new.
          expr: argocd_app_info{health_status="Degraded", name!="catcrawl"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is degraded"
            description: "ArgoCD application {{ $labels.name }} is in Degraded health state."

        - alert: ArgoCDSyncError
          expr: argocd_app_info{operation_phase="Error"} == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "ArgoCD app {{ $labels.name }} sync error"
            description: "ArgoCD application {{ $labels.name }} sync operation is in Error phase."

    - name: certificates
      rules:
        - alert: CertificateExpiringSoon
          expr: >
            certmanager_certificate_expiration_timestamp_seconds - time() < (14 * 24 * 3600)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expiring in < 14 days"
            description: "Certificate {{ $labels.name }} in {{ $labels.namespace }} expires in {{ $value | humanizeDuration }}."

        - alert: CertificateExpiringCritical
          expr: >
            certmanager_certificate_expiration_timestamp_seconds - time() < (7 * 24 * 3600)
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expiring in < 7 days"
            description: "Certificate {{ $labels.name }} in {{ $labels.namespace }} expires in {{ $value | humanizeDuration }}."

        - alert: CertificateNotReady
          expr: >
            max by(name, namespace) (certmanager_certificate_ready_status{condition="False"}) == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} not ready"
            description: "Certificate {{ $labels.name }} in {{ $labels.namespace }} is not in a ready state."

    - name: postgresql
      rules:
        - alert: PostgreSQLDown
          expr: cnpg_pg_up == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL {{ $labels.cluster }} is down"
            description: "CloudNativePG cluster {{ $labels.cluster }} instance {{ $labels.pod }} is not responding to connections."

        - alert: PostgreSQLHighConnections
          expr: >
            cnpg_backends_total
            / on(cluster, namespace) group_left()
            cnpg_pg_settings_value{name="max_connections"} > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL {{ $labels.cluster }} connection usage high"
            description: "PostgreSQL cluster {{ $labels.cluster }} is using more than 80% of available connections."

        - alert: PostgreSQLReplicationLag
          expr: cnpg_pg_stat_replication_pg_wal_lsn_diff > 52428800
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL {{ $labels.cluster }} replication lag"
            description: "PostgreSQL cluster {{ $labels.cluster }} has replication lag exceeding 50MB — standby is falling behind."

        - alert: PostgreSQLWALArchivingFailing
          expr: cnpg_pg_stat_archiver_last_failed_time > cnpg_pg_stat_archiver_last_archived_time
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL {{ $labels.cluster }} WAL archiving is failing"
            description: "WAL archiving to the backup object store has been failing for 15 minutes on {{ $labels.pod }}. PITR recovery window is not growing and pg_wal may fill up."

        - alert: PostgreSQLWALArchivingStale
          expr: cnpg_pg_stat_archiver_seconds_since_last_archival > 129600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL {{ $labels.cluster }} has not archived WAL in 36h"
            description: "No WAL segment has been archived for over 36 hours on {{ $labels.pod }}. The nightly base backup forces a segment switch, so this indicates backups or archiving have silently stopped."

        # A failed nightly base backup.
        #
        # The obvious rule — the last failure newer than the last success — cannot
        # work here. Backups go through the barman-cloud plugin (method: plugin),
        # and with it CloudNativePG never records a successful backup:
        # cnpg_collector_last_available_backup_timestamp and
        # cnpg_collector_first_recoverability_point both read 0, so any comparison
        # against them would fire forever. The failure timestamp is kept, and it
        # still holds the failure of 2026-09-06, which went unnoticed because WAL
        # kept archiving and neither archiving rule above had anything to say.
        # So this fires while that timestamp is less than a day old.
        #
        # Its age, not whether it moved. Until 2026-10-04 this was
        # changes(...[1d]) > 0, which fired on every switchover and never on a
        # failed backup: only the primary reports the timestamp and a replica
        # reports 0, so two pods trading roles is two series changing value.
        # That was 2026-09-24, 09-30 and 10-02, for a day each. max by () reads
        # the primary's value whichever pod that is.
        - alert: PostgreSQLBaseBackupFailed
          expr: time() - max by (namespace, job) (cnpg_collector_last_failed_backup_timestamp) < 86400
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL {{ $labels.job }} base backup failed"
            description: "A base backup of {{ $labels.job }} failed in the last day. WAL archiving is separate and may still be healthy, in which case the previous base backup plus WAL still recovers to now — but retention is 7 days, so each failed night shortens the window a restore can reach back to. Check `kubectl get backups -n {{ $labels.namespace }}` for the failed Backup and its error."

    - name: nginx
      rules:
        # NOTE: this cluster runs the NGINX Inc controller (ghcr.io/nginx),
        # whose metrics differ from kubernetes/ingress-nginx. Per-request
        # status codes and latency come from the latency-metrics collector
        # (enableLatencyMetrics: true), labelled by resource_name/namespace.
        - alert: NginxHighErrorRate
          expr: >
            (
              sum by(resource_name, resource_namespace) (rate(nginx_ingress_controller_upstream_server_response_latency_ms_count{code=~"5.."}[5m]))
              / sum by(resource_name, resource_namespace) (rate(nginx_ingress_controller_upstream_server_response_latency_ms_count{code=~"[0-9].."}[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "NGINX {{ $labels.resource_namespace }}/{{ $labels.resource_name }} high 5xx rate"
            description: "NGINX ingress {{ $labels.resource_name }} in {{ $labels.resource_namespace }} has a {{ $value | humanizePercentage }} 5xx error rate."

        - alert: NginxConfigReloadError
          expr: nginx_ingress_controller_nginx_last_reload_status == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NGINX Ingress Controller config reload failed"
            description: "NGINX Ingress Controller failed to reload its configuration ({{ $labels.pod }})."

        # NOTE: no P99 upstream-latency alert here on purpose. The latency
        # collector measures upstream response time, so long-lived connections
        # (Home Assistant websockets/SSE, etc.) sit in the top histogram bucket
        # and keep P99 pinned above any useful threshold. 5xx rate and reload
        # status are the signals that actually indicate a problem.

    - name: external-secrets
      rules:
        - alert: ExternalSecretSyncError
          expr: >
            externalsecret_status_condition{type="Ready",status="False"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} sync failed"
            description: "ExternalSecret {{ $labels.name }} in {{ $labels.namespace }} is failing to sync from Vault."

    - name: monitoring
      rules:
        - alert: PrometheusTargetDown
          expr: up == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus target {{ $labels.job }}/{{ $labels.instance }} down"
            description: "Prometheus target {{ $labels.instance }} for job {{ $labels.job }} has been unreachable for 5 minutes."

        - alert: LokiNotIngesting
          expr: sum(rate(loki_ingester_streams_created_total[5m])) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Loki not ingesting log streams"
            description: "Loki has not ingested any new log streams for 10 minutes."

        - alert: PrometheusRuleEvaluationSlow
          expr: prometheus_rule_evaluation_duration_seconds{quantile="0.9"} > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus rule evaluation slow"
            description: "Prometheus rule group {{ $labels.rule_group }} evaluation is taking {{ $value | humanizeDuration }} at P90."

    # catcrawl is a weekly CronJob (0 2 * * 3). It reports its own outcome to the
    # Pushgateway; the alerts that answer "did it run at all" come from
    # kube-state-metrics instead, because a job that panics, is OOM-killed or
    # never starts pushes nothing and cannot report on itself.
    - name: catcrawl
      rules:
        - alert: CatcrawlJobFailed
          # kube_job_failed is a condition metric: it emits one series per
          # condition state (true/false/unknown). Matching condition="true"
          # explicitly states the intent — a bare "> 0" happens to work only
          # because the false/unknown series carry the value 0.
          expr: kube_job_failed{namespace="default", job_name=~"catcrawl-scheduler-.*", condition="true"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "catcrawl job {{ $labels.job_name }} failed"
            description: "The catcrawl CronJob failed. Check `kubectl logs -n default job/{{ $labels.job_name }}` — likely causes are the database being unreachable, the Woolworths API rejecting auth, or a failed migration."

        - alert: CatcrawlNotScheduled
          # The CronJob runs weekly; 8 days means a schedule was missed entirely.
          expr: time() - kube_cronjob_status_last_schedule_time{namespace="default", cronjob="catcrawl-scheduler"} > 691200
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "catcrawl has not been scheduled for over 8 days"
            description: "The catcrawl CronJob last scheduled {{ $value | humanizeDuration }} ago. It may be suspended, or the image may not be pullable."

        - alert: CatcrawlNoRecentSuccess
          # Distinct from the above: the job may be running every week and
          # failing every time, which leaves last_schedule_time healthy.
          expr: time() - catcrawl_last_success_timestamp_seconds{job="catcrawl"} > 691200
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "catcrawl has not completed successfully for over 8 days (store {{ $labels.store }})"
            description: "Last successful crawl was {{ $value | humanizeDuration }} ago. The job may be running and failing each time."

        - alert: CatcrawlNoRecentSuccess
          # The same alert, from the other side. catcrawl_last_success_timestamp_seconds is pushed
          # only by a run that succeeds, so when the Pushgateway has lost it --
          # as it did on 2026-10-02 -- it does not come back until the crawl
          # succeeds again, and the rule above cannot fire for exactly the
          # crawler that keeps failing. The CronJob's own record of its last
          # successful Job is held by the API server and survives all of that.
          #
          # Only while the pushed gauge is absent, so the two never fire
          # together, and the rule above stays the one that normally speaks:
          # it is the crawler's own account of success, which for a crawler
          # that exits zero past failed categories is the stricter of the two.
          expr: >-
            (time() - kube_cronjob_status_last_successful_time{namespace="default", cronjob="catcrawl-scheduler"} > 691200)
            unless on() catcrawl_last_success_timestamp_seconds{job="catcrawl"}
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "catcrawl has not completed successfully for over 8 days"
            description: "The catcrawl-scheduler CronJob last had a successful Job {{ $value | humanizeDuration }} ago, and the crawler's own last-success metric is missing from the Pushgateway. The job may be running and failing each time."

        - alert: CatcrawlPartialFailure
          # The crawl continues past a failed category and exits zero, so
          # Kubernetes reports success while data is quietly missing.
          # Gated on push freshness for the reason spelled out under
          # CatcrawlProductsDropped: the Pushgateway re-serves the last push
          # to every scrape forever, so an ungated rule reading a weekly
          # crawl's gauge stays firing until the next crawl overwrites it.
          expr: >-
            catcrawl_category_errors{job="catcrawl"} > 0
            and (time() - catcrawl_run_timestamp_seconds{job="catcrawl"} < 86400)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "catcrawl completed with {{ $value }} failed categories (store {{ $labels.store }})"
            description: "The crawl exited successfully but {{ $value }} categories failed, so those products were not refreshed. Check the job logs for the per-category errors."

        - alert: CatcrawlProductsDropped
          # Self-calibrating against the crawl's own history, so it needs no
          # hand-tuned product count. Cannot fire on first deploy: with a single
          # sample the series is compared against itself.
          # The Pushgateway never expires a value: it re-serves the last push
          # to every scrape until the next crawl overwrites it. Because the
          # crawl is weekly, one bad run would otherwise hold this alert up
          # for seven days — and a run killed by activeDeadlineSeconds pushes
          # a partial product count on its way out, which is exactly the
          # shape that trips the threshold. The freshness gate limits the
          # alert to the day after a crawl actually finished, so it fires
          # loudly once and then falls quiet instead of repeating all week.
          expr: >-
            catcrawl_products_seen{job="catcrawl"}
            < 0.5 * max_over_time(catcrawl_products_seen{job="catcrawl"}[60d])
            and (time() - catcrawl_run_timestamp_seconds{job="catcrawl"} < 86400)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "catcrawl captured far fewer products than usual (store {{ $labels.store }})"
            description: "Last crawl saw {{ $value }} products, less than half its 60-day peak. The upstream API may have changed, or a category may be returning nothing."

        - alert: CatcrawlMetricsMissing
          # The Pushgateway keeps what was pushed on a volume since 2026-10-03,
          # so a restart no longer drops these series; this is the backstop for
          # the day that volume is lost or was never written. Without it the
          # crawl alerts would go quiet rather than fire, which is the more
          # dangerous failure: silence that looks like health.
          # Gated to Wednesdays (UTC, matching the 0 2 * * 3 schedule): missing
          # metrics only matter on the day the crawl is due, so a mid-week
          # Pushgateway restart stays quiet until then.
          expr: absent(catcrawl_run_timestamp_seconds{job="catcrawl"}) and on() (day_of_week() == 3)
          # Long enough to cover a deploy: these series do not exist until the
          # first crawl pushes them, so this fires once after initial rollout and
          # resolves itself as soon as a crawl runs. The crawl starts at 02:00
          # UTC, so with the Wednesday gate this fires from 06:00 UTC at the
          # earliest — well after the run should have repopulated the metrics.
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "catcrawl metrics are absent from the Pushgateway"
            description: "No catcrawl metrics are present on crawl day (Wednesday). The Pushgateway may have restarted and lost its state, and today's run has not repopulated it — the crawl alerts are blind until it does."

    # catcrawl-coles is a weekly CronJob (0 2 * * 3) that scrapes coles.com.au
    # through a headless Chrome, because the mobile API it used to call is now
    # blocked by Imperva. It reports its own outcome to the Pushgateway; the
    # alerts that answer "did it run at all" come from kube-state-metrics
    # instead, because a job that panics, is OOM-killed or never starts pushes
    # nothing and cannot report on itself.
    - name: catcrawl-coles
      rules:
        - alert: ColesCrawlBlocked
          # Coles refusing the crawler outright. Since 2026-09-25 the crawler
          # stops after three pages in a row fail in the browser and reports it
          # as catcrawl_coles_run_blocked. It is one fact, and without this the
          # rest of this group reports it as many: the Job failed (per Job, for
          # 48h, alongside the stock KubeJobFailed), the products dropped, the
          # run was partial, nothing has succeeded, and ArgoCD calls the
          # catcrawl app degraded because the CronJob's last run failed -- nine
          # alerts on 2026-09-26, in seven Discord notifications every four
          # hours. Alertmanager holds those back while this fires, and repeats
          # this one daily rather than every four hours
          # (base/monitoring/alertmanager-config.yaml). ArgoCD's are the
          # exception: they no longer fire for the catcrawl app at all (see
          # ArgoCDAppDegraded).
          #
          # Only for six days after the run that reported it. The gauge stays at
          # 1 until another run pushes over it, and a run that fails for another
          # reason before capturing anything pushes nothing. Without the limit a
          # later, unrelated failure -- the database down on the next Wednesday,
          # say -- would be held back behind a block that may have lifted.
          expr: >-
            catcrawl_coles_run_blocked{job="catcrawl_coles"} == 1
            and on(store) (time() - catcrawl_coles_run_timestamp_seconds{job="catcrawl_coles"} < 518400)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Coles is refusing the crawler (store {{ $labels.store }})"
            description: "The last Coles crawl stopped because pages kept failing in the browser, which is what the site's block pages do (\"Pardon Our Interruption\", or \"Request unsuccessful. Incapsula incident ID\"). Nothing in the cluster needs fixing; the weekly run tries again and resumes by itself once Coles stops refusing it. While this fires, the other Coles crawl alerts and KubeJobFailed for the Coles Jobs are held back. The run's log has what the site showed in shown_title, shown_url and shown_text."

        - alert: ColesCrawlWrongStore
          # Prices are per store, and a store that does not switch fails
          # silently: the pages are good pages for somewhere else. From
          # 2026-09-27 to 2026-09-30 that put Sydney CBD's prices under Broken
          # Hill, Melbourne CBD and Mildura. This reads the two gauges the
          # crawler now pushes about it.
          #
          # stores_wrong_store is a store refused, with nothing written for it:
          # its whole listing repeated an earlier store's, or one of its pages
          # named another store. The run fails as well, so ColesCrawlJobFailed
          # fires beside this; this is the one that says why. It cannot happen
          # while the regional stores are off (catcrawl/catcrawl-col-cron.yaml)
          # and is here for the day they are turned back on.
          #
          # pages_naming_another_store can happen at the home store too, and
          # there the pages are still recorded, because what the site means by
          # the store it names has been seen on one page. So that half of this
          # is the only notice there would be.
          expr: >-
            (
              catcrawl_coles_stores_wrong_store{job="catcrawl_coles"} > 0
              or catcrawl_coles_pages_naming_another_store{job="catcrawl_coles"} > 0
            )
            and (time() - catcrawl_coles_run_timestamp_seconds{job="catcrawl_coles"} < 86400)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Coles answered for a different store than the one selected (store {{ $labels.store }})"
            description: "In the last Coles crawl the site answered for a store other than the one selected: a store's whole listing repeated an earlier store's, or pages said they were rendered for another store. A store after the first is refused and nothing is recorded for it; the first store's pages are recorded anyway, so if this fires with no failed Job, the home store's prices may be another store's. Check the run's log for \"the site answered for a different store\" and \"rendered for another store\", and for pages_naming_store and pages_naming_another_store on \"store finished\"."

        - alert: ColesCrawlJobFailed
          expr: kube_job_failed{namespace="default", job_name=~"catcrawl-col-scheduler-.*", condition="true"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "catcrawl-coles job {{ $labels.job_name }} failed"
            description: "The Coles CronJob failed. Check `kubectl logs -n default job/{{ $labels.job_name }}` — likely causes are Chromium failing to start, Imperva blocking the session outright, the database being unreachable, or a failed migration."

        - alert: ColesCrawlNotScheduled
          # The CronJob runs weekly; 8 days means a schedule was missed entirely.
          expr: time() - kube_cronjob_status_last_schedule_time{namespace="default", cronjob="catcrawl-col-scheduler"} > 691200
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "catcrawl-coles has not been scheduled for over 8 days"
            description: "The Coles CronJob last scheduled {{ $value | humanizeDuration }} ago. It may be suspended, or the image may not be pullable."

        - alert: ColesCrawlNoRecentSuccess
          # Distinct from the above: the job may be running every week and
          # failing every time, which leaves last_schedule_time healthy.
          expr: time() - catcrawl_coles_last_success_timestamp_seconds{job="catcrawl_coles"} > 691200
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "catcrawl-coles has not completed successfully for over 8 days (store {{ $labels.store }})"
            description: "Last successful crawl was {{ $value | humanizeDuration }} ago. The job may be running and failing each time."

        - alert: ColesCrawlNoRecentSuccess
          # The same alert, from the other side. catcrawl_coles_last_success_timestamp_seconds is pushed
          # only by a run that succeeds, so when the Pushgateway has lost it --
          # as it did on 2026-10-02 -- it does not come back until the crawl
          # succeeds again, and the rule above cannot fire for exactly the
          # crawler that keeps failing. The CronJob's own record of its last
          # successful Job is held by the API server and survives all of that.
          #
          # Only while the pushed gauge is absent, so the two never fire
          # together, and the rule above stays the one that normally speaks:
          # it is the crawler's own account of success, which for a crawler
          # that exits zero past failed categories is the stricter of the two.
          expr: >-
            (time() - kube_cronjob_status_last_successful_time{namespace="default", cronjob="catcrawl-col-scheduler"} > 691200)
            unless on() catcrawl_coles_last_success_timestamp_seconds{job="catcrawl_coles"}
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "catcrawl-coles has not completed successfully for over 8 days"
            description: "The catcrawl-col-scheduler CronJob last had a successful Job {{ $value | humanizeDuration }} ago, and the crawler's own last-success metric is missing from the Pushgateway. The job may be running and failing each time."

        - alert: ColesCrawlPartialFailure
          # Categories still failing when the run ended. The crawl carries on
          # past a failed category and, since 2026-10-04, goes back for it
          # twice at the end of its store (catcrawl_coles_categories_retried
          # counts the ones gone back for), so this is what was left after
          # that. The run exits non-zero as well, so ColesCrawlJobFailed fires
          # beside this. That one says the Job failed; this one says the rest
          # of the catalogue was captured, and how much was not.
          # Gated on push freshness for the reason spelled out under
          # CatcrawlProductsDropped: the Pushgateway re-serves the last push
          # to every scrape forever, so an ungated rule reading a weekly
          # crawl's gauge stays firing until the next crawl overwrites it.
          expr: >-
            catcrawl_coles_category_errors{job="catcrawl_coles"} > 0
            and (time() - catcrawl_coles_run_timestamp_seconds{job="catcrawl_coles"} < 86400)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "catcrawl-coles finished with {{ $value }} categories still failing (store {{ $labels.store }})"
            description: "{{ $value }} categories were still failing after the crawler had gone back for them twice, so their products were not refreshed this week, and no product was marked discontinued. Everything else was captured. The Job fails as well. The run's log has each one under \"category failed again\", with the page it stopped on."

        - alert: ColesCrawlProductsDropped
          # Self-calibrating against the crawl's own history, so it needs no
          # hand-tuned product count. Cannot fire on first deploy: with a single
          # sample the series is compared against itself.
          # Gated on push freshness for the reason spelled out under
          # CatcrawlProductsDropped: the Pushgateway re-serves the last push
          # to every scrape forever, so an ungated rule reading a weekly
          # crawl's gauge stays firing until the next crawl overwrites it.
          expr: >-
            catcrawl_coles_products_seen{job="catcrawl_coles"}
            < 0.5 * max_over_time(catcrawl_coles_products_seen{job="catcrawl_coles"}[60d])
            and (time() - catcrawl_coles_run_timestamp_seconds{job="catcrawl_coles"} < 86400)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "catcrawl-coles captured far fewer products than usual (store {{ $labels.store }})"
            description: "Last crawl saw {{ $value }} products, less than half its 60-day peak. The site's markup may have changed, or categories may be returning challenge pages instead of products."

        - alert: ColesCrawlPriceParseDegraded
          # The alarm for silent schema drift. If Coles renames its price field,
          # decoding still succeeds and every product is stored with no price —
          # a crawl that reports total success while destroying the data.
          # Nothing else in the run would notice.
          # Gated on push freshness for the reason spelled out under
          # CatcrawlProductsDropped: the Pushgateway re-serves the last push
          # to every scrape forever, so an ungated rule reading a weekly
          # crawl's gauge stays firing until the next crawl overwrites it.
          expr: >-
            catcrawl_coles_products_missing_price{job="catcrawl_coles"}
            / clamp_min(catcrawl_coles_products_seen{job="catcrawl_coles"}, 1) > 0.05
            and (time() - catcrawl_coles_run_timestamp_seconds{job="catcrawl_coles"} < 86400)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "catcrawl-coles captured {{ $value | humanizePercentage }} of products without a price (store {{ $labels.store }})"
            description: "More than 5% of products came back with no price. The site's JSON shape has probably changed and the mapper is silently reading absent values. Compare a live __NEXT_DATA__ payload against pkg/coleswww/testdata before the next run overwrites more rows."

        - alert: ColesCrawlBeingChallenged
          # Being served interstitial challenges is how being blocked outright
          # begins. This is the specific failure mode of scraping behind
          # Imperva, and it shows up here well before the crawl starts failing.
          # Gated on push freshness for the reason spelled out under
          # CatcrawlProductsDropped: the Pushgateway re-serves the last push
          # to every scrape forever, so an ungated rule reading a weekly
          # crawl's gauge stays firing until the next crawl overwrites it.
          expr: >-
            catcrawl_coles_challenges_encountered{job="catcrawl_coles"}
            / clamp_min(catcrawl_coles_pages_fetched{job="catcrawl_coles"}, 1) > 0.25
            and (time() - catcrawl_coles_run_timestamp_seconds{job="catcrawl_coles"} < 86400)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "catcrawl-coles was challenged on {{ $value | humanizePercentage }} of page loads (store {{ $labels.store }})"
            description: "Imperva is challenging a large share of requests. The persisted Chrome profile may have lost its session, or the crawl rate may need slowing via CRAWL_MIN_DELAY_MS/CRAWL_MAX_DELAY_MS."

        - alert: ColesCrawlMetricsMissing
          # The Pushgateway keeps what was pushed on a volume since 2026-10-03,
          # so a restart no longer drops these series; this is the backstop for
          # the day that volume is lost or was never written. Without it the
          # crawl alerts would go quiet rather than fire, which is the more
          # dangerous failure: silence that looks like health.
          # Gated to Thursdays (UTC), the day after the 0 2 * * 3 crawl: missing
          # metrics only matter once the crawl should have pushed them, so a
          # mid-week Pushgateway restart stays quiet until then. The crawl pushes
          # when it ends, and since 2026-09-25 it may run until 03:00 UTC on
          # Thursday (Job activeDeadlineSeconds 90000), so a Wednesday gate
          # would fire during a slow run that has yet to report.
          expr: absent(catcrawl_coles_run_timestamp_seconds{job="catcrawl_coles"}) and on() (day_of_week() == 4)
          # Long enough to cover a deploy: these series do not exist until the
          # first crawl pushes them, so this fires once after initial rollout and
          # resolves itself as soon as a crawl runs. With the Thursday gate this
          # fires from 06:00 UTC at the earliest, three hours after the longest
          # run the Job allows has ended.
          for: 6h
          labels:
            severity: warning
          annotations:
            summary: "catcrawl-coles metrics are absent from the Pushgateway"
            description: "No Coles crawl metrics are present the day after the crawl (Thursday). The Pushgateway may have restarted and lost its state, and Wednesday's run has not repopulated it — the crawl alerts are blind until it does."

    # Aldi. Mirrors the catcrawl-coles group above, with Aldi's own metric
    # prefix and schedule.
    #
    # Written as its own group rather than folded in with a __name__ regex
    # spanning the three prefixes: several of these rules join two metrics with
    # `and`, and vector matching compares every label including __name__, so a
    # spanning regex produces rules that silently never fire.
    - name: catcrawl-aldi
      rules:
        - alert: AldiCrawlJobFailed
          expr: kube_job_failed{namespace="default", job_name=~"catcrawl-aldi-scheduler-.*", condition="true"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "catcrawl-aldi job {{ $labels.job_name }} failed"
            description: "The Aldi crawl failed. Check `kubectl logs -n default job/{{ $labels.job_name }}` — likely causes are the database being unreachable, a failed migration, or Aldi changing its page payload."

        - alert: AldiCrawlNotScheduled
          # Weekly (0 4 * * 3); 8 days means a schedule was missed entirely.
          expr: time() - kube_cronjob_status_last_schedule_time{namespace="default", cronjob="catcrawl-aldi-scheduler"} > 691200
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "catcrawl-aldi has not been scheduled for over 8 days"
            description: "The Aldi CronJob last scheduled {{ $value | humanizeDuration }} ago. It may be suspended, or the image may not be pullable."

        - alert: AldiCrawlNoRecentSuccess
          expr: time() - catcrawl_aldi_last_success_timestamp_seconds{job="catcrawl_aldi"} > 691200
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "catcrawl-aldi has not completed successfully for over 8 days"
            description: "Last successful Aldi crawl was {{ $value | humanizeDuration }} ago. The job may be running and failing each time."

        - alert: AldiCrawlNoRecentSuccess
          # The same alert, from the other side. catcrawl_aldi_last_success_timestamp_seconds is pushed
          # only by a run that succeeds, so when the Pushgateway has lost it --
          # as it did on 2026-10-02 -- it does not come back until the crawl
          # succeeds again, and the rule above cannot fire for exactly the
          # crawler that keeps failing. The CronJob's own record of its last
          # successful Job is held by the API server and survives all of that.
          #
          # Only while the pushed gauge is absent, so the two never fire
          # together, and the rule above stays the one that normally speaks:
          # it is the crawler's own account of success, which for a crawler
          # that exits zero past failed categories is the stricter of the two.
          expr: >-
            (time() - kube_cronjob_status_last_successful_time{namespace="default", cronjob="catcrawl-aldi-scheduler"} > 691200)
            unless on() catcrawl_aldi_last_success_timestamp_seconds{job="catcrawl_aldi"}
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "catcrawl-aldi has not completed successfully for over 8 days"
            description: "The catcrawl-aldi-scheduler CronJob last had a successful Job {{ $value | humanizeDuration }} ago, and the crawler's own last-success metric is missing from the Pushgateway. The job may be running and failing each time."

        - alert: AldiCrawlPartialFailure
          expr: >-
            catcrawl_aldi_category_errors{job="catcrawl_aldi"} > 0
            and (time() - catcrawl_aldi_run_timestamp_seconds{job="catcrawl_aldi"} < 86400)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "catcrawl-aldi completed with {{ $value }} failed categories"
            description: "The crawl exited successfully but {{ $value }} categories failed, so those products were not refreshed."

        - alert: AldiCrawlProductsDropped
          expr: >-
            catcrawl_aldi_products_seen{job="catcrawl_aldi"}
            < 0.5 * max_over_time(catcrawl_aldi_products_seen{job="catcrawl_aldi"}[60d])
            and (time() - catcrawl_aldi_run_timestamp_seconds{job="catcrawl_aldi"} < 86400)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "catcrawl-aldi captured far fewer products than usual"
            description: "Last crawl saw {{ $value }} products, less than half its 60-day peak. Aldi may have changed its page payload, or a category may be returning nothing."

        - alert: AldiCrawlMetricsMissing
          # Aldi runs at 04:00 rather than 02:00, so this settles later than the
          # equivalent rules for the other two crawls.
          expr: absent(catcrawl_aldi_run_timestamp_seconds{job="catcrawl_aldi"}) and on() (day_of_week() == 3)
          for: 8h
          labels:
            severity: warning
          annotations:
            summary: "catcrawl-aldi metrics are absent from the Pushgateway"
            description: "No Aldi crawl metrics are present on crawl day (Wednesday). The Pushgateway may have restarted and lost its state, and today's run has not repopulated it — the Aldi crawl alerts are blind until it does."

    # catcrawl-viewer serves catcrawl.linds.com.au: search, price history and
    # the Coles/Woolworths comparison. It replaced the Coles price-history API,
    # whose alert group was removed with it.
    #
    # Unlike the crawls it is long-lived, so it is scraped directly rather than
    # pushing to the Pushgateway.
    - name: catcrawl-viewer
      rules:
        - alert: CatcrawlViewerDown
          expr: up{job="catcrawl-viewer"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "catcrawl-viewer is down"
            description: "The price viewer at catcrawl.linds.com.au is not responding to scrapes. Check `kubectl logs -n default deploy/catcrawl-viewer`; it holds three database connections and refuses to start if any of them is unreachable."

        - alert: CatcrawlViewerHighErrorRate
          expr: >
            sum(rate(catcrawl_viewer_http_requests_total{status="5xx"}[5m]))
            / clamp_min(sum(rate(catcrawl_viewer_http_requests_total[5m])), 0.001) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "catcrawl-viewer is failing {{ $value | humanizePercentage }} of requests"
            description: "More than 5% of requests are returning 5xx. Check catcrawl_viewer_database_errors_total, which is labelled by which database was being read — the viewer reads both crawlers' databases and writes to its own."

        - alert: CatcrawlViewerDatabaseErrors
          expr: sum(rate(catcrawl_viewer_database_errors_total[10m])) by (retailer) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "catcrawl-viewer cannot read the {{ $labels.retailer }} database"
            description: "Database errors are being returned continuously for {{ $labels.retailer }}. A `viewer` label means its own match database; `coles` and `wow` are the crawlers' databases, which it only reads."

        - alert: CatcrawlViewerIndexStale
          # The index is rebuilt hourly and holds both catalogues in memory. A
          # failed rebuild keeps the previous index rather than emptying it, so
          # the service stays useful and this is the only signal that rebuilds
          # have stopped working. Three intervals allows two failures.
          expr: catcrawl_viewer_index_age_seconds > 10800
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "catcrawl-viewer search index has not rebuilt for {{ $value | humanizeDuration }}"
            description: "Rebuilds are failing and the viewer is serving an increasingly stale catalogue. It keeps the old index deliberately — stale results beat none — so nothing else will show this. Check the logs for `rebuilding match index failed`."

        - alert: CatcrawlViewerIndexEmpty
          # Distinct from the index being stale: this is an index that built
          # successfully and found almost nothing, which means a crawler's
          # products table has been emptied or a schema change broke the read.
          expr: catcrawl_viewer_index_products < 50000
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "catcrawl-viewer has only {{ $value }} products indexed"
            description: "Both catalogues together are normally around 148,000 products. A collapse means a products table is empty or an adapter has stopped mapping rows. Search and matching are effectively down."

        - alert: CatcrawlViewerDataStale
          # What a visitor actually experiences, as opposed to whether a crawl
          # job reported success. The crawls are weekly, so 9 days means a run
          # was missed or wrote nothing.
          expr: catcrawl_viewer_observation_age_seconds > 777600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "catcrawl-viewer is serving {{ $labels.retailer }} prices {{ $value | humanizeDuration }} old"
            description: "No {{ $labels.retailer }} product has been seen by a crawl in over 9 days. Cross-check that retailer's own NoRecentSuccess alert: if it is quiet, the crawl is running but writing nothing."

    # The weekly VACUUM (ANALYZE) over the three crawler databases
    # (catcrawl/catcrawl-vacuum-cron.yaml).
    #
    # Its own group, because `catcrawl`, `catcrawl-coles`, `catcrawl-aldi` and
    # `catcrawl-viewer` all already exist above and Prometheus rejects the
    # whole file if two groups in it share a name.
    #
    # Both rules read kube-state-metrics only. That is not a stylistic choice:
    # this job is psql, not one of the Go crawlers, so it pushes nothing to the
    # Pushgateway and there is no catcrawl_vacuum_* series to join against.
    # Nothing here uses `and` across two metric families, and nothing reaches
    # for a __name__ regex spanning the crawlers' prefixes — vector matching
    # compares __name__ along with every other label, so such a rule would
    # silently never fire.
    - name: catcrawl-maintenance
      rules:
        - alert: CatcrawlVacuumJobFailed
          expr: kube_job_failed{namespace="default", job_name=~"catcrawl-vacuum-.*", condition="true"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "catcrawl vacuum job {{ $labels.job_name }} failed"
            description: "The weekly VACUUM (ANALYZE) over catcrawl, catcrawl-coles and catcrawl-aldi failed. Check `kubectl logs -n default job/{{ $labels.job_name }}`; likely causes are the database being unreachable or the catcrawl role having lost ownership of a table. Warning, not critical: one skipped run loses nothing, autovacuum still runs, the tables just keep the dead space the last crawl left and the planner keeps stale statistics until the next run. Do NOT substitute VACUUM FULL — it locks these tables against catcrawl-viewer for its whole run."

        - alert: CatcrawlVacuumNotScheduled
          # Weekly; 8 days means a schedule was missed entirely. Same threshold
          # as the three crawls above.
          expr: time() - kube_cronjob_status_last_schedule_time{namespace="default", cronjob="catcrawl-vacuum"} > 691200
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "catcrawl vacuum has not been scheduled for over 8 days"
            description: "The catcrawl-vacuum CronJob last scheduled {{ $value | humanizeDuration }} ago. It may be suspended, or a previous run may still be active — concurrencyPolicy is Forbid, so one wedged vacuum blocks every run after it."
