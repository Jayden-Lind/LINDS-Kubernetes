        {
          "type": "text",
          "id": 12,
          "title": "How to unblock",
          "gridPos": {
            "x": 12,
            "y": 21,
            "w": 12,
            "h": 9
          },
          "options": {
            "mode": "markdown",
            "content": "1. Find the block in the table above. **Blocked** is the name or the address.\n2. On jd-router-01, run the command of the last column. Example:\n\n       router unblock example.com\n\n3. Wait about half a minute. The name and its subdomains (or the address) are not blocked any more. They are still logged.\n\n| Command | What it does |\n|---|---|\n| `router blocked` | The last blocks, on the router |\n| `router unblock` | The list of what is unblocked |\n| `router reblock example.com` | Block it again |\n| `router ips off 10` | Stop Suricata for 10 minutes, if a page fails and no block shows here |\n"
          }
