---
# Grafana dashboard for Suricata EVE events shipped from jd-vyos-01 via
# syslog -> Alloy (172.16.1.23:1515/tcp) -> Loki. Picked up by the
# kube-prometheus grafana dashboard sidecar via the grafana_dashboard label.
# Panels use the event_type label and the structured metadata that Alloy's
# loki.process.syslog attaches (alert_*, src_ip, dest_ip, dns_*, tls_sni,
# http_*), so they never run `| json` over the whole stream.
apiVersion: v1
kind: ConfigMap
metadata:
  name: suricata-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Logs
data:
  suricata-vyos.json: |
    {
      "uid": "suricata-vyos",
      "title": "Suricata — jd-vyos-01",
      "description": "Suricata IDS on the VyOS LAN trunk. EVE JSON -> rsyslog -> Alloy 172.16.1.23:1515 -> Loki. Config: LINDS-Ansible roles/vyos (jd_suricata.yml).",
      "tags": [
        "suricata",
        "network",
        "vyos",
        "logs"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "event_type",
            "label": "Event type",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "label": "event_type",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "{job=\"suricata\"}",
              "type": 1
            },
            "definition": "label_values({job=\"suricata\"}, event_type)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "severity",
            "label": "Alert severity",
            "type": "custom",
            "query": "High : 1,Medium : 2,Low : 3",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "ip",
            "label": "IP (regex, src or dest)",
            "type": "textbox",
            "query": ".*",
            "current": {
              "text": ".*",
              "value": ".*"
            },
            "options": []
          },
          {
            "name": "search",
            "label": "Search (regex)",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "options": []
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "IDS alerts",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({job=\"suricata\", event_type=\"alert\"} | alert_severity=~\"$severity\" | src_ip=~\"$ip\" or dest_ip=~\"$ip\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
