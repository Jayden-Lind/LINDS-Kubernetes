---
# Grafana dashboard for the Suricata events of jd-router-01 and
# linds-router-01: router -> rsyslog -> Alloy (172.16.1.23:1515/tcp) -> Loki.
# The Grafana dashboard sidecar reads it (label grafana_dashboard).
#
# GENERATED. Edit suricata-dashboard.py and make this file again:
#   python3 base/monitoring/suricata-dashboard.py > base/monitoring/suricata-dashboard.yaml
#
# The panels use the labels hostname and event_type and the structured
# metadata that Alloy attaches (applications/monitoring-loki.yaml: alert_*,
# src_ip, dest_ip, dns_*, tls_sni, quic_sni, http_*). No panel runs `| json`
# on the whole stream.
apiVersion: v1
kind: ConfigMap
metadata:
  name: suricata-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Logs
data:
  suricata.json: |
    {
      "uid": "suricata",
      "title": "Suricata",
      "description": "What Suricata on the two routers blocked, reported and saw. Events go from the router to Alloy (syslog, 172.16.1.23:1515) and then to Loki. Router side: LINDS-Ansible roles/router.",
      "tags": [
        "suricata",
        "network",
        "router",
        "logs"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "annotations": {
        "list": []
      },
      "links": [
        {
          "title": "Router",
          "type": "link",
          "url": "/d/router",
          "icon": "dashboard"
        },
        {
          "title": "Network devices",
          "type": "link",
          "url": "/d/network-devices",
          "icon": "dashboard"
        }
      ],
      "templating": {
        "list": [
          {
            "name": "router",
            "label": "Router",
            "description": "The router that saw the event.",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "label": "hostname",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "{job=\"suricata\"}",
              "type": 1
            },
            "definition": "label_values({job=\"suricata\"}, hostname)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "ip",
            "label": "Address",
            "description": "An address at one end of the event, as a regular expression. Example: 192[.]168[.]1[.]20 for one device, 192[.]168[.]1[.].* for a network.",
            "type": "textbox",
            "query": ".*",
            "current": {
              "text": ".*",
              "value": ".*"
            },
            "options": []
          },
          {
            "name": "name",
            "label": "Name contains",
            "description": "Text in the DNS name, the server name or the HTTP host.",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "options": []
          },
          {
            "name": "severity",
            "label": "Alert severity",
            "type": "custom",
            "query": "High : 1,Medium : 2,Low : 3",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "event_type",
            "label": "Raw events: type",
            "description": "For the section \"Raw events\" only.",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "label": "event_type",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "{job=\"suricata\"}",
              "type": 1
            },
            "definition": "label_values({job=\"suricata\"}, event_type)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "id": 1,
          "title": "Blocked",
          "description": "What jd-router-01 stopped: traffic of an address on a list of hostile addresses, a DNS question or a connection for a name on a malware or phishing list, and traffic that matches a malware signature. linds-router-01 does not block.",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({job=\"suricata\", hostname=~\"$router\", event_type=\"alert\"} | alert_action=\"blocked\" | src_ip=~\"$ip\" or dest_ip=~\"$ip\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Alerts",
          "description": "Events that a rule reported and the router let through.",
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({job=\"suricata\", hostname=~\"$router\", event_type=\"alert\"} | alert_action!=\"blocked\" | alert_severity=~\"$severity\" | src_ip=~\"$ip\" or dest_ip=~\"$ip\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 3,
          "title": "High severity",
          "description": "The alerts with severity 1.",
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({job=\"suricata\", hostname=~\"$router\", event_type=\"alert\"} | alert_action!=\"blocked\" | alert_severity=\"1\" | src_ip=~\"$ip\" or dest_ip=~\"$ip\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 4,
          "title": "DNS lookups",
          "description": "Names that devices asked the router for.",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({job=\"suricata\", hostname=~\"$router\", event_type=\"dns\"} | dns_type!=\"response\" | dns_rrname=~\"(?i).*$name.*\" | src_ip=~\"$ip\" or dest_ip=~\"$ip\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 5,
          "title": "TLS and QUIC sessions",
          "description": "Encrypted sessions to and from the internet. Suricata reads the server name at the start of the session.",
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({job=\"suricata\", hostname=~\"$router\", event_type=~\"tls|quic\"} | tls_sni=~\"(?i).*$name.*\" or quic_sni=~\"(?i).*$name.*\" | src_ip=~\"$ip\" or dest_ip=~\"$ip\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 6,
          "title": "HTTP requests",
          "description": "Requests that were not encrypted.",
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({job=\"suricata\", hostname=~\"$router\", event_type=\"http\"} | http_hostname=~\"(?i).*$name.*\" | src_ip=~\"$ip\" or dest_ip=~\"$ip\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "id": 7,
          "title": "Blocked and alerts",
          "description": "Blocked connections and alerts for each interval, for each router.",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (hostname) (count_over_time({job=\"suricata\", hostname=~\"$router\", event_type=\"alert\"} | src_ip=~\"$ip\" or dest_ip=~\"$ip\" [$__auto]))",
              "legendFormat": "{{hostname}}",
              "queryType": "range"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "decimals": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 0,
                "barWidthFactor": 0.8,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "jd-router-01"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "linds-router-01"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "timeseries",
          "id": 8,
          "title": "Events",
          "description": "All stored events for each interval, for each router. DNS answers and the engine's statistics are not stored.",
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 7
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum by (hostname) (count_over_time({job=\"suricata\", hostname=~\"$router\"} [$__auto]))",
              "legendFormat": "{{hostname}}",
              "queryType": "range"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "decimals": null,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 0,
                "barWidthFactor": 0.8,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "jd-router-01"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "linds-router-01"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "row",
          "id": 9,
          "title": "Blocked by the router",
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "table",
          "id": 10,
          "title": "Blocked",
          "description": "Each block, newest first. \"Device\" is the device on this side: the one that asked, or the published service that an outside address came to. \"Blocked\" is the name that the device asked for, or the address on the internet.\n\nTo unblock: run the command of the last column on jd-router-01 (it takes about half a minute). `router unblock` alone shows the list, and `router reblock` takes a name out again.",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 24,
            "h": 9
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "{job=\"suricata\", hostname=~\"$router\", event_type=\"alert\"} | alert_action=\"blocked\" | src_ip=~\"$ip\" or dest_ip=~\"$ip\" | label_format device=`{{ if (eq (regexReplaceAll \"^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|fe80:|2001:8003:dc6f:63).*\" .src_ip \"\") \"\") }}{{ .src_ip }}{{ else }}{{ .dest_ip }}{{ end }}`, blocked=`{{ if .dns_rrname }}{{ .dns_rrname }}{{ else if .tls_sni }}{{ .tls_sni }}{{ else if .http_hostname }}{{ .http_hostname }}{{ else if .quic_sni }}{{ .quic_sni }}{{ else if (eq (regexReplaceAll \"^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|fe80:|2001:8003:dc6f:63).*\" .src_ip \"\") \"\") }}{{ .dest_ip }}{{ else }}{{ .src_ip }}{{ end }}`, unblock=`router unblock {{ if .dns_rrname }}{{ .dns_rrname }}{{ else if .tls_sni }}{{ .tls_sni }}{{ else if .http_hostname }}{{ .http_hostname }}{{ else if .quic_sni }}{{ .quic_sni }}{{ else if (eq (regexReplaceAll \"^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.]|fe80:|2001:8003:dc6f:63).*\" .src_ip \"\") \"\") }}{{ .dest_ip }}{{ else }}{{ .src_ip }}{{ end }}`",
              "queryType": "range",
              "maxLines": 500,
              "direction": "backward"
            }
          ],
          "transformations": [
            {
              "id": "extractFields",
              "options": {
                "source": "labels",
                "format": "json",
                "replace": false,
                "keepTime": false
              }
            },
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "Time",
                    "hostname",
                    "device",
                    "blocked",
                    "dest_port",
                    "alert_signature",
                    "unblock"
                  ]
                }
              }
            },
            {
              "id": "organize",
              "options": {
                "indexByName": {
                  "Time": 0,
                  "hostname": 1,
                  "device": 2,
                  "blocked": 3,
                  "dest_port": 4,
                  "alert_signature": 5,
                  "unblock": 6
                },
                "renameByName": {
                  "hostname": "Router",
                  "device": "Device",
                  "blocked": "Blocked",
                  "dest_port": "Port",
                  "alert_signature": "Why (the rule)",
                  "unblock": "To unblock, on the router"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Time",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "filterable": true,
                "inspect": true
              },
              "noValue": ""
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Time"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 178
                  },
                  {
                    "id": "unit",
                    "value": "dateTimeAsLocal"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Router"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 130
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Device"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 215
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Blocked"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 250
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Port"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 65
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "To unblock, on the router"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 330
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "table",
          "id": 11,
          "title": "Most blocked",
          "description": "The names and addresses that the router blocked most often in the time range.",
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 12,
            "h": 9
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
