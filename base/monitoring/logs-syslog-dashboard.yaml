---
# Grafana dashboard: remote syslog (Alloy 172.16.1.23 -> Loki), all senders.
# Sidecar-discovered (grafana_dashboard label), "Logs" folder (grafana_folder).
apiVersion: v1
kind: ConfigMap
metadata:
  name: logs-syslog-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Logs
data:
  logs-syslog.json: |
    {
      "uid": "logs-syslog",
      "title": "Logs / Syslog",
      "description": "Remote syslog received by the Alloy LoadBalancer 172.16.1.23 (ports 514/1514 UDP, 1515 TCP).",
      "tags": [
        "logs",
        "loki",
        "syslog"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "hostname",
            "label": "Host",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "label": "hostname",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "{job=~\"syslog|vyos\"}",
              "type": 1
            },
            "definition": "label_values({job=~\"syslog|vyos\"}, hostname)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "appname",
            "label": "App",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "label": "appname",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "{job=~\"syslog|vyos\", hostname=~\"$hostname\"}",
              "type": 1
            },
            "definition": "label_values({job=~\"syslog|vyos\", hostname=~\"$hostname\"}, appname)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "severity",
            "label": "Severity",
            "type": "custom",
            "query": "emergency,alert,critical,error,warning,notice,informational,debug",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "search",
            "label": "Search (regex)",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "options": []
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Messages",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({job=~\"syslog|vyos\", hostname=~\"$hostname\", appname=~\"$appname\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Error and above",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({job=~\"syslog|vyos\", hostname=~\"$hostname\", appname=~\"$appname\"} |~ \"(?i)$search\" | severity=~\"emergency|alert|critical|error\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Warnings",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({job=~\"syslog|vyos\", hostname=~\"$hostname\", appname=~\"$appname\"} |~ \"(?i)$search\" | severity=\"warning\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "orange"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Hosts reporting",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(sum by (hostname) (count_over_time({job=~\"syslog|vyos\", hostname=~\"$hostname\", appname=~\"$appname\"} |~ \"(?i)$search\" [$__range])))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Messages by host",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (hostname) (count_over_time({job=~\"syslog|vyos\", hostname=~\"$hostname\", appname=~\"$appname\"} |~ \"(?i)$search\" [$__auto]))",
              "legendFormat": "{{hostname}}",
              "queryType": "range"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 1,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Messages by severity",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (severity) (count_over_time({job=~\"syslog|vyos\", hostname=~\"$hostname\", appname=~\"$appname\"} |~ \"(?i)$search\" [$__auto]))",
              "legendFormat": "{{severity}}",
              "queryType": "range"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 1,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "emergency"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "dark-red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "alert"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "dark-red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "critical"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "error"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "warning"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "notice"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "yellow"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "informational"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "debug"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "table",
          "title": "Busiest programs",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(15, sum by (hostname, appname) (count_over_time({job=~\"syslog|vyos\", hostname=~\"$hostname\", appname=~\"$appname\"} |~ \"(?i)$search\" [$__range])))",
              "queryType": "instant",
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value #A": "messages"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "messages",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "align": "auto",
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "messages"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 90
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "basic"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "table",
          "title": "Errors by program",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(15, sum by (hostname, appname) (count_over_time({job=~\"syslog|vyos\", hostname=~\"$hostname\", appname=~\"$appname\"} |~ \"(?i)$search\" | severity=~\"emergency|alert|critical|error\" [$__range])))",
              "queryType": "instant",
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value #A": "errors"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "errors",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "align": "auto",
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "errors"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 90
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "basic"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "logs",
          "title": "Syslog",
          "gridPos": {
            "h": 16,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{job=~\"syslog|vyos\", hostname=~\"$hostname\", appname=~\"$appname\"} |~ \"(?i)$search\" | severity=~\"$severity\"",
              "queryType": "range",
              "maxLines": 2000
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "prettifyLogMessage": false,
            "showLabels": false,
            "showCommonLabels": false,
            "enableInfiniteScrolling": true
          },
          "description": "UDP/514 legacy RFC3164, UDP/1514 RFC5424 (whole message kept), TCP/1515 jd-vyos-01 (message body only). procid/msgid/facility are structured metadata: `| procid=\"1234\"`."
        }
      ],
      "annotations": {
        "list": []
      },
      "links": []
    }
