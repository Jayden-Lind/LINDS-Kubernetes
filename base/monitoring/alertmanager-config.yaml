# Global Alertmanager configuration (referenced by name from
# alertmanagerSpec.alertmanagerConfiguration in applications/kube-prometheus.yml).
#
# Why a CRD and not the chart's raw alertmanager.config: the raw path is parsed
# by the operator with a strict schema that has NO webhook_url_file for Discord
# (only webhook_url), so a file/secret-based webhook silently fails to provision
# and Alertmanager falls back to a null default config - alerts go nowhere.
# Here the webhook URL comes from a proper secret reference (ESO-synced from
# Vault, monitoring/external-secret.yaml) and never touches git.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: global-alertmanager-config
  namespace: monitoring
spec:
  route:
    receiver: discord
    groupBy:
      - alertname
      - namespace
      - severity
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            matchType: "=~"
            value: "InfoInhibitor|Watchdog"
      # Coles refusing the crawler is a condition that lasts days, and nothing
      # here can fix it. Once a day is enough to say it is still going on.
      - receiver: discord
        matchers:
          - name: alertname
            matchType: "="
            value: ColesCrawlBlocked
        repeatInterval: 24h
  receivers:
    - name: "null"
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-secret
            key: discord_webhook_url
          sendResolved: true
          # The workload lines are for the chart's Deployment, StatefulSet and
          # DaemonSet alerts, whose summaries do not name what they are about.
          # On those the pod label is the kube-state-metrics pod the figure was
          # scraped from, not a pod of the workload, so it is left out.
          title: '{{ if eq .Status "firing" }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }}: {{ .GroupLabels.alertname }}{{ with .GroupLabels.namespace }} ({{ . }}){{ end }}'
          message: |-
            {{ range .Alerts -}}
            **{{ .Labels.alertname }}** | Severity: {{ .Labels.severity }}
            {{ if .Labels.namespace -}}Namespace: `{{ .Labels.namespace }}`
            {{ end -}}
            {{ if .Labels.deployment -}}Deployment: `{{ .Labels.deployment }}`
            {{ end -}}
            {{ if .Labels.statefulset -}}StatefulSet: `{{ .Labels.statefulset }}`
            {{ end -}}
            {{ if .Labels.daemonset -}}DaemonSet: `{{ .Labels.daemonset }}`
            {{ end -}}
            {{ if and .Labels.pod (not (or .Labels.deployment .Labels.statefulset .Labels.daemonset)) -}}Pod: `{{ .Labels.pod }}`
            {{ end -}}
            {{ if .Labels.node -}}Node: `{{ .Labels.node }}`
            {{ end -}}
            {{ if .Annotations.summary -}}> {{ .Annotations.summary }}
            {{ end -}}
            {{ end }}
  inhibitRules:
    - sourceMatch:
        - name: severity
          value: critical
          matchType: "="
      targetMatch:
        - name: severity
          value: "warning|info"
          matchType: "=~"
      equal:
        - namespace
        - alertname
    # While Coles is refusing the crawler (ColesCrawlBlocked, in
    # base/monitoring/alerts.yaml), everything that follows from that is held
    # back: it is one cause, and it was arriving as nine alerts. Two rules,
    # because the alerts it stands in for live in two places. (ArgoCD's alerts
    # for the catcrawl app were a third, until ArgoCDAppDegraded stopped firing
    # for that app at all.)
    #
    # The crawler's own alerts, except the two that are not about the run:
    # ColesCrawlNotScheduled (the CronJob not running at all) and
    # ColesCrawlMetricsMissing (which the blocked alert, reading those metrics,
    # could not stand in for).
    - sourceMatch:
        - name: alertname
          value: ColesCrawlBlocked
          matchType: "="
      targetMatch:
        - name: alertname
          value: "ColesCrawl(JobFailed|NoRecentSuccess|PartialFailure|ProductsDropped|PriceParseDegraded|BeingChallenged)"
          matchType: "=~"
    # The stock kube-prometheus alert for the same failed Jobs.
    - sourceMatch:
        - name: alertname
          value: ColesCrawlBlocked
          matchType: "="
      targetMatch:
        - name: alertname
          value: KubeJobFailed
          matchType: "="
        - name: job_name
          value: "catcrawl-col-scheduler-.*"
          matchType: "=~"
    # A failed crawl or vacuum Job is reported by its own alert, which says what
    # to look at, and again by the stock KubeJobFailed for the same Job. One is
    # enough. Matched on the Job itself, so a failed Job with no alert of its
    # own -- one started by hand to test something, say -- still gets
    # KubeJobFailed.
    - sourceMatch:
        - name: alertname
          value: "(Catcrawl|ColesCrawl|AldiCrawl|CatcrawlVacuum)JobFailed"
          matchType: "=~"
      targetMatch:
        - name: alertname
          value: KubeJobFailed
          matchType: "="
      equal:
        - namespace
        - job_name
    # A node under disk or memory pressure is reported by NodeDiskPressure and
    # NodeMemoryPressure, critical, two minutes in. The chart's KubeNodePressure
    # says it again at ten, as info. Held back here rather than switched off in
    # the chart, because it is also the only alert for PIDPressure; matching on
    # the condition leaves that one alone.
    - sourceMatch:
        - name: alertname
          value: "NodeDiskPressure|NodeMemoryPressure"
          matchType: "=~"
      targetMatch:
        - name: alertname
          value: KubeNodePressure
          matchType: "="
      equal:
        - node
        - condition
