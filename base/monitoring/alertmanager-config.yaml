# Global Alertmanager configuration (referenced by name from
# alertmanagerSpec.alertmanagerConfiguration in applications/kube-prometheus.yml).
#
# Why a CRD and not the chart's raw alertmanager.config: the raw path is parsed
# by the operator with a strict schema that has NO webhook_url_file for Discord
# (only webhook_url), so a file/secret-based webhook silently fails to provision
# and Alertmanager falls back to a null default config - alerts go nowhere.
# Here the webhook URL comes from a proper secret reference (ESO-synced from
# Vault, monitoring/external-secret.yaml) and never touches git.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: global-alertmanager-config
  namespace: monitoring
spec:
  route:
    receiver: discord
    groupBy:
      - alertname
      - namespace
      - severity
    groupWait: 30s
    groupInterval: 5m
    # Once: an alert is sent when it starts firing and, where the receiver
    # sends one, when it resolves, and not again in between. Until 2026-11-26
    # every firing alert was sent again every four hours: the Coles crawl that
    # failed on 2026-11-11 left ColesCrawlNoRecentSuccess firing for thirteen
    # days, about 75 Discord messages saying the same thing. A year is what
    # "never" can be here. It only holds while Alertmanager remembers having
    # sent the alert, which is for its retention, so that is a year too
    # (alertmanagerSpec.retention in applications/kube-prometheus.yml); its
    # default of 120h would send everything still firing again every five
    # days. Every route below inherits this.
    repeatInterval: 8760h
    routes:
      - receiver: "null"
        matchers:
          - name: alertname
            matchType: "=~"
            value: "InfoInhibitor|Watchdog"
      # Attacks on the Windows domain (windows-security-alerts.yaml, Loki's
      # ruler). Each says that something happened and ends by itself 10
      # minutes later, so they go to a receiver that sends no "resolved"
      # message: it would read as the attack being dealt with. Grouped by
      # server, so that a burst on one server is one message.
      - receiver: discord-security
        matchers:
          - name: category
            matchType: "="
            value: security
        groupBy:
          - alertname
          - hostname
      # Disks, pools and arrays of the two Proxmox hosts
      # (proxmox-storage-health.yaml). Grouped by host: both hosts raise the
      # same alert names, and a dozen drives on one of them is one message
      # about that host.
      - receiver: discord
        matchers:
          - name: alertname
            matchType: "=~"
            value: "Storage.+"
        groupBy:
          - alertname
          - instance
          - severity
      # The hardware notices (monitoring-hardware/rules.yaml). Each says that
      # something happened - the BMC logged an event, a host booted, a guest
      # stopped - and clears by itself after a while, whatever the state is
      # then. A "resolved" message would read as the thing being put right, so
      # they go to a receiver that sends none.
      - receiver: discord-notices
        matchers:
          - name: alertname
            matchType: "=~"
            value: "HardwareEventLogged|HardwareHostRestarted|ProxmoxGuestStopped"
        groupBy:
          - alertname
          - instance
  receivers:
    - name: "null"
    - name: discord-security
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-secret
            key: discord_webhook_url
          sendResolved: false
          title: '🚨 SECURITY: {{ .GroupLabels.alertname }}{{ with .GroupLabels.hostname }} on {{ . }}{{ end }}'
          message: |-
            {{ range .Alerts -}}
            > {{ .Annotations.summary }}
            {{ end }}
    - name: discord-notices
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-secret
            key: discord_webhook_url
          sendResolved: false
          title: 'ℹ️ NOTICE: {{ .GroupLabels.alertname }}'
          message: |-
            {{ range .Alerts -}}
            > {{ .Annotations.summary }}
            {{ end }}
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-secret
            key: discord_webhook_url
          sendResolved: true
          # The workload lines are for the chart's Deployment, StatefulSet and
          # DaemonSet alerts, whose summaries do not name what they are about.
          # On those the pod label is the kube-state-metrics pod the figure was
          # scraped from, not a pod of the workload, so it is left out.
          title: '{{ if eq .Status "firing" }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }}: {{ .GroupLabels.alertname }}{{ with .GroupLabels.namespace }} ({{ . }}){{ end }}'
          message: |-
            {{ range .Alerts -}}
            **{{ .Labels.alertname }}** | Severity: {{ .Labels.severity }}
            {{ if .Labels.namespace -}}Namespace: `{{ .Labels.namespace }}`
            {{ end -}}
            {{ if .Labels.deployment -}}Deployment: `{{ .Labels.deployment }}`
            {{ end -}}
            {{ if .Labels.statefulset -}}StatefulSet: `{{ .Labels.statefulset }}`
            {{ end -}}
            {{ if .Labels.daemonset -}}DaemonSet: `{{ .Labels.daemonset }}`
            {{ end -}}
            {{ if and .Labels.pod (not (or .Labels.deployment .Labels.statefulset .Labels.daemonset)) -}}Pod: `{{ .Labels.pod }}`
            {{ end -}}
            {{ if .Labels.node -}}Node: `{{ .Labels.node }}`
            {{ end -}}
            {{ if .Annotations.summary -}}> {{ .Annotations.summary }}
            {{ end -}}
            {{ end }}
  inhibitRules:
    - sourceMatch:
        - name: severity
          value: critical
          matchType: "="
      targetMatch:
        - name: severity
          value: "warning|info"
          matchType: "=~"
      equal:
        - namespace
        - alertname
    # While Coles is refusing the crawler (ColesCrawlBlocked, in
    # base/monitoring/alerts.yaml), everything that follows from that is held
    # back: it is one cause, and it was arriving as nine alerts. Two rules,
    # because the alerts it stands in for live in two places. (ArgoCD's alerts
    # for the catcrawl app were a third, until ArgoCDAppDegraded stopped firing
    # for that app at all.)
    #
    # The crawler's own alerts, except the two that are not about the run:
    # ColesCrawlNotScheduled (the CronJob not running at all) and
    # ColesCrawlMetricsMissing (which the blocked alert, reading those metrics,
    # could not stand in for).
    - sourceMatch:
        - name: alertname
          value: ColesCrawlBlocked
          matchType: "="
      targetMatch:
        - name: alertname
          value: "ColesCrawl(JobFailed|NoRecentSuccess|PartialFailure|ProductsDropped|PriceParseDegraded|BeingChallenged)"
          matchType: "=~"
    # The stock kube-prometheus alert for the same failed Jobs.
    - sourceMatch:
        - name: alertname
          value: ColesCrawlBlocked
          matchType: "="
      targetMatch:
        - name: alertname
          value: KubeJobFailed
          matchType: "="
        - name: job_name
          value: "catcrawl-col-scheduler-.*"
          matchType: "=~"
    # A failed crawl or vacuum Job is reported by its own alert, which says what
    # to look at, and again by the stock KubeJobFailed for the same Job. One is
    # enough. Matched on the Job itself, so a failed Job with no alert of its
    # own -- one started by hand to test something, say -- still gets
    # KubeJobFailed.
    - sourceMatch:
        - name: alertname
          value: "(Catcrawl|ColesCrawl|AldiCrawl|CatcrawlVacuum)JobFailed"
          matchType: "=~"
      targetMatch:
        - name: alertname
          value: KubeJobFailed
          matchType: "="
      equal:
        - namespace
        - job_name
    # A node under disk or memory pressure is reported by NodeDiskPressure and
    # NodeMemoryPressure, critical, two minutes in. The chart's KubeNodePressure
    # says it again at ten, as info. Held back here rather than switched off in
    # the chart, because it is also the only alert for PIDPressure; matching on
    # the condition leaves that one alone.
    - sourceMatch:
        - name: alertname
          value: "NodeDiskPressure|NodeMemoryPressure"
          matchType: "=~"
      targetMatch:
        - name: alertname
          value: KubeNodePressure
          matchType: "="
      equal:
        - node
        - condition
    # While the tunnel to LINDS is down, Prometheus (at JD) can scrape nothing
    # there, and every LINDS device would report down at once. That is one
    # cause, and RouterTunnelDown says it. Held back: the alerts on targets
    # labelled site="linds" (monitoring-hardware/scrape-configs.yaml),
    # PrometheusTargetDown for them included.
    - sourceMatch:
        - name: alertname
          value: RouterTunnelDown
          matchType: "="
        - name: conn
          value: LINDS
          matchType: "="
      targetMatch:
        - name: site
          value: linds
          matchType: "="
