          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "count(sum by (device) (count_over_time({job=\"syslog\", appname=\"unbound\", hostname=~\"$router\"} |= \"rpz: applied\" | pattern \"<_>rpz: applied [<list>] <_> <action> <device>@<_> <name>. <qtype> IN\" | action=\"rpz-nxdomain\" | list=~\"$list\" | device=~\"$device\" | name=~\"(?i).*$name.*\" [$__range])))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": null,
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
