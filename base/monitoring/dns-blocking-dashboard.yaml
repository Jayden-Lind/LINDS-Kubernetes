# Grafana dashboard for the DNS blocklists of jd-router-01 and
# linds-router-01 (Unbound). The Grafana dashboard sidecar reads it (label
# grafana_dashboard).
#
# GENERATED. Edit dns-blocking-dashboard.py and make this file again:
#   python3 base/monitoring/dns-blocking-dashboard.py > base/monitoring/dns-blocking-dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: dns-blocking-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Network
data:
  dns-blocking.json: |
    {
      "uid": "dns-blocking",
      "title": "DNS blocking",
      "description": "The names that Unbound on the two routers refuses: advertising, trackers, malware and phishing. Router side: LINDS-Ansible roles/router, \"DNS blocklists\".",
      "tags": [
        "dns",
        "network",
        "router",
        "logs"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "annotations": {
        "list": []
      },
      "links": [
        {
          "title": "Suricata",
          "type": "link",
          "url": "/d/suricata",
          "icon": "dashboard"
        },
        {
          "title": "Router",
          "type": "link",
          "url": "/d/router",
          "icon": "dashboard"
        }
      ],
      "templating": {
        "list": [
          {
            "name": "router",
            "label": "Router",
            "description": "The router that refused the question.",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "label": "hostname",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "{job=\"syslog\", appname=\"unbound\"}",
              "type": 1
            },
            "definition": "label_values({job=\"syslog\", appname=\"unbound\"}, hostname)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "list",
            "label": "List",
            "type": "custom",
            "description": "The list that refused the question. For a name on more than one list: malware and phishing first, then the first advertising list.",
            "query": "Malware and phishing : threats,Advertising and trackers : ads,Advertising and trackers (OISD) : oisd",
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "device",
            "label": "Device",
            "description": "The address that asked, as a regular expression. Example: 192[.]168[.]1[.]20 for one device.",
            "type": "textbox",
            "query": ".*",
            "current": {
              "text": ".*",
              "value": ".*"
            },
            "options": []
          },
          {
            "name": "name",
            "label": "Name contains",
            "description": "Text in the name.",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "options": []
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "id": 1,
          "title": "Refused",
          "description": "DNS questions that a blocklist refused. The device gets \"no such name\" at once. One page can ask for the same name more than once, and for more than one record type.",
