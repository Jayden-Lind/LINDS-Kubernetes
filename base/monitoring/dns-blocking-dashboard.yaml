            "x": 0,
            "y": 0,
            "w": 5,
            "h": 4
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({job=\"syslog\", appname=\"unbound\", hostname=~\"$router\"} |= \"rpz: applied\" | pattern \"<_>rpz: applied [<list>] <_> <action> <device>@<_> <name>. <qtype> IN\" | action=\"rpz-nxdomain\" | list=~\"$list\" | device=~\"$device\" | name=~\"(?i).*$name.*\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": null,
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Share of all lookups",
          "description": "Refused questions as a part of all questions to the routers.",
          "gridPos": {
            "x": 5,
            "y": 0,
            "w": 5,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(increase(router_dns_blocked_total{job=\"router-node\", instance=~\"$router\"}[$__range])) / sum(increase(router_dns_queries_total{job=\"router-node\", instance=~\"$router\"}[$__range]))",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 3,
          "title": "Devices with a refused lookup",
          "description": "Addresses that asked for a listed name. A DNS forwarder (the cluster's DNS, a domain controller) counts as one device.",
          "gridPos": {
            "x": 10,
            "y": 0,
            "w": 5,
            "h": 4
