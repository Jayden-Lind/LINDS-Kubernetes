# Prometheus Pushgateway, for batch jobs that exit before they can be scraped.
#
# catcrawl runs as a weekly CronJob: there is nothing listening between runs, so
# Prometheus cannot scrape it directly. The job pushes its outcome here at the
# end of each run and Prometheus scrapes this instead.
#
# Deliberately stateless (no PVC). If this pod restarts, the pushed values are
# lost until the next crawl. That is acceptable because:
#   * Prometheus keeps the scraped history in its own TSDB, so trend queries such
#     as max_over_time() are unaffected.
#   * The alerts that answer "did it run, did it fail" come from
#     kube-state-metrics, which observes the job from outside and does not depend
#     on this pod at all.
#   * A missing series makes an alert go quiet rather than fire falsely, and
#     CatcrawlMetricsMissing in alerts.yaml closes that gap explicitly.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pushgateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: pushgateway
          # Pinned rather than :latest so a new upstream release cannot change
          # behaviour, or force an unscheduled image pull, without a commit here.
          image: prom/pushgateway:v1.11.1
          args:
            - --web.listen-address=:9091
          # Note: the Pushgateway never expires metrics. A pushed value persists
          # until it is overwritten, the group is deleted via the API, or this
          # pod restarts. That is why staleness is judged from timestamps in the
          # alert expressions rather than from the presence of a series.
          ports:
            - name: http
              containerPort: 9091
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pushgateway
spec:
  selector:
    app.kubernetes.io/name: pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pushgateway
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pushgateway
    release: monitoring-kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pushgateway
  endpoints:
    - port: http
      interval: 60s
      # Essential for a pushgateway: without it Prometheus overwrites the pushed
      # job and instance labels with those of this scrape target, so every
      # pushing job would collapse into one identity and the store label would be
      # lost.
      honorLabels: true
