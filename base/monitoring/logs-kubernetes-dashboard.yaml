---
# Grafana dashboard: pod logs (Alloy -> Loki). Picked up by the kube-prometheus
# grafana dashboard sidecar via the grafana_dashboard label; grafana_folder puts
# it in the "Logs" folder. Generated once from a script - edit the JSON in place.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logs-kubernetes-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Logs
data:
  logs-kubernetes.json: |
    {
      "uid": "logs-kubernetes",
      "title": "Logs / Kubernetes",
      "description": "Pod logs shipped by Alloy (loki.source.kubernetes). Labels: namespace, app, pod, container, node; level comes from Loki's detected_level.",
      "tags": [
        "logs",
        "loki",
        "kubernetes"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "label": "namespace",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "",
              "type": 1
            },
            "definition": "label_values(namespace)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "app",
            "label": "App",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "label": "app",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "{namespace=~\"$namespace\"}",
              "type": 1
            },
            "definition": "label_values({namespace=~\"$namespace\"}, app)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "label": "pod",
              "refId": "LokiVariableQueryEditor-VariableQuery",
              "stream": "{namespace=~\"$namespace\", app=~\"$app\"}",
              "type": 1
            },
            "definition": "label_values({namespace=~\"$namespace\", app=~\"$app\"}, pod)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "level",
            "label": "Level",
            "type": "custom",
            "query": "debug,info,warn,error,unknown",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "search",
            "label": "Search (regex)",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "options": []
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "title": "Log lines",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=~\"$namespace\", app=~\"$app\", pod=~\"$pod\"} |~ \"(?i)$search\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Errors",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=~\"$namespace\", app=~\"$app\", pod=~\"$pod\"} |~ \"(?i)$search\" | detected_level=~\"error|fatal|critical\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              }
            },
            "overrides": []
          },
          "description": "Lines whose detected_level (set by Loki from the line itself) is error/fatal/critical."
        },
        {
          "type": "stat",
          "title": "Warnings",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=~\"$namespace\", app=~\"$app\", pod=~\"$pod\"} |~ \"(?i)$search\" | detected_level=\"warn\" [$__range]))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "orange"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Pods logging",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(sum by (pod) (count_over_time({namespace=~\"$namespace\", app=~\"$app\", pod=~\"$pod\"} |~ \"(?i)$search\" [$__range])))",
              "queryType": "instant"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Log volume by level",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (detected_level) (count_over_time({namespace=~\"$namespace\", app=~\"$app\", pod=~\"$pod\"} |~ \"(?i)$search\" [$__auto]))",
              "legendFormat": "{{detected_level}}",
              "queryType": "range"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 1,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "error"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "fatal"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "dark-red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "critical"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "dark-red"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "warn"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "info"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "debug"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "unknown"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "gray"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "timeseries",
          "title": "Log volume by app (top 10)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10, sum by (namespace, app) (count_over_time({namespace=~\"$namespace\", app=~\"$app\", pod=~\"$pod\"} |~ \"(?i)$search\" [$__auto])))",
              "legendFormat": "{{namespace}}/{{app}}",
              "queryType": "range"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 1,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "axisSoftMin": 0
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          }
        },
        {
          "type": "table",
          "title": "Errors by app",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(15, sum by (namespace, app) (count_over_time({namespace=~\"$namespace\", app=~\"$app\", pod=~\"$pod\"} |~ \"(?i)$search\" | detected_level=~\"error|fatal|critical\" [$__range])))",
              "queryType": "instant",
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value #A": "errors"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "errors",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "align": "auto",
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "errors"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 90
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "basic"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "table",
          "title": "Noisiest pods",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(15, sum by (namespace, pod) (count_over_time({namespace=~\"$namespace\", app=~\"$app\", pod=~\"$pod\"} |~ \"(?i)$search\" [$__range])))",
              "queryType": "instant",
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value #A": "lines"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "lines",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "footer": {
              "show": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "align": "auto",
                "filterable": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "lines"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 90
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "basic"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "logs",
          "title": "Logs",
          "gridPos": {
            "h": 16,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=~\"$namespace\", app=~\"$app\", pod=~\"$pod\"} |~ \"(?i)$search\" | detected_level=~\"$level\"",
              "queryType": "range",
              "maxLines": 2000
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none",
            "prettifyLogMessage": false,
            "showLabels": false,
            "showCommonLabels": false,
            "enableInfiniteScrolling": true
          },
          "description": "Filter with the variables above; click a line for its labels and structured metadata (detected_level, container, node)."
        }
      ],
      "annotations": {
        "list": []
      },
      "links": []
    }
