            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count((max_over_time(router_bgp_peer_up{instance=\"$router\", kind=\"cluster\"}[1d]) == 1 unless on (instance, peer) router_bgp_peer_up == 1) or router_bgp_peer_up{instance=\"$router\", kind=\"static\"} == 0) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
