                      "color": "#0ca30c",
                      "index": 0
                    },
                    "0": {
                      "text": "✗ Failing",
                      "color": "#d03b3b",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
