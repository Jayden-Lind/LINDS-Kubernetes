          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "router_wan_healthy{instance=\"$router\", wan=\"primary\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
