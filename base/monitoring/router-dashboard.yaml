---
# Grafana dashboard "Router": jd-router-01 at a glance, for troubleshooting.
# Picked up by the kube-prometheus grafana dashboard sidecar via the
# grafana_dashboard label; grafana_folder puts it in "Network".
#
# The data: the scrape jobs in router-metrics.yaml (router-node, with
# Unbound's DNS counters, router-frr, router-smokeping), Alloy's Suricata
# counters, and the router's syslog in Loki (the Logs row). The alerts in router-metrics.yaml
# show as annotations. Status tiles use the status colours with a text label
# (green "✓ Up", amber "⚠ Backup", red "✗ Down"); series use fixed colours
# per thing (validated for colour-blind readers on Grafana's dark and light
# panels), so a colour means the same network or target in every panel.
#
# The Router variable lists every router that reports router_wan_active.
# The names of networks and tunnels are JD's (lan0 = Main LAN, and so on);
# after the LINDS cutover, add overrides for linds-router-01's interfaces,
# or its panels show the device names in Grafana's default colours.
apiVersion: v1
kind: ConfigMap
metadata:
  name: router-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Network
data:
  router.json: |
    {
      "uid": "router",
      "title": "Router",
      "description": "jd-router-01 (and linds-router-01 after the cutover): WAN, tunnels, BGP, DHCP, DNS (Unbound), IDS and health. Config: LINDS-Ansible roles/router (README, Troubleshooting); scrape jobs and alerts: LINDS-Kubernetes base/monitoring/router-metrics.yaml.",
      "tags": [
        "router",
        "network"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "links": [
        {
          "title": "Suricata",
          "type": "link",
          "url": "/d/suricata-vyos",
          "icon": "dashboard"
        },
        {
          "title": "Network devices",
          "type": "link",
          "url": "/d/network-devices",
          "icon": "dashboard"
        },
        {
          "title": "Router log",
          "type": "link",
          "url": "/d/logs-syslog?var-hostname=${router}",
          "icon": "doc"
        }
      ],
      "annotations": {
        "list": [
          {
            "name": "Router alerts",
            "enable": true,
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "expr": "ALERTS{alertname=~\"Router.*\", alertstate=\"firing\"}",
            "step": "60s",
            "titleFormat": "{{alertname}}",
            "textFormat": "{{instance}}{{hostname}}",
            "iconColor": "#d03b3b",
            "useValueForTime": false
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "router",
            "label": "Router",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "qryType": 1,
              "query": "label_values(router_wan_active, instance)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "definition": "label_values(router_wan_active, instance)",
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "current": {
              "text": "jd-router-01",
              "value": "jd-router-01"
            },
            "options": []
          }
        ]
      },
      "panels": [
        {
          "type": "stat",
          "id": 1,
          "title": "WAN in use",
          "description": "Which WAN carries the default route (router_wan_active). A failover to the cellular modem shows here, and RouterOnBackupWAN fires after 10 minutes on it.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 3,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "✓ Primary",
                      "color": "#0ca30c",
                      "index": 0
                    },
                    "1": {
                      "text": "⚠ Backup",
                      "color": "#fab219",
                      "index": 1
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "textMode": "auto",
            "orientation": "auto",
            "wideLayout": true,
            "text": {
              "valueSize": 30
            },
            "showPercentChange": false
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "router_wan_active{instance=\"$router\", wan=\"backup\"}",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ]
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Primary WAN",
          "description": "Whether wan-failover's health checks pass for the primary WAN, so that its default route is installed.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
