apiVersion: v1
kind: PersistentVolume
metadata:
  name: linds-nfs-nas
  labels:
    storage.k8s.io/name: nfs
    storage.k8s.io/part-of: kubernetes-complete-reference
    volume.beta.kubernetes.io/mount-options: soft
spec:
  accessModes:
    - ReadWriteOnce
    - ReadOnlyMany
    - ReadWriteMany
  capacity:
    storage: 1Ti
  storageClassName: "manual"
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  nfs:
    server: linds-truenas-01.linds.com.au
    path: /mnt/ZFS_NAS
    readOnly: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linds-nfs-nas-pvc
  namespace: arr
spec:
  storageClassName: "manual"
  volumeName: linds-nfs-nas
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jackett
  namespace: arr
spec:
  selector:
    matchLabels:
      app: jackett
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jackett
    spec:
      terminationGracePeriodSeconds: 120
      nodeSelector:
        datacenter: linds
      containers:
        - name: jackett
          image: linuxserver/jackett:latest
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
          volumeMounts:
            - mountPath: /config
              name: arr-config
          ports:
            - containerPort: 9117
      restartPolicy: Always
      volumes:
        - name: arr-config
          persistentVolumeClaim:
            claimName: jackett-config
---
apiVersion: v1
kind: Service
metadata:
  name: jackett
  namespace: arr
spec:
  ports:
    - port: 9117
      targetPort: 9117
      protocol: TCP
      name: http
  selector:
    app: jackett
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jackett
  namespace: arr
  annotations:
    cert-manager.io/cluster-issuer: linds-ca
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: jackett.linds.com.au
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jackett
                port:
                  number: 9117
  tls:
    - hosts:
        - jackett.linds.com.au
      secretName: jackett-linds-com-au-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: arr
spec:
  selector:
    matchLabels:
      app: radarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: radarr
    spec:
      terminationGracePeriodSeconds: 120
      nodeSelector:
        datacenter: linds
      containers:
        - name: radarr
          image: linuxserver/radarr:latest
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
          env:
            - name: PGID
              value: "0"
            - name: PUID
              value: "1000"
            # Since the August 2026 releases, *arr only honours X-Forwarded-For
            # from proxies in Trusted Networks; without this every request via
            # ingress-nginx counts as remote and "Disabled for Local Addresses"
            # asks LAN and VPN clients to log in. 10.244.0.0/16 is the pod CIDR
            # (both ingress classes); clients of the public mTLS ingress still
            # resolve to their public address and get the login.
            - name: RADARR__SERVER__TRUSTEDNETWORKS
              value: 10.244.0.0/16
            # The host names Radarr answers to; any other Host header gets a
            # 400. They are the ingress host (both classes) and the Service
            # names that clients in the cluster use (Maintainerr uses
            # radarr.arr.svc.k8s.linds.com.au). localhost and the pod's own
            # name are always allowed, the pod IP is not. While this is unset
            # and logins are off for local addresses, Radarr shows the health
            # warning "Allowed Hosts is not configured".
            - name: RADARR__SERVER__ALLOWEDHOSTS
              value: radarr.linds.com.au,radarr.arr.svc.k8s.linds.com.au,radarr.arr.svc.cluster.local,radarr.arr.svc,radarr.arr,radarr
          volumeMounts:
            - mountPath: /config
              name: arr-config
            # The whole share, once, at the path qBittorrent uses
            # (LINDS-Ansible inventory/torrent.yml): downloads/ and Movies/
            # must be on one mount for imports to be hardlinks. Two subPath
            # mounts of the same share are two mounts, and link() across them
            # fails with EXDEV, so Radarr copies instead.
            - name: linds-nfs-nas
              mountPath: /mnt/nas
          ports:
            - containerPort: 7878
      restartPolicy: Always
      volumes:
        - name: arr-config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: linds-nfs-nas
          persistentVolumeClaim:
            claimName: linds-nfs-nas-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: arr
spec:
  ports:
    - port: 7878
      targetPort: 7878
      protocol: TCP
      name: http
  selector:
    app: radarr
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr
  namespace: arr
  annotations:
    cert-manager.io/cluster-issuer: linds-ca
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.org/websocket-services: "radarr"
    linds.com.au/mtls-mirror: "true"
    public.linds.com.au/publish: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: radarr.linds.com.au
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
  tls:
    - hosts:
        - radarr.linds.com.au
      secretName: radarr-linds-com-au-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: arr
spec:
  selector:
    matchLabels:
      app: sonarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      terminationGracePeriodSeconds: 120
      nodeSelector:
        datacenter: linds
      containers:
        - name: sonarr
          image: linuxserver/sonarr:latest
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
          env:
            - name: PGID
              value: "0"
            - name: PUID
              value: "1000"
            - name: SONARR_BRANCH
              value: main
            # See radarr above.
            - name: SONARR__SERVER__TRUSTEDNETWORKS
              value: 10.244.0.0/16
            - name: SONARR__SERVER__ALLOWEDHOSTS
              value: sonarr.linds.com.au,sonarr.arr.svc.k8s.linds.com.au,sonarr.arr.svc.cluster.local,sonarr.arr.svc,sonarr.arr,sonarr
          volumeMounts:
            - mountPath: /config
              name: arr-config
            # See radarr above. The root folders are /mnt/nas/TVShows and
            # /mnt/nas/torrent.
            - name: linds-nfs-nas
              mountPath: /mnt/nas
          ports:
            - containerPort: 8989
      restartPolicy: Always
      volumes:
        - name: arr-config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: linds-nfs-nas
          persistentVolumeClaim:
            claimName: linds-nfs-nas-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: arr
spec:
  ports:
    - port: 8989
      targetPort: 8989
      protocol: TCP
      name: http
  selector:
    app: sonarr
---
apiVersion: networking.k8s.io/v1
